      tags: [Finanzas]
      operationId: facturasCandidatasRecurrente
      summary: Facturas del proveedor que se pueden adjuntar
      description: 'Permiso: `gastos.registrar`. Las 20 más recientes del proveedor que aún no cubren ningún gasto recurrente.'
      x-permiso: gastos.registrar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
