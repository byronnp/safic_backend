        Permiso: `plataforma.condominios`. Crea el tipo con los valores de la amenidad y la vincula; el condominio la
        conserva sin cambios. 404 si la amenidad no es propia de ese condominio; 409 `AMENIDAD_EN_CATALOGO` si ya hay
