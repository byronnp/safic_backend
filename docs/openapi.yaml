      summary: Recordar por correo a quienes deben
      description: 'Permiso: `morosidad.gestionar` (administrador y tesorero). Sin `unidad_ids`, a todas las que tienen cuotas vencidas. Una vez al día por unidad; quien no tiene correo se cuenta aparte. Los recordatorios automáticos (3 días antes, el día y cada 15 días de atraso) los envía una tarea diaria.'
      x-permiso: morosidad.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        content:
