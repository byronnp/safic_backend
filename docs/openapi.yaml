openapi: 3.1.0
info:
  title: SAFIC API
  version: 0.1.0
  summary: Sistema de Administración Financiera de Condominios
  license:
    name: Propietario
    identifier: LicenseRef-SAFIC
  description: |
    API de SAFIC (`/api/v1`). Contrato vivo: toda ruta nueva se documenta aquí en el
    mismo pull request. La prueba `tests/Feature/Contrato/ContratoOpenApiTest.php`
    falla si una ruta de `routes/api.php` no está en este archivo o al revés.

    **Formato común**
    - Éxito: `{ "data": ..., "meta"?: {...}, "message"?: "..." }`
    - Error: `{ "error": { "code": "CODIGO_ESTABLE", "message": "...", "fields"?: {...}, "details"?: {...} } }`

    **Autenticación.** Access token JWT RS256 de 15 min en `Authorization: Bearer`.
    El refresh token rota en cada uso y dura 30 días: en web viaja en la cookie
    HttpOnly `safic_refresh` (ruta `/api/v1/auth`, SameSite=Strict); las apps
    móviles envían `X-Client-Type: mobile` y lo reciben y devuelven en el cuerpo.
    El JWT no lleva roles ni condominio.

    **Condominio.** Las rutas de negocio exigen `X-Condominio-Id` con un condominio
    en el que el usuario tenga membresía activa, y cada una su permiso.

    **Límites.** login: por correo e IP · refresh: 30/min por IP · negocio: 120/min por usuario.
servers:
  - url: http://localhost:8000/api/v1
    description: Local (Docker Compose)

tags:
  - name: Autenticación
    description: Login, renovación del token y cierre de sesión.
  - name: Sesión
    description: Usuario actual y su contexto (roles y permisos) en un condominio.
  - name: Unidades
    description: Bloques, unidades y residentes del condominio.
  - name: Usuarios
    description: Equipo del condominio (administradores, contador, guardia, mantenimiento) y cupo del plan.
  - name: Amenidades
    description: Amenidades del condominio (del catálogo o propias).
  - name: Finanzas
    description: Cobro de cuotas del condominio.
  - name: Catálogos
    description: Datos compartidos que no dependen del condominio.
  - name: Plataforma
    description: |
      Panel del super admin (`/plataforma/*`). Solo perfiles de plataforma (equipo 0);
      cada ruta exige su permiso de plataforma. No usa `X-Condominio-Id`.

security:
  - bearer: []

paths:
  /auth/login:
    post:
      tags: [Autenticación]
      operationId: login
      summary: Iniciar sesión
      security: []
      parameters:
        - $ref: '#/components/parameters/TipoCliente'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, maxLength: 255 }
      responses:
        '200':
          $ref: '#/components/responses/Token'
        '401':
          description: '`CREDENCIALES_INVALIDAS` (también si el usuario está inactivo).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /auth/refresh:
    post:
      tags: [Autenticación]
      operationId: refrescarToken
      summary: Renovar el access token
      description: |
        Usa la cookie `safic_refresh` (web) o `refresh_token` en el cuerpo (móvil) y
        entrega un par nuevo. Presentar un refresh ya usado revoca toda la familia
        de tokens (`REFRESH_REUTILIZADO`).
      security: []
      parameters:
        - $ref: '#/components/parameters/TipoCliente'
        - in: cookie
          name: safic_refresh
          required: false
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: 'Solo apps móviles (`X-Client-Type: mobile`).'
      responses:
        '200':
          $ref: '#/components/responses/Token'
        '401':
          description: '`REFRESH_INVALIDO` o `REFRESH_REUTILIZADO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /auth/logout:
    post:
      tags: [Autenticación]
      operationId: logout
      summary: Cerrar sesión
      description: |
        Revoca la familia del refresh token, envía el access token a la lista negra
        hasta que expire y borra la cookie.
      parameters:
        - $ref: '#/components/parameters/TipoCliente'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Solo apps móviles.
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaVacia' }
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /auth/me:
    get:
      tags: [Sesión]
      operationId: usuarioActual
      summary: Usuario actual y sus condominios
      responses:
        '200':
          description: Usuario con los condominios donde tiene membresía activa.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Usuario' }
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /me/contexto:
    get:
      tags: [Sesión]
      operationId: contextoCondominio
      summary: Roles y permisos en el condominio activo
      description: El frontend arma el menú y oculta botones con esto; la API igual exige cada permiso.
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Contexto del usuario en el condominio.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ContextoCondominio' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CondominioNoPermitido'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /me/menu:
    get:
      tags: [Sesión]
      operationId: menuCondominio
      summary: Menú del perfil en el condominio activo
      description: |
        Una hoja aparece si está asignada a uno de los perfiles (roles) del usuario en el
        condominio del header **y** el usuario tiene su permiso. Los módulos y secciones
        aparecen solo si les queda alguna hoja. Ocultar no es seguridad: cada ruta exige su permiso.
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Menú en el mismo formato que `ItemMenu` del frontend.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ItemMenu' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CondominioNoPermitido'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /usuarios:
    get:
      tags: [Usuarios]
      operationId: listarUsuarios
      summary: Equipo del condominio y cupo del plan
      description: |
        Permiso: `usuarios.gestionar`. Las personas con acceso al condominio, su perfil y si consumen cupo.
        `meta.cupo` trae el plan y cuántos usuarios administrativos usa (administrador, contador y tesorero
        cuentan; presidente, vicepresidente, secretario, guardia, mantenimiento y residentes no).
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Equipo ordenado por nombre.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UsuarioCondominio' }
                  meta:
                    type: object
                    required: [cupo]
                    properties:
                      cupo: { $ref: '#/components/schemas/CupoUsuarios' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    post:
      tags: [Usuarios]
      operationId: invitarUsuario
      summary: Sumar a una persona al equipo
      description: |
        Permiso: `usuarios.gestionar`. Perfiles: administrador, contador (con `acceso_hasta` obligatorio), guardia o
        mantenimiento; los cargos de la directiva se asignan aparte. Si el correo no tiene cuenta se crea inactiva y
        recibe la invitación para crear su contraseña; si ya tiene cuenta se suma sin invitación
        (`invitacion_enviada: false`). 409 `LIMITE_USUARIOS` si el perfil consume cupo y el plan no tiene lugar,
        409 `USUARIO_YA_EXISTE` si ya está en el equipo, 422 `CEDULA_EN_USO` si la cédula es de otra persona.
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitarUsuario' }
      responses:
        '201':
          description: Persona agregada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/UsuarioCondominio' }
                      - type: object
                        required: [invitacion_enviada]
                        properties:
                          invitacion_enviada: { type: boolean }
                  message: { type: string, examples: ['Invitación enviada.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          $ref: '#/components/responses/ConflictoUsuarios'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /usuarios/{usuario}:
    patch:
      tags: [Usuarios]
      operationId: actualizarUsuario
      summary: Cambiar el perfil, la vigencia o desactivar a una persona del equipo
      description: |
        Permiso: `usuarios.gestionar`. Solo viaja lo que cambia. Cambiar el perfil no quita los cargos de directiva.
        409: `USUARIO_PROPIO` (nadie cambia su propio acceso), `ULTIMO_ADMINISTRADOR` (el condominio no se queda
        sin administrador) y `LIMITE_USUARIOS` (pasar a un perfil que consume cupo o reactivar sin lugar en el plan).
        Una persona de otro condominio responde 404.
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizarUsuario' }
      responses:
        '200':
          description: Cambios guardados.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UsuarioCondominio' }
                  message: { type: string, examples: ['Cambios guardados.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoUsuarios'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /usuarios/{usuario}/invitacion:
    post:
      tags: [Usuarios]
      operationId: reenviarInvitacionUsuario
      summary: Reenviar la invitación a quien aún no creó su contraseña
      description: 'Permiso: `usuarios.gestionar`. Anula el enlace anterior y envía uno nuevo. 409 `USUARIO_ACTIVO` si ya tiene contraseña.'
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Invitación reenviada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UsuarioCondominio' }
                  message: { type: string, examples: ['Invitación reenviada.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoUsuarios'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /directiva:
    get:
      tags: [Usuarios]
      operationId: verDirectiva
      summary: Los cuatro cargos de la directiva y quién los ocupa
      description: |
        Permiso: `usuarios.gestionar`. Presidente, vicepresidente, secretario y tesorero, en ese orden. `estado`:
        `vigente`, `prorrogado` (venció el periodo y sigue hasta nombrar reemplazo) o `vacante`.
        `titular.sigue_siendo_propietario: false` avisa que vendió su unidad y ya no cumple el requisito.
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Cargos de la directiva.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CargoDirectiva' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /directiva/{cargo}/candidatos:
    get:
      tags: [Usuarios]
      operationId: candidatosDirectiva
      summary: Quién puede ocupar un cargo
      description: |
        Permiso: `usuarios.gestionar`. Los propietarios vigentes. Quien ya ocupa otro cargo (`ocupa_cargo`) o no tiene
        correo (`sin_correo`) aparece como no disponible. El titular actual del cargo no aparece.
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - $ref: '#/components/parameters/CargoDirectivaParametro'
      responses:
        '200':
          description: Candidatos ordenados por nombre.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CandidatoDirectiva' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /directiva/{cargo}:
    post:
      tags: [Usuarios]
      operationId: asignarCargoDirectiva
      summary: Nombrar a una persona en un cargo (o cambiar al titular)
      description: |
        Permiso: `usuarios.gestionar`. Un cargo lo ocupa una sola persona y una persona ocupa un solo cargo. Si el cargo
        tenía titular, su periodo se cierra hoy y pierde ese cargo (conserva sus demás perfiles). La persona debe ser
        propietaria y tener correo; si no tiene cuenta se crea y recibe la invitación. El tesorero consume cupo del plan.
        422: `NO_ES_PROPIETARIO`, `PERSONA_SIN_CORREO`, `CEDULA_EN_USO`. 409: `PERSONA_CON_CARGO`, `YA_ES_TITULAR`,
        `LIMITE_USUARIOS`.
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - $ref: '#/components/parameters/CargoDirectivaParametro'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AsignarCargo' }
      responses:
        '200':
          description: Cargo asignado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CargoDirectiva' }
                  message: { type: string, examples: ['Cargo asignado.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoUsuarios'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /amenidades:
    get:
      tags: [Amenidades]
      operationId: listarAmenidadesCondominio
      summary: Amenidades del condominio
      description: |
        Permiso: `amenidades.gestionar`. Todas, ordenadas por nombre, con su estado: `disponible`,
        `mantenimiento` (hasta `mantenimiento_hasta`; al pasar la fecha termina solo) o `inactiva`.
        `tipo` es el tipo del catálogo ("Área BBQ") o null si es propia del condominio.
      x-permiso: amenidades.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Amenidades del condominio.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AmenidadCondominio' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    post:
      tags: [Amenidades]
      operationId: agregarAmenidades
      summary: Agregar amenidades del catálogo o propias
      description: |
        Permiso: `amenidades.gestionar`. Una amenidad reservable con varias unidades se crea como registros
        separados ("Área BBQ 1", "Área BBQ 2", y la numeración sigue donde iba); una que no se reserva es un solo
        registro con su cantidad ("Ascensor (3)"). Una propia no puede llamarse como una del catálogo (422 en
        `nombre`). 422 `AMENIDAD_EXISTE` si algún nombre ya existe en el condominio. Responde las creadas.
      x-permiso: amenidades.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgregarAmenidad' }
      responses:
        '201':
          description: Amenidades creadas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AmenidadCondominio' }
                  message: { type: string, examples: ['Amenidad agregada.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /amenidades/catalogo:
    get:
      tags: [Amenidades]
      operationId: catalogoParaAmenidades
      summary: Tipos del catálogo para elegir
      description: 'Permiso: `amenidades.gestionar`. Los tipos activos del catálogo global (el mismo que usa el asistente de alta).'
      x-permiso: amenidades.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Catálogo ordenado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AmenidadCatalogo' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /amenidades/{amenidad}:
    patch:
      tags: [Amenidades]
      operationId: actualizarAmenidad
      summary: Cambiar ubicación, mantenimiento o estado
      description: |
        Permiso: `amenidades.gestionar`. Solo viaja lo que cambia. `mantenimiento_hasta` pone la amenidad en
        mantenimiento hasta esa fecha (no puede ser pasada); null la saca. `activa: false` la desactiva.
        Una amenidad de otro condominio responde 404.
      x-permiso: amenidades.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - name: amenidad
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizarAmenidad' }
      responses:
        '200':
          description: Cambios guardados.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AmenidadCondominio' }
                  message: { type: string, examples: ['Cambios guardados.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /roles:
    get:
      tags: [Usuarios]
      operationId: listarRolesCondominio
      summary: Roles que el condominio puede asignar, con sus permisos y menú
      description: |
        Permiso: `usuarios.gestionar`. Solo lectura: los roles los define la plataforma. Orden: roles de sistema,
        cargos de directiva y adicionales creados por la plataforma. Por rol: qué permisos tiene, cuántas personas lo
        tienen en este condominio, si consume cupo del plan y las pantallas del menú que vería. No incluye roles ni
        permisos de plataforma.
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Roles, catálogo de permisos y cupo del plan.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RolesCondominio' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /roles/solicitudes:
    post:
      tags: [Usuarios]
      operationId: solicitarRol
      summary: Pedir un rol nuevo a la plataforma
      description: |
        Permiso: `usuarios.gestionar`. Queda registrada (estado `pendiente`) y, si la plataforma configuró un correo de
        soporte, se le avisa. Máximo 5 solicitudes por hora y por persona (429 después).
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitarRol' }
      responses:
        '201':
          description: Solicitud registrada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, nombre, estado]
                    properties:
                      id: { type: integer }
                      nombre: { type: string }
                      estado: { type: string, enum: [pendiente] }
                  message: { type: string, examples: ['Solicitud enviada a la plataforma.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /finanzas/periodos:
    get:
      tags: [Finanzas]
      operationId: listarPeriodos
      summary: Meses emitidos del condominio
      description: 'Permiso: `finanzas.ver`. Del más reciente al más antiguo, con lo esperado y lo recaudado de cada mes.'
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Meses emitidos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PeriodoFinanciero' } }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
    post:
      tags: [Finanzas]
      operationId: emitirPeriodo
      summary: Emitir las cuotas ordinarias de un mes
      description: |
        Permiso: `cuotas.emitir`. Cada unidad con cuota mensual recibe una cuota por ese valor, con el vencimiento del
        cobro (día 1–28, o el último día si es 0). Emitir otra vez el mismo mes solo agrega las unidades que faltaban:
        no duplica ni cambia lo emitido. 409: `COBRO_SIN_CONFIGURAR`, `PERIODO_ANTERIOR_AL_COBRO` (antes de `aplica_desde`),
        `PERIODO_FUTURO` (solo el mes en curso o anteriores), `PERIODO_CERRADO`, `SIN_UNIDADES_A_COBRAR`.
      x-permiso: cuotas.emitir
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodo]
              properties:
                periodo: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$', examples: ['2026-09'] }
      responses:
        '201':
          description: Cuotas emitidas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/EmisionPeriodo' }
                  message: { type: string, examples: ['Cuotas emitidas.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          description: Código de error en `error.code` (ver la descripción).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: El mes no es válido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /finanzas/resumen:
    get:
      tags: [Finanzas]
      operationId: resumenFinanciero
      summary: Resumen financiero de un mes
      description: |
        Permiso: `finanzas.ver`. Lo esperado y lo recaudado son del mes pedido (sin `periodo`, el mes en curso). La cartera
        vencida y su antigüedad son de todas las cuotas con saldo, contadas a hoy en la hora del condominio. Los gastos,
        la conciliación y los pagos recientes llegan con sus propios módulos.
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: periodo, in: query, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }
      responses:
        '200':
          description: Resumen del mes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ResumenFinanciero' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          description: El mes no es válido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /cobro:
    get:
      tags: [Finanzas]
      operationId: verCobro
      summary: Cobro de cuotas del condominio
      description: |
        Permiso: `condominio.editar`. La configuración vigente (sin configuración devuelve el valor general
        con `configurado: false`), las unidades por tipo para proyectar la próxima emisión y el historial de
        cambios, que sale de la auditoría (el más reciente primero). Las acciones del equipo de la plataforma
        se muestran como `Equipo SAFIC`.
      x-permiso: condominio.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Cobro de cuotas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CobroCuotas' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    put:
      tags: [Finanzas]
      operationId: guardarCobro
      summary: Cambiar el cobro de cuotas
      description: |
        Permiso: `condominio.editar`. Reemplaza la configuración completa. Rige desde `aplica_desde` (desde el mes
        siguiente hasta 12 meses adelante); las cuotas ya emitidas no cambian y el cambio queda en la auditoría.
        409 `UNIDADES_SIN_ALICUOTA` / `UNIDADES_SIN_CUOTA` si se pasa a alícuota o a por unidad y a alguna unidad
        le falta ese dato (`error.details.unidades` trae cuántas).
      x-permiso: condominio.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarCobro' }
      responses:
        '200':
          description: Cobro guardado (misma forma que `GET /cobro`).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CobroCuotas' }
                  message: { type: string, examples: ['Cambios guardados.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          description: '`UNIDADES_SIN_ALICUOTA` o `UNIDADES_SIN_CUOTA`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /condominio:
    get:
      tags: [Plataforma]
      operationId: verDatosCondominio
      summary: Datos del propio condominio
      description: 'Permiso: `condominio.editar`. Datos generales, ubicación y apariencia del condominio del header.'
      x-permiso: condominio.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Datos del condominio.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DatosCondominio' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    patch:
      tags: [Plataforma]
      operationId: actualizarDatosCondominio
      summary: Editar los datos del propio condominio
      description: |
        Permiso: `condominio.editar`. Nombre, contacto, dirección, ubicación y colores. El RUC, la razón social,
        el tipo y el plan no se cambian aquí (los gestiona la plataforma).
      x-permiso: condominio.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizarDatosCondominio' }
      responses:
        '200':
          description: Datos guardados.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DatosCondominio' }
                  message: { type: string, examples: ['Cambios guardados.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /condominio/logo/{variante}:
    post:
      tags: [Plataforma]
      operationId: subirLogoCondominio
      summary: Subir el logo del condominio
      description: |
        Permiso: `condominio.editar`. PNG de hasta 1 MB y entre 64 y 2000 píxeles por lado (no se acepta SVG).
        Reemplaza el logo de esa variante y borra el anterior.
      x-permiso: condominio.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - $ref: '#/components/parameters/VarianteLogo'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary }
      responses:
        '200':
          description: Logo guardado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DatosCondominio' }
                  message: { type: string, examples: ['Logo guardado.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    delete:
      tags: [Plataforma]
      operationId: quitarLogoCondominio
      summary: Quitar el logo del condominio
      description: 'Permiso: `condominio.editar`. Borra el logo de esa variante y su archivo.'
      x-permiso: condominio.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - $ref: '#/components/parameters/VarianteLogo'
      responses:
        '200':
          description: Logo quitado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DatosCondominio' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /marca/{codigo}/logo/{variante}:
    get:
      tags: [Plataforma]
      operationId: verLogoCondominio
      summary: Logo del condominio (público)
      description: |
        Sin sesión: el logo aparece en el login, recibos y correos. Responde la imagen PNG con caché de un día;
        404 si el condominio no tiene logo de esa variante.
      security: []
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string }, example: SF-0001 }
        - $ref: '#/components/parameters/VarianteLogo'
      responses:
        '200':
          description: Imagen PNG.
          content:
            image/png:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /bloques:
    get:
      tags: [Unidades]
      operationId: listarBloques
      summary: Listar bloques del condominio
      description: 'Permiso: `unidades.ver`. Orden: `orden`, luego `nombre`.'
      x-permiso: unidades.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Bloques del condominio activo.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Bloque' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    post:
      tags: [Unidades]
      operationId: crearBloque
      summary: Crear un bloque
      description: 'Permiso: `unidades.editar`. El nombre es único dentro del condominio.'
      x-permiso: unidades.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, maxLength: 60, examples: ['Torre A'] }
                orden: { type: integer, minimum: 0, maximum: 999, default: 0 }
      responses:
        '201':
          description: Bloque creado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Bloque' }
                  message: { type: string, examples: ['Bloque creado.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /unidades:
    get:
      tags: [Unidades]
      operationId: listarUnidades
      summary: Listar unidades del condominio
      description: 'Permiso: `unidades.ver`. Paginado y ordenado por código.'
      x-permiso: unidades.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - in: query
          name: buscar
          description: Parte del código (ej. `A-1`), del nombre de un ocupante vigente o de una placa (con o sin guion).
          schema: { type: string }
        - in: query
          name: tipo
          schema: { $ref: '#/components/schemas/TipoUnidad' }
        - in: query
          name: estado
          schema: { type: string, enum: [ocupada, arrendada, vacia] }
        - in: query
          name: bloque_id
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: por_pagina
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Página de unidades.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Unidad' }
                  meta:
                    type: object
                    required: [pagination]
                    properties:
                      pagination: { $ref: '#/components/schemas/Paginacion' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    post:
      tags: [Unidades]
      operationId: crearUnidad
      summary: Crear una unidad
      description: |
        Permiso: `unidades.editar`. Los montos dependen del método de cobro del condominio
        (ver `GET /unidades/resumen`): `alicuota` exige `alicuota` y admite `valor_personalizado`;
        `tipo` admite `valor_personalizado`; `unidad` exige `cuota_mensual`; `general` no pide montos.
        Departamentos, casas y locales cuentan para el total contratado: sin cupo responde 409 `LIMITE_UNIDADES`.
      x-permiso: unidades.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarUnidad' }
      responses:
        '201':
          description: Unidad creada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Unidad' }
                  message: { type: string, examples: ['Unidad creada.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          $ref: '#/components/responses/LimiteUnidades'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /unidades/importacion/plantilla:
    get:
      tags: [Unidades]
      operationId: plantillaImportacionUnidades
      summary: Plantilla de Excel para importar unidades
      description: |
        Permiso: `unidades.editar`. Descarga un .xlsx con la hoja `Unidades` (solo los títulos de columna)
        y la hoja `Instrucciones`. Las columnas dependen del método de cobro del condominio.
      x-permiso: unidades.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Archivo .xlsx.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /unidades/importacion:
    post:
      tags: [Unidades]
      operationId: importarUnidades
      summary: Importar unidades desde Excel (vista previa o creación)
      description: |
        Permiso: `unidades.editar`. Recibe el .xlsx (máx. 2 MB y 500 filas) en `multipart/form-data`.
        Sin `confirmar` solo valida y responde 200 con la vista previa (errores por fila, bloques que se crearían
        y si alcanza el total contratado); no guarda nada. Con `confirmar=1` crea todas las unidades o ninguna:
        201 si salió bien, 422 `IMPORTACION_CON_ERRORES` si alguna fila tiene error (`error.details.errores`),
        409 `LIMITE_UNIDADES` si no alcanza el total contratado. Cada fila usa las reglas de `POST /unidades`;
        los bloques que no existen se crean. Otros 422: `IMPORTACION_COLUMNAS`, `IMPORTACION_ARCHIVO_INVALIDO`,
        `IMPORTACION_MUY_GRANDE`, `IMPORTACION_VACIA`.
      x-permiso: unidades.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary, description: 'Excel .xlsx (plantilla).' }
                confirmar: { type: boolean, description: 'true crea las unidades; omitido o false solo valida.' }
      responses:
        '200':
          description: Vista previa (no se guardó nada).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ResultadoImportacionUnidades' }
        '201':
          description: Unidades creadas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ResultadoImportacionUnidades' }
                  message: { type: string, examples: ['Unidades importadas.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          $ref: '#/components/responses/LimiteUnidades'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /garita/directorio:
    get:
      tags: [Unidades]
      operationId: directorioGarita
      summary: Directorio de garita (nombre, unidad, teléfono y placas)
      description: |
        Permiso: `garita.directorio` (guardia y administrador). Busca por nombre de un ocupante vigente,
        código de unidad o placa (con o sin guion). Máximo 20 unidades por consulta y 30 consultas por minuto.
        Es una lista cerrada: devuelve nombre, relación, unidad, bloque, **teléfono completo** y vehículos;
        nunca cédula ni correo. El teléfono completo solo sale aquí; en el resto de la API sigue enmascarado
        sin `residentes.ver_datos`.
      x-permiso: garita.directorio
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - name: buscar
          in: query
          required: true
          description: Al menos 2 letras o números; máximo 60 caracteres.
          schema: { type: string, minLength: 2, maxLength: 60 }
      responses:
        '200':
          description: Unidades que coinciden (puede ser una lista vacía).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 20
