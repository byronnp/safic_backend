            cobrado: { type: object, properties: { monto: { type: string }, porcentaje: { type: number } } }
            por_aprobar: { type: object, properties: { monto: { type: string }, comprobantes: { type: integer } } }
            vencido_anterior: { type: object, properties: { monto: { type: string }, unidades: { type: integer } } }
