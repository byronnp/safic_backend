          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`CONVENIO_NO_ACTIVO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /finanzas/reportes/{reporte}:
    get:
      tags: [Finanzas]
      operationId: verReporte
      summary: Un reporte financiero en pantalla
      description: |
        Permiso: `finanzas.ver`. Siempre la misma forma: `columnas` (clave, etiqueta y tipo: texto, dinero, entero o
        porcentaje) y `filas` con esas claves. Los montos son texto decimal. Ningún reporte trae cédula, teléfono ni correo.
        Reportes: `ingresos_gastos` (cobros, gastos por categoría, resultado y saldo de cada banco), `cartera_antiguedad`
        (por unidad y tramo), `recaudacion_mensual` (últimos 12 meses), `conciliaciones` (por cuenta), `gastos_proveedor` y
        `estados_cuenta` (todas las unidades).
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: reporte, in: path, required: true, schema: { type: string, enum: [ingresos_gastos, cartera_antiguedad, recaudacion_mensual, conciliaciones, gastos_proveedor, estados_cuenta] } }
        - { name: periodo, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$', examples: ['2026-09'] }, description: 'Mes del reporte; por defecto el mes en curso. Los reportes de «a la fecha» (cartera, estados de cuenta) lo ignoran.' }
      responses:
        '200':
          description: Reporte.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Reporte' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'

  /finanzas/reportes/{reporte}/excel:
    get:
      tags: [Finanzas]
      operationId: exportarReporte
      summary: Exportar un reporte a Excel
      description: |
        Permiso: `finanzas.exportar` (administrador, tesorero y contador). El archivo lleva un código único (`EXP-7Q2K`)
        dentro y en el nombre, y queda en la bitácora de exportaciones (cabecera `X-Codigo-Exportacion`). Cada persona
        puede exportar hasta 30 archivos por día (429 `LIMITE_EXPORTACIONES`). Los montos van como números.
      x-permiso: finanzas.exportar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: reporte, in: path, required: true, schema: { type: string, enum: [ingresos_gastos, cartera_antiguedad, recaudacion_mensual, conciliaciones, gastos_proveedor, estados_cuenta] } }
        - { name: periodo, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$', examples: ['2026-09'] }, description: 'Mes del reporte; por defecto el mes en curso. Los reportes de «a la fecha» (cartera, estados de cuenta) lo ignoran.' }
      responses:
        '200':
          description: Archivo Excel.
          headers:
            X-Codigo-Exportacion: { schema: { type: string, examples: ['EXP-7Q2K'] } }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /finanzas/exportaciones:
    get:
      tags: [Finanzas]
      operationId: listarExportaciones
      summary: Últimas exportaciones
      description: 'Permiso: `finanzas.ver`. Las 20 más recientes del condominio, con su código, quién las hizo y cuándo. Es la bitácora de exportaciones (la del contador incluida).'
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Exportaciones.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Exportacion' } }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'

  /finanzas/recurrentes:
    get:
      tags: [Finanzas]
      operationId: listarGastosRecurrentes
      summary: Gastos recurrentes y su estado en un mes
      description: |
        Permiso: `finanzas.ver`. Cada gasto trae lo que pasa en el mes (`mes.estado`: `programado` antes de su día,
        `falta_factura` desde su día, `factura_recibida`, `pausado`). `meta.resumen`: lo comprometido al mes (solo montos
        fijos, sin luz ni agua), cuántas facturas faltan y el próximo gasto.
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: periodo, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, description: 'Mes; por defecto el mes en curso.' }
      responses:
        '200':
          description: Gastos recurrentes.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/GastoRecurrente' } }
                  meta:
                    type: object
                    properties:
                      resumen:
                        type: object
                        properties:
                          comprometido: { type: string }
                          por_adjuntar: { type: integer }
                          proximo:
                            oneOf:
                              - type: object
                                properties:
                                  nombre: { type: string }
                                  fecha: { type: string, format: date }
                              - { type: 'null' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'
    post:
      tags: [Finanzas]
      operationId: crearGastoRecurrente
      summary: Crear un gasto recurrente
      description: 'Permiso: `gastos.registrar`. Si ya pasó su día de este mes, se crea la ocurrencia del mes y se avisa por correo a administración y tesorería que falta la factura. 422 `PROVEEDOR_INVALIDO`, `APROBACION_SIN_MONTO`.'
      x-permiso: gastos.registrar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, proveedor_id, dia_mes]
              properties:
                nombre: { type: string, minLength: 3, maxLength: 80 }
                proveedor_id: { type: integer }
                categoria: { type: [string, 'null'], maxLength: 60 }
                monto: { type: [string, 'null'], examples: ['1250.00'], description: 'Sin monto = variable (luz, agua).' }
                dia_mes: { type: integer, minimum: 1, maximum: 28 }
                aprobacion_automatica: { type: boolean, description: 'Nivel 1 automático si la factura coincide con el monto; exige monto fijo.' }
      responses:
        '201':
          description: Gasto recurrente creado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GastoRecurrente' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'

  /finanzas/recurrentes/{recurrente}:
    patch:
      tags: [Finanzas]
      operationId: editarGastoRecurrente
      summary: Editar, pausar o reactivar un gasto recurrente
      description: 'Permiso: `gastos.registrar`. Solo viaja lo que cambia. `activo: false` lo pausa (no se crea el del mes).'
      x-permiso: gastos.registrar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: recurrente, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, minLength: 3, maxLength: 80 }
                proveedor_id: { type: integer }
                categoria: { type: [string, 'null'], maxLength: 60 }
                monto: { type: [string, 'null'], examples: ['1250.00'], description: 'Sin monto = variable (luz, agua).' }
                dia_mes: { type: integer, minimum: 1, maximum: 28 }
                aprobacion_automatica: { type: boolean, description: 'Nivel 1 automático si la factura coincide con el monto; exige monto fijo.' }
                activo: { type: boolean }
      responses:
        '200':
          description: Gasto recurrente actualizado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GastoRecurrente' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'

  /finanzas/recurrentes/{recurrente}/facturas:
