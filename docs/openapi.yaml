      responses:
        '200':
          description: Facturas candidatas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        numero: { type: string }
                        fecha_emision: { type: string, format: date }
                        total: { type: string }
                        estado: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /finanzas/recurrentes/{recurrente}/factura:
    post:
      tags: [Finanzas]
      operationId: vincularFacturaRecurrente
      summary: Adjuntar la factura real de un gasto recurrente en un mes
      description: |
        Permiso: `gastos.registrar`. La factura debe ser del mismo proveedor y no estar vinculada a otro gasto. Si el gasto
        tiene aprobación automática y la factura coincide con su monto, el nivel 1 se da solo (queda el registro, sin
        persona; `meta.aprobada_automaticamente`); sobre el umbral sigue faltando la segunda aprobación.
        409 `AUN_NO_SE_CREA`, `YA_TIENE_FACTURA`, `FACTURA_YA_VINCULADA`, `PERIODO_CERRADO`; 422 `PROVEEDOR_DISTINTO`.
      x-permiso: gastos.registrar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: recurrente, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodo, gasto_id]
              properties:
                periodo: { type: string, pattern: '^\d{4}-\d{2}$', examples: ['2026-10'] }
                gasto_id: { type: integer }
      responses:
        '200':
          description: Factura vinculada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GastoRecurrente' }
                  meta: { type: object, properties: { aprobada_automaticamente: { type: boolean } } }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`AUN_NO_SE_CREA`, `YA_TIENE_FACTURA`, `FACTURA_YA_VINCULADA` o `PERIODO_CERRADO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /finanzas/caja-chica:
    get:
      tags: [Finanzas]
      operationId: verCajaChica
      summary: Estado de la caja chica
      description: |
        Permiso: `finanzas.ver` o `cajachica.registrar`. El fondo, lo gastado desde la última reposición, lo disponible,
        los movimientos abiertos (con un enlace temporal a su respaldo) y la última reposición.
      x-permiso: finanzas.ver|cajachica.registrar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Estado de la caja chica.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CajaChica' }
                  meta: { type: object }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
