  /auth/invitaciones/{token}/aceptar:
    post:
      tags: [Autenticación]
      operationId: aceptarInvitacion
      summary: Crear la contraseña, aceptar el aviso de privacidad y activar la cuenta
      description: |
        Exige `acepta_privacidad: true` (LOPDP): se registra la versión del aviso, la fecha,
        la IP y el navegador. Después, la SPA inicia sesión con `/auth/login` usando el correo devuelto.
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenInvitacion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, password_confirmation, acepta_privacidad]
              properties:
                password:
                  type: string
                  minLength: 10
                  description: Al menos 10 caracteres, con letras y números.
                password_confirmation: { type: string }
                acepta_privacidad:
                  type: boolean
                  const: true
                  description: Aceptación del aviso de privacidad vigente (`aviso_privacidad_version` de la invitación).
                aviso_privacidad_version:
                  type: string
                  description: 'Versión que la persona leyó (la de `GET` de la invitación). Si ya no es la vigente responde 409 `AVISO_ACTUALIZADO`.'
      responses:
        '200':
          description: Contraseña creada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [email]
                    properties:
                      email: { type: string, format: email }
                  message: { type: string }
        '404':
          $ref: '#/components/responses/InvitacionInvalida'
        '409':
          description: '`AVISO_ACTUALIZADO`: el aviso de privacidad cambió desde que se cargó la página.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

