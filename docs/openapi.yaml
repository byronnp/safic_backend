      tags: [Plataforma]
      operationId: editarTipoAmenidad
      summary: Editar un tipo del catálogo
      description: |
        Permiso: `plataforma.condominios`. Solo viaja lo que cambia. Los valores sugeridos no alteran a los
        condominios que ya la configuraron (reciben una copia). `activa: false` la oculta del catálogo.
      x-permiso: plataforma.condominios
      parameters:
        - { name: amenidad, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarCatalogoAmenidad' }
      responses:
        '200':
          description: Cambios guardados.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CatalogoAmenidadAdmin' }
