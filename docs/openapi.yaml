  /finanzas/morosidad:
    get:
      tags: [Finanzas]
      operationId: listarMorosidad
      summary: Cartera vencida por unidad
      description: |
        Permiso: `finanzas.ver`. Las unidades con cuotas vencidas, de la que más atraso tiene a la que menos, con su
        situación (`restringida`, `notificada` con la fecha en que restringe, `convenio` con su cuota, `recordatorio` con
        la fecha del último aviso o `ninguna`). `en_mora` es verdadero cuando la cuota vencida más antigua pasó los días de
        gracia y no hay un convenio al día. `meta` trae el resumen (cartera y unidades por antigüedad), los conteos de cada
        filtro y las reglas vigentes.
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: filtro, in: query, schema: { type: string, enum: [todas, en_mora, restringidas, convenio] } }
        - { name: buscar, in: query, schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: por_pagina, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: Cartera vencida.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/UnidadMorosa' } }
                  meta:
                    type: object
                    properties:
                      resumen: { type: object, additionalProperties: true }
                      conteos: { type: object, additionalProperties: { type: integer } }
                      reglas: { type: object, additionalProperties: { type: integer } }
