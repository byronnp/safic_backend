      summary: Franjas de un área por día
      description: |
        Permiso `reservas.propias`. Por día, las franjas del área (seguidas, de la duración mínima) con su estado: `libre`, `ocupada`
        o `cerrada` (día no habilitado, fuera de la ventana de anticipación o en mantenimiento). 409 `AREA_SIN_REGLAS`.
      x-permiso: reservas.propias
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: amenidad, in: path, required: true, schema: { type: integer } }
        - { name: desde, in: query, required: false, schema: { type: string, format: date }, description: Hoy por defecto. }
        - { name: dias, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 14, default: 7 } }
      responses:
        '200':
          description: Disponibilidad por día.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DiaDisponible' } }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`AREA_SIN_REGLAS`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /mis-reservas:
    get:
      tags: [Reservas]
      operationId: listarMisReservas
      summary: Reservas de mis unidades
      description: Permiso `reservas.propias`. Las próximas primero (la más cercana arriba) y luego el historial.
      x-permiso: reservas.propias
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Reservas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MiReserva' } }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
    post:
      tags: [Reservas]
      operationId: reservarArea
      summary: Reservar un área común
      description: |
        Permiso `reservas.propias`. Con aprobación del administrador queda `pendiente`; sin ella, `confirmada`. Dos reservas vivas
        del mismo área no se cruzan (lo garantiza la base). 403 `UNIDAD_NO_ES_SUYA`; 409 `HORARIO_OCUPADO`, `TOPE_MENSUAL`,
        `AREA_EN_MANTENIMIENTO`, `AREA_NO_DISPONIBLE`, `AREA_SIN_REGLAS`; 422 `REGLAMENTO_NO_ACEPTADO`, `DIA_NO_HABILITADO`,
        `HORARIO_NO_VALIDO`, `ANTICIPACION_INSUFICIENTE`, `DEMASIADO_ADELANTE`.
      x-permiso: reservas.propias
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amenidad_id, unidad_id, fecha, inicio, horas, acepta_reglamento]
              properties:
                amenidad_id: { type: integer }
                unidad_id: { type: integer }
                fecha: { type: string, format: date }
                inicio: { type: string, examples: ['10:00'] }
                horas: { type: integer, minimum: 1 }
                acepta_reglamento: { type: boolean }
      responses:
        '201':
          description: Reserva creada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MiReserva' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Conflicto de horario, tope mensual o área no disponible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /mis-reservas/{reserva}/cancelar:
    post:
      tags: [Reservas]
      operationId: cancelarMiReserva
      summary: Cancelar una reserva futura de mi unidad
      description: Permiso `reservas.propias`. Libera el horario. 404 si no es de mis unidades; 409 `RESERVA_NO_CANCELABLE` si ya pasó o ya no está viva.
      x-permiso: reservas.propias
      parameters:
        - $ref: '#/components/parameters/CondominioId'
