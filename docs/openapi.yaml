  /areas-comunes/bloqueos:
    post:
      tags: [Reservas]
      operationId: bloquearArea
      summary: Bloquear un área un día o unas horas
      description: |
        Permiso `reservas.gestionar`. Sin `inicio` ni `fin` bloquea todo el día. Si ya hay reservas vivas encima responde
        409 `HAY_RESERVAS_AFECTADAS` (`details.reservas`) y no bloquea; con `cancelar_reservas: true` las cancela y avisa a cada
        residente. 422 `FECHA_PASADA`, `HORAS_INCOMPLETAS`, `HORAS_INVERTIDAS`.
      x-permiso: reservas.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amenidad_id, fecha, motivo]
              properties:
                amenidad_id: { type: integer }
                fecha: { type: string, format: date }
                inicio: { type: [string, 'null'], examples: ['10:00'] }
                fin: { type: [string, 'null'], examples: ['12:00'] }
                motivo: { type: string, minLength: 3, maxLength: 120 }
                cancelar_reservas: { type: boolean, default: false }
      responses:
        '201':
          description: Área bloqueada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, reservas_canceladas]
                    properties:
                      id: { type: integer }
                      reservas_canceladas: { type: integer }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`HAY_RESERVAS_AFECTADAS`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

