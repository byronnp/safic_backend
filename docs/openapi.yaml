              total_pendiente: { type: string }
              vencidas: { type: integer }
              saldo_favor: { type: string }
              cuotas:
                type: array
                description: Solo con saldo, de la más antigua a la más reciente.
                items:
                  type: object
                  required: [id, periodo, concepto, detalle, monto, saldo, vence_el, estado]
                  properties:
                    id: { type: integer }
                    periodo: { type: string, examples: ['2026-09'] }
                    concepto: { type: string, enum: [ordinaria, extraordinaria] }
                    detalle: { type: [string, 'null'], description: En qué consiste (cuotas extraordinarias). }
                    monto: { type: string }
                    saldo: { type: string }
                    vence_el: { type: string, format: date }
                    estado: { type: string, enum: [pendiente, vencida, en_revision] }
              pagos:
                type: array
                description: Los 10 últimos, del más reciente al más antiguo.
                items:
                  type: object
                  required: [id, monto, estado, fecha, numero_comprobante, motivo_rechazo, recibo, cuotas]
                  properties:
                    id: { type: integer }
                    monto: { type: string }
                    estado: { type: string, enum: [pendiente, aprobado, rechazado, anulado] }
                    fecha: { type: string, format: date }
                    numero_comprobante: { type: [string, 'null'] }
                    motivo_rechazo: { type: [string, 'null'] }
                    recibo: { type: [string, 'null'], examples: ['000358'], description: Número del recibo; con él se descarga el PDF. }
                    cuotas: { type: array, items: { type: string, examples: ['2026-09'] } }
    PagoResumen:
      type: object
      required: [id, unidad_id, unidad, pagador, banco, metodo, monto, fecha, numero_comprobante, cuotas, estado, motivo_rechazo, recibo]
      properties:
        id: { type: integer }
        unidad_id: { type: integer }
        unidad: { type: string, examples: ['A-102'] }
        pagador: { type: [string, 'null'] }
        banco: { type: [string, 'null'] }
        metodo: { type: string, enum: [transferencia, efectivo] }
        monto: { type: string }
        fecha: { type: string, format: date }
        numero_comprobante: { type: [string, 'null'] }
        cuotas: { type: array, items: { type: string, examples: ['2026-09'] } }
        estado: { type: string, enum: [pendiente, aprobado, rechazado, anulado] }
        motivo_rechazo: { type: [string, 'null'] }
        recibo: { type: [string, 'null'], examples: ['000358'] }
        validacion:
          type: [object, 'null']
          description: Resumen de las validaciones de un pago pendiente (null en los demás).
          properties:
            nivel: { type: string, enum: [ok, error] }
            texto: { type: string, examples: ['Todo coincide', 'Monto no cubre', 'Cuotas cambiaron'] }
    PagoDetalle:
      type: object
      required: [id, unidad, monto, estado, validaciones, aplicacion, cuotas, tolerancia]
      properties:
        id: { type: integer }
        unidad_id: { type: integer }
        unidad: { type: string }
        pagador: { type: [string, 'null'] }
        metodo: { type: string }
        monto: { type: string, description: Lo declarado; al aprobar queda lo recibido. }
        diferencia: { type: string, description: Recibido menos declarado. }
        fecha: { type: string, format: date }
        numero_comprobante: { type: [string, 'null'] }
        banco_origen: { type: [string, 'null'] }
        cuenta_destino: { type: [string, 'null'] }
        estado: { type: string, enum: [pendiente, aprobado, rechazado, anulado] }
        motivo_rechazo: { type: [string, 'null'] }
        recibo: { type: [string, 'null'] }
        comprobante_url: { type: [string, 'null'], description: Enlace temporal de 10 minutos. }
        comprobante_tipo: { type: [string, 'null'], examples: [jpg, png, pdf] }
        tolerancia: { type: string }
        cuotas:
          type: array
          items:
            type: object
            properties:
              cuota_id: { type: integer }
              periodo: { type: string }
              monto: { type: string }
        validaciones:
          type: array
          description: Vacío si el pago ya no está pendiente.
          items:
            type: object
            required: [clave, ok, texto]
            properties:
              clave: { type: string, enum: [cuotas_vigentes, monto_cubre, comprobante_unico, fecha_valida] }
              ok: { type: boolean }
              texto: { type: string }
        aplicacion:
          type: [object, 'null']
          description: Qué pasaría al aprobarlo con lo declarado (solo pendientes).
          properties:
            cuotas_completas: { type: integer }
            ajuste: { type: string }
            a_saldo_favor: { type: string }
            credito_previo: { type: string }
    CuotaUnidad:
      type: object
      required: [unidad_id, codigo, responsable, cuota, pagado, saldo, vence_el, estado]
      properties:
        unidad_id: { type: integer }
        codigo: { type: string, examples: ['A-102'] }
        responsable:
          type: [object, 'null']
          description: Quien responde por el pago de la unidad (propietario o inquilino, según la unidad).
          properties:
            nombre: { type: string }
            relacion: { type: string }
        cuota: { type: string, description: Suma de las cuotas del mes de la unidad. }
        pagado: { type: string }
        saldo: { type: string }
        vence_el: { type: string, format: date }
        estado: { type: string, enum: [pagada, por_aprobar, vencida, pendiente] }
