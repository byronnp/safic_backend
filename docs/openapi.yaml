    MenuSistemaItem:
      type: object
      required: [id, clave, padre_id, etiqueta, icono, ruta, permiso, es_grupo, seccion, orden, activo, roles]
      properties:
        id: { type: integer }
        clave: { type: string, examples: ['condominio.reglamento'] }
        padre_id: { type: [integer, 'null'] }
        etiqueta: { type: string }
        icono: { type: string, examples: ['sym_r_gavel'] }
        ruta: { type: [string, 'null'] }
        permiso: { type: [string, 'null'] }
        es_grupo: { type: boolean }
        seccion: { type: boolean }
        orden: { type: integer }
        activo: { type: boolean }
        roles: { type: array, items: { type: string }, description: Perfiles que lo ven (solo pantallas). }
    MenuSistema:
      type: object
      required: [items, roles, permisos]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MenuSistemaItem' } }
        roles:
          type: array
          items:
            type: object
            required: [clave, nombre]
            properties: { clave: { type: string }, nombre: { type: string } }
        permisos:
          type: array
          items:
            type: object
            required: [clave, etiqueta, grupo]
            properties: { clave: { type: string }, etiqueta: { type: string }, grupo: { type: string } }
    CatalogoAmenidadAdmin:
      type: object
      required: [id, nombre, descripcion, categoria, reservable, esencial, requiere_aprobacion, capacidad, duracion_maxima_min, orden, activa, uso]
      properties:
        id: { type: integer }
        nombre: { type: string }
        descripcion: { type: [string, 'null'] }
        categoria: { type: string, enum: [recreacion, deporte, social, servicios, seguridad] }
        reservable: { type: boolean }
        esencial: { type: boolean, description: 'Nunca se restringe a morosos (Decreto 462).' }
        requiere_aprobacion: { type: boolean }
        capacidad: { type: [integer, 'null'], description: Capacidad sugerida. }
        duracion_maxima_min: { type: [integer, 'null'], description: 'Duración máxima sugerida en minutos.' }
        orden: { type: integer }
        activa: { type: boolean }
        uso: { type: [integer, 'null'], description: 'En cuántos condominios se usa (null cuando no se calcula).' }

    GuardarCatalogoAmenidad:
      type: object
      description: Al editar solo viaja lo que cambia.
      properties:
        nombre: { type: string, minLength: 2, maxLength: 80 }
        descripcion: { type: [string, 'null'], maxLength: 200 }
        categoria: { type: string, enum: [recreacion, deporte, social, servicios, seguridad] }
        reservable: { type: boolean }
        esencial: { type: boolean }
        requiere_aprobacion: { type: boolean }
        capacidad: { type: [integer, 'null'], minimum: 1, maximum: 9999 }
        duracion_maxima_min: { type: [integer, 'null'], minimum: 15, maximum: 1440 }
        orden: { type: integer, minimum: 0, maximum: 999 }
        activa: { type: boolean }

    AmenidadPropia:
      type: object
      required: [id, condominio_id, condominio, nombre, categoria, reservable, esencial, requiere_aprobacion, activa]
      properties:
        id: { type: integer }
        condominio_id: { type: integer }
        condominio: { type: string }
        nombre: { type: string }
        categoria: { type: [string, 'null'] }
        reservable: { type: boolean }
        esencial: { type: boolean }
        requiere_aprobacion: { type: boolean }
        activa: { type: boolean }

    AmenidadCondominio:
      type: object
      required: [id, nombre, origen, tipo, categoria, cantidad, ubicacion, reservable, esencial, requiere_aprobacion, capacidad, duracion_maxima_min, estado, mantenimiento_hasta, fotos]
      properties:
        id: { type: integer }
        nombre: { type: string, examples: ['Área BBQ 2'] }
        origen: { type: string, enum: [catalogo, propia] }
        tipo: { type: [string, 'null'], description: 'Tipo del catálogo; null si es propia.', examples: ['Área BBQ'] }
        categoria: { type: [string, 'null'], enum: [recreacion, deporte, social, servicios, seguridad, null] }
        cantidad: { type: integer }
        ubicacion: { type: [string, 'null'], examples: ['Área social'] }
        reservable: { type: boolean }
        esencial: { type: boolean, description: 'Nunca se restringe por mora (Decreto 462).' }
        requiere_aprobacion: { type: boolean }
        capacidad: { type: [integer, 'null'], description: 'Del catálogo; null en las propias.' }
        duracion_maxima_min: { type: [integer, 'null'] }
        estado: { type: string, enum: [disponible, mantenimiento, inactiva] }
        mantenimiento_hasta: { type: [string, 'null'], format: date }
        fotos:
          type: array
          description: Hasta 5, la primera es la portada. Las URLs son enlaces temporales (10 minutos) del bucket privado.
          items:
            type: object
            required: [id, orden, url]
            properties:
              id: { type: integer }
              orden: { type: integer }
              url: { type: string, format: uri }

    AgregarAmenidad:
      type: object
      required: [origen, cantidad]
      properties:
        origen: { type: string, enum: [catalogo, propia] }
        amenidad_catalogo_id: { type: [integer, 'null'], description: 'Obligatorio con origen catalogo.' }
        nombre: { type: [string, 'null'], minLength: 2, maxLength: 70, description: 'Obligatorio con origen propia.' }
        categoria: { type: [string, 'null'], enum: [recreacion, deporte, social, servicios, seguridad, null], description: 'Obligatoria con origen propia.' }
        reservable: { type: boolean, description: 'Solo propias; las del catálogo traen su valor.' }
        cantidad: { type: integer, minimum: 1, maximum: 50 }
        ubicacion: { type: [string, 'null'], maxLength: 80 }

    ActualizarAmenidad:
      type: object
      description: Solo viaja lo que cambia.
      properties:
        ubicacion: { type: [string, 'null'], maxLength: 80 }
        activa: { type: boolean }
        mantenimiento_hasta: { type: [string, 'null'], format: date, description: 'null saca la amenidad de mantenimiento.' }

    RolesCondominio:
      type: object
      required: [roles, permisos, cupo]
      properties:
        roles:
          type: array
          items: { $ref: '#/components/schemas/RolCondominio' }
        permisos:
          type: array
          description: Catálogo de permisos del condominio (sin los de plataforma), para dibujar la tabla de cada rol.
          items: { $ref: '#/components/schemas/PermisoCatalogo' }
        cupo: { $ref: '#/components/schemas/CupoUsuarios' }

    RolCondominio:
      type: object
      required: [clave, nombre, tipo, cuenta_cupo, usuarios, permisos, menu]
      properties:
        clave: { type: string, examples: [administrador] }
        nombre: { type: string, examples: [Administrador] }
        tipo:
          type: string
          enum: [sistema, cargo, adicional]
          description: 'sistema: perfiles de la plataforma; cargo: directiva (se asigna en Usuarios › Directiva); adicional: creado por la plataforma.'
        cuenta_cupo: { type: boolean, description: 'Quien lo tenga consume un lugar de usuarios administrativos del plan.' }
        usuarios: { type: integer, description: 'Personas con este rol en el condominio.' }
        permisos:
          type: array
          items: { type: string, examples: ['unidades.ver'] }
        menu:
          type: array
          description: Pantallas del menú que vería.
          items:
            type: object
            required: [etiqueta, icono]
            properties:
              etiqueta: { type: string }
              icono: { type: string, examples: [sym_r_apartment] }

    PermisoCatalogo:
      type: object
      required: [clave, etiqueta, grupo, administrativo]
      properties:
        clave: { type: string, examples: ['unidades.editar'] }
        etiqueta: { type: string, examples: ['Crear y editar unidades'] }
        grupo: { type: string, examples: [Núcleo] }
        administrativo: { type: boolean, description: 'Quien lo tenga cuenta como usuario administrativo del plan.' }

    SolicitarRol:
      type: object
      required: [nombre, descripcion]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 60, examples: [Jardinero] }
        descripcion: { type: string, minLength: 10, maxLength: 500, examples: ['Ver la agenda de áreas y reportar incidencias de áreas verdes'] }

    UsuarioCondominio:
      type: object
      required: [id, nombre, email, celular, roles, perfil, cuenta_cupo, estado, acceso_hasta, es_yo, doble_factor]
      properties:
        id: { type: integer }
        nombre: { type: string }
        email: { type: string, format: email }
        celular: { type: [string, 'null'] }
        roles:
          type: array
          description: Todos sus perfiles en este condominio (incluye cargos de directiva y residente).
          items: { type: string }
        perfil:
          type: [string, 'null']
          enum: [administrador, contador, guardia, mantenimiento, null]
          description: El perfil que asigna la administración; null si solo tiene cargos o es residente.
        cuenta_cupo: { type: boolean, description: 'Consume un lugar de usuarios administrativos del plan.' }
        estado:
          type: string
          enum: [activo, pendiente, desactivado, vencido]
          description: 'pendiente: aún no creó su contraseña; vencido: pasó su fecha de acceso.'
        acceso_hasta: { type: [string, 'null'], format: date }
        es_yo: { type: boolean }
        doble_factor: { type: boolean, description: Tiene la verificación en dos pasos activa. }

    CupoUsuarios:
      type: object
      required: [plan, limite, usados]
      properties:
        plan: { type: [string, 'null'], examples: [Profesional] }
        limite: { type: [integer, 'null'], description: 'null si el condominio no tiene plan (sin límite).' }
        usados: { type: integer }

    InvitarUsuario:
      type: object
      required: [nombre, cedula, email, rol]
      properties:
        nombre: { type: string, maxLength: 120 }
        cedula: { type: string, examples: ['1712345675'] }
        email: { type: string, format: email, maxLength: 160 }
        celular: { type: [string, 'null'], pattern: '^09\d{8}$' }
        rol: { type: string, enum: [administrador, contador, guardia, mantenimiento] }
        acceso_hasta: { type: [string, 'null'], format: date, description: 'Obligatorio para el contador; hasta 2 años.' }

    ActualizarUsuario:
      type: object
      description: Solo viaja lo que cambia.
      properties:
        rol: { type: string, enum: [administrador, contador, guardia, mantenimiento] }
        acceso_hasta: { type: [string, 'null'], format: date }
        activo: { type: boolean, description: 'false desactiva el acceso a este condominio; true lo reactiva.' }

    GuardarCobro:
      type: object
      required: [metodo, dia_vencimiento, aplica_desde]
      properties:
        metodo: { type: string, enum: [general, tipo, alicuota, unidad] }
        cuota_general:
          description: Obligatoria con método general.
          oneOf:
            - { $ref: '#/components/schemas/Dinero' }
            - { type: 'null' }
        presupuesto_mensual:
          description: Obligatorio con método por alícuota.
          oneOf:
            - { $ref: '#/components/schemas/Dinero' }
            - { type: 'null' }
        valores_tipo:
          description: Obligatorio con método por tipo.
          type: [array, 'null']
          items:
            type: object
            required: [tipo, valor]
            properties:
              tipo: { type: string, enum: [departamento, casa, local, parqueadero, bodega] }
              valor: { $ref: '#/components/schemas/Dinero' }
        dia_vencimiento: { type: integer, minimum: 0, maximum: 28, description: 0 = último día del mes. }
        aplica_desde: { type: string, pattern: '^\d{4}-\d{2}$', description: 'Primer mes con el cambio (AAAA-MM): del mes siguiente a 12 meses adelante.' }

    PeriodoFinanciero:
      type: object
      required: [periodo, estado, esperado, recaudado]
      properties:
        periodo: { type: string, examples: ['2026-09'] }
        estado: { type: string, enum: [abierto, cerrado] }
        esperado: { type: string, description: Suma de las cuotas emitidas., examples: ['12320.00'] }
        recaudado: { type: string, examples: ['9856.00'] }
    EmisionPeriodo:
      type: object
      required: [periodo, creadas, existentes, sin_cuota, total, vence_el]
      properties:
        periodo: { type: string }
        creadas: { type: integer, description: Cuotas nuevas de esta emisión. }
        existentes: { type: integer, description: Unidades que ya tenían su cuota del mes. }
        sin_cuota: { type: integer, description: Unidades sin cuota mensual (no se cobran). }
        total: { type: string, description: Suma de todas las cuotas del mes., examples: ['12320.00'] }
        vence_el: { type: string, format: date }
    ResumenFinanciero:
      type: object
      required: [periodo, emitido, estado, esperado, recaudado, cuotas, cartera_vencida, antiguedad, cobro]
      properties:
        periodo: { type: string }
        emitido: { type: boolean, description: Si el mes ya se emitió. }
        estado: { type: [string, 'null'], enum: [abierto, cerrado, null] }
        esperado: { type: string }
        recaudado: { type: string }
        cuotas: { type: integer }
        cartera_vencida:
          type: object
          required: [saldo, unidades]
          properties:
            saldo: { type: string }
            unidades: { type: integer, description: Unidades con cuotas vencidas. }
        antiguedad:
          type: array
          items:
            type: object
            required: [tramo, etiqueta, saldo, unidades]
            properties:
              tramo: { type: string, enum: [al_dia, d1_30, d31_60, d61_90, d90_mas] }
              etiqueta: { type: string }
              saldo: { type: string }
              unidades: { type: integer }
        cobro:
          type: [object, 'null']
          properties:
            metodo: { type: string, enum: [general, tipo, alicuota, unidad] }
            dia_vencimiento: { type: integer }
    CuentaProveedor:
      type: object
      required: [id, banco, tipo, numero, titular]
      properties:
        id: { type: integer }
        banco: { type: string }
        tipo: { type: string, enum: [corriente, ahorros] }
        numero: { type: string }
        titular: { type: string }

    Proveedor:
      type: object
      required: [id, ruc, razon_social, saldo_por_pagar, estado, cuenta, cambio_de_cuenta]
      properties:
        id: { type: integer }
        ruc: { type: string }
        razon_social: { type: string }
        categoria: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        telefono: { type: [string, 'null'] }
        saldo_por_pagar: { type: string, examples: ['1840.00'] }
        estado: { type: string, enum: [sin_facturas, por_aprobar, vence_pronto, al_dia] }
        proximo_vencimiento: { type: [string, 'null'], format: date }
        cuenta:
          oneOf: [{ $ref: '#/components/schemas/CuentaProveedor' }, { type: 'null' }]
        cambio_de_cuenta:
          description: Cambio en espera (se activa en `activa_en`); null si no hay.
          oneOf:
            - allOf:
                - { $ref: '#/components/schemas/CuentaProveedor' }
                - type: object
                  properties:
                    activa_en: { type: [string, 'null'], format: date-time }
                    solicitado_por: { type: [string, 'null'] }
                    solicitado_en: { type: [string, 'null'], format: date-time }
            - { type: 'null' }

    Gasto:
      type: object
      required: [id, proveedor, numero, origen, fecha_emision, vence_el, subtotal, iva, total, saldo, estado, vencida]
      properties:
        id: { type: integer }
        proveedor:
          type: object
          properties:
            id: { type: integer }
            razon_social: { type: string }
            ruc: { type: string }
        numero: { type: string, examples: ['001-002-000004512'] }
        categoria: { type: [string, 'null'] }
        descripcion: { type: [string, 'null'] }
        origen: { type: string, enum: [xml, manual] }
        fecha_emision: { type: string, format: date }
        vence_el: { type: string, format: date }
        subtotal: { type: string }
        iva: { type: string }
        total: { type: string }
        pagado: { type: string }
        saldo: { type: string }
        estado: { type: string, enum: [por_aprobar, aprobada, rechazada, pagada] }
        pagada_parcial: { type: boolean, description: Aprobada con abonos y saldo pendiente. }
        requiere_segunda_aprobacion: { type: boolean, description: El total supera el umbral del condominio. }
        nivel_pendiente: { type: [integer, 'null'], enum: [1, 2, null], description: Qué aprobación falta; null si ya no espera ninguna. }
        motivo_rechazo: { type: [string, 'null'] }
        vencida: { type: boolean }
        tiene_xml: { type: boolean }
        tiene_pdf: { type: boolean }

    GastoDetalle:
      allOf:
        - { $ref: '#/components/schemas/Gasto' }
        - type: object
          properties:
            registrada_por: { type: [string, 'null'] }
            registrada_por_mi: { type: boolean, description: La registró quien consulta (no puede aprobarla ni rechazarla). }
            registrada_en: { type: [string, 'null'], format: date-time }
            aprobaciones:
              type: array
              items:
                type: object
                properties:
                  nivel: { type: integer, enum: [1, 2] }
                  decision: { type: string, enum: [aprobada, rechazada] }
                  por: { type: [string, 'null'] }
                  comentario: { type: [string, 'null'] }
                  en_subrogacion: { type: boolean }
                  en: { type: [string, 'null'], format: date-time }

    PagoProveedor:
      type: object
      required: [id, codigo, proveedor, monto, fecha_pago, referencia, estado, facturas]
      properties:
        id: { type: integer }
        codigo: { type: string, examples: ['PP-0087'] }
        proveedor:
          type: object
          properties:
            id: { type: integer }
            razon_social: { type: string }
            ruc: { type: string }
        monto: { type: string }
        fecha_pago: { type: string, format: date }
        referencia: { type: string }
        estado: { type: string, enum: [registrado, anulado] }
        motivo_anulacion: { type: [string, 'null'] }
        tiene_comprobante: { type: boolean }
        facturas:
          type: array
          items:
            type: object
            properties:
              gasto_id: { type: integer }
              numero: { type: string }
              monto: { type: string }

    ConfiguracionFinanzas:
      type: object
      required: [umbral_segunda_aprobacion, aprobador_puede_pagar, tolerancia_bancaria, dias_gracia, meses_restriccion, dias_aviso_restriccion]
      properties:
        umbral_segunda_aprobacion: { type: string, examples: ['500.00'] }
        aprobador_puede_pagar: { type: boolean }
        tolerancia_bancaria: { type: string, examples: ['0.50'] }
        dias_gracia: { type: integer, minimum: 0, maximum: 30, description: 'Días después del vencimiento antes de considerar la mora.' }
        meses_restriccion: { type: integer, minimum: 1, maximum: 12, description: 'Meses de deuda vencida desde los que se restringen las áreas comunes (Decreto 462).' }
        dias_aviso_restriccion: { type: integer, minimum: 1, maximum: 30, description: 'Días entre la notificación y la restricción.' }

    CierreMes:
      type: object
      required: [periodo, emitido, estado, verificaciones, puede_cerrar, resumen]
      properties:
        periodo: { type: string, examples: ['2026-09'] }
        emitido: { type: boolean }
        estado: { type: [string, 'null'], enum: [abierto, cerrado, null] }
        verificaciones:
          type: array
          items:
            type: object
            properties:
              clave: { type: string, examples: [mes_terminado, cuotas, pagos, facturas_por_aprobar, facturas_sin_pagar] }
              titulo: { type: string }
              detalle: { type: string }
              estado: { type: string, enum: [listo, revisar, bloquea] }
        puede_cerrar: { type: boolean }
        motivo_bloqueo: { type: [string, 'null'] }
        resumen:
          type: object
          properties:
            emitido: { type: string }
            cobrado: { type: string }
            gastos_pagados: { type: string }
        cierre:
          oneOf:
            - type: object
              properties:
                cerrado_por: { type: [string, 'null'] }
                cerrado_en: { type: [string, 'null'], format: date-time }
            - { type: 'null' }
        reapertura:
          oneOf:
            - type: object
              properties:
                reabierto_por: { type: [string, 'null'] }
                reabierto_en: { type: string, format: date-time }
                motivo: { type: [string, 'null'] }
            - { type: 'null' }
        anterior_cerrado:
          oneOf:
            - type: object
              properties:
                periodo: { type: string }
                por: { type: [string, 'null'] }
            - { type: 'null' }

    LineaBanco:
      type: object
      properties:
        id: { type: integer }
        fecha: { type: string, format: date }
        descripcion: { type: string }
        referencia: { type: [string, 'null'] }
        monto: { type: string, description: 'Crédito (+) o débito (−).' }
        estado: { type: string, enum: [automatico, sugerido, sin_identificar, conciliado] }
        tipo: { type: [string, 'null'], enum: [pago_residente, pago_proveedor, interes, comision, otro, null] }
        pago_id: { type: [integer, 'null'] }
        pago_proveedor_id: { type: [integer, 'null'] }
        propuesta:
          oneOf:
            - type: object
              properties:
                tipo: { type: string }
                id: { type: [integer, 'null'] }
                texto: { type: [string, 'null'] }
            - { type: 'null' }

    EstadoCuentaBanco:
      type: object
      properties:
        id: { type: integer }
        cuenta_bancaria_id: { type: integer }
        cuenta: { type: string, examples: ['Banco Pichincha · Corriente ····4821'] }
        periodo: { type: string, examples: ['2026-09'] }
        archivo_nombre: { type: string }
        movimientos: { type: integer }
        duplicados: { type: integer }
        pendientes: { type: integer }
        conteos:
          type: object
          properties:
            automaticos: { type: integer }
            sugeridos: { type: integer }
            sin_identificar: { type: integer }

    Conciliacion:
      allOf:
        - { $ref: '#/components/schemas/EstadoCuentaBanco' }
        - type: object
          properties:
            automaticos: { type: array, items: { $ref: '#/components/schemas/LineaBanco' } }
            sugeridos: { type: array, items: { $ref: '#/components/schemas/LineaBanco' } }
            sin_identificar: { type: array, items: { $ref: '#/components/schemas/LineaBanco' } }
            cuadre:
              type: object
              properties:
                saldo_inicial: { type: [string, 'null'] }
                pagos_residentes: { type: string }
                intereses: { type: string }
                gastos_pagados: { type: string }
                comisiones: { type: string }
                otros: { type: string }
                ajustes: { type: string }
