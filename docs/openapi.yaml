      summary: Cambiar las reglas de dinero
      description: 'Permiso: `condominio.editar`. Solo viaja lo que cambia. Queda auditado. El umbral nuevo aplica a las facturas que aún no tienen su primera aprobación; la tolerancia, a los pagos que se aprueben desde ese momento.'
