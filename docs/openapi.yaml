            schema:
              type: object
              required: [concepto, monto, fecha, respaldo]
              properties:
                concepto: { type: string, minLength: 3, maxLength: 120 }
                comercio: { type: string, maxLength: 80 }
                monto: { type: string, examples: ['12.50'] }
                fecha: { type: string, format: date }
                respaldo: { type: string, format: binary }
      responses:
        '201':
          description: Gasto registrado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CajaChica' }
                  meta: { type: object }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          description: '`CAJA_SIN_CONFIGURAR` o `PERIODO_CERRADO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /finanzas/caja-chica/reponer:
    post:
      tags: [Finanzas]
      operationId: reponerCajaChica
      summary: Reponer el fondo de la caja chica
      description: |
        Permiso: `gastos.registrar`. Agrupa los movimientos abiertos en un gasto `CC-aaaa-nnn` a nombre del proveedor interno
        «Caja chica · responsable» (RUC 9999999999999) que sigue el flujo normal: aprobación, pago y conciliación.
        `meta.gasto_id` y `meta.gasto_numero`. 409 `CAJA_SIN_CONFIGURAR`, `SIN_MOVIMIENTOS`, `PERIODO_CERRADO`.
      x-permiso: gastos.registrar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '201':
          description: Reposición registrada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CajaChica' }
                  meta: { type: object }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          description: '`CAJA_SIN_CONFIGURAR`, `SIN_MOVIMIENTOS` o `PERIODO_CERRADO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

