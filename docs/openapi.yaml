  /cobro:
    get:
      tags: [Finanzas]
      operationId: verCobro
      summary: Cobro de cuotas del condominio
      description: |
        Permiso: `condominio.editar`. La configuración vigente (sin configuración devuelve el valor general
        con `configurado: false`), las unidades por tipo para proyectar la próxima emisión y el historial de
        cambios, que sale de la auditoría (el más reciente primero). Las acciones del equipo de la plataforma
        se muestran como `Equipo SAFIC`.
      x-permiso: condominio.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Cobro de cuotas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CobroCuotas' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    put:
      tags: [Finanzas]
      operationId: guardarCobro
      summary: Cambiar el cobro de cuotas
      description: |
        Permiso: `condominio.editar`. Reemplaza la configuración completa. Rige desde `aplica_desde` (desde el mes
        siguiente hasta 12 meses adelante); las cuotas ya emitidas no cambian y el cambio queda en la auditoría.
        409 `UNIDADES_SIN_ALICUOTA` / `UNIDADES_SIN_CUOTA` si se pasa a alícuota o a por unidad y a alguna unidad
        le falta ese dato (`error.details.unidades` trae cuántas).
      x-permiso: condominio.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarCobro' }
      responses:
        '200':
          description: Cobro guardado (misma forma que `GET /cobro`).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CobroCuotas' }
                  message: { type: string, examples: ['Cambios guardados.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          description: '`UNIDADES_SIN_ALICUOTA` o `UNIDADES_SIN_CUOTA`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

