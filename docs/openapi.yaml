          type: object
          properties:
            id: { type: integer }
            codigo: { type: string }
            tipo: { type: string }
            ubicacion: { type: string, examples: ['Torre A · Piso 1'] }
        responsable: { type: [object, 'null'], properties: { nombre: { type: string }, relacion: { type: string } } }
        saldo_pendiente: { type: string }
        saldo_favor: { type: string }
        dias_atraso: { type: integer }
        proximo_vencimiento: { type: [string, 'null'], format: date }
        pagado_en_el_anio: { type: object, properties: { monto: { type: string }, pagos: { type: integer }, anio: { type: integer } } }
        saldo_inicial: { type: string }
