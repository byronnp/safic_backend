                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SolicitudReserva' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'

  /areas-comunes/reservas/{reserva}/aprobar:
    post:
      tags: [Reservas]
      operationId: aprobarReserva
      summary: Aprobar una solicitud de reserva
      description: |
        Permiso `reservas.gestionar`. La reserva queda `confirmada`, se cobran el uso y la garantía en la cuenta de la unidad
        (dos cuotas extraordinarias) y se avisa al residente por correo. Hay que pagar hasta 24 h antes de empezar o la reserva se
        cancela sola. 409 `RESERVA_NO_PENDIENTE`, `RESERVA_YA_EMPEZO`, `PERIODO_CERRADO`.
      x-permiso: reservas.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: reserva, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Reserva aprobada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ResolucionReserva' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`RESERVA_NO_PENDIENTE`, `RESERVA_YA_EMPEZO` o `PERIODO_CERRADO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /areas-comunes/reservas/{reserva}/rechazar:
    post:
      tags: [Reservas]
      operationId: rechazarReserva
      summary: Rechazar una solicitud de reserva
      description: Permiso `reservas.gestionar`. El motivo lo ve el residente y se le avisa por correo. Libera el horario. 409 `RESERVA_NO_PENDIENTE`.
      x-permiso: reservas.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: reserva, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '200':
          description: Solicitud rechazada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ResolucionReserva' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`RESERVA_NO_PENDIENTE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /areas-comunes/agenda:
    get:
      tags: [Reservas]
      operationId: agendaAreasComunes
      summary: Agenda de reservas y bloqueos de un rango de días
      description: Permiso `reservas.gestionar`. Las áreas reservables, sus reservas vivas (`pendiente` o `confirmada`) y sus bloqueos entre `desde` y `desde + dias - 1`.
      x-permiso: reservas.gestionar
      parameters:
