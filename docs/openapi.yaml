  /unidades/importacion:
    post:
      tags: [Unidades]
      operationId: importarUnidades
      summary: Importar unidades desde Excel (vista previa o creación)
      description: |
        Permiso: `unidades.editar`. Recibe el .xlsx (máx. 2 MB y 500 filas) en `multipart/form-data`.
        Sin `confirmar` solo valida y responde 200 con la vista previa (errores por fila, bloques que se crearían
        y si alcanza el total contratado); no guarda nada. Con `confirmar=1` crea todas las unidades o ninguna:
        201 si salió bien, 422 `IMPORTACION_CON_ERRORES` si alguna fila tiene error (`error.details.errores`),
        409 `LIMITE_UNIDADES` si no alcanza el total contratado. Cada fila usa las reglas de `POST /unidades`;
        los bloques que no existen se crean. Otros 422: `IMPORTACION_COLUMNAS`, `IMPORTACION_ARCHIVO_INVALIDO`,
        `IMPORTACION_MUY_GRANDE`, `IMPORTACION_VACIA`.
      x-permiso: unidades.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary, description: 'Excel .xlsx (plantilla).' }
                confirmar: { type: boolean, description: 'true crea las unidades; omitido o false solo valida.' }
      responses:
        '200':
          description: Vista previa (no se guardó nada).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ResultadoImportacionUnidades' }
        '201':
          description: Unidades creadas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ResultadoImportacionUnidades' }
                  message: { type: string, examples: ['Unidades importadas.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          $ref: '#/components/responses/LimiteUnidades'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

