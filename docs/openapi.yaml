    put:
      tags: [Finanzas]
      operationId: guardarCajaChica
      summary: Fijar el fondo y el responsable de la caja chica
      description: |
        Permiso: `gastos.registrar`. 422 `FONDO_MENOR_AL_GASTO` si el fondo queda por debajo de lo ya gastado desde la última reposición.
      x-permiso: gastos.registrar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fondo, responsable_nombre]
              properties:
                fondo: { type: string, examples: ['200.00'] }
                responsable_nombre: { type: string, minLength: 3, maxLength: 80 }
      responses:
        '200':
          description: Caja chica guardada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CajaChica' }
                  meta: { type: object }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'

  /finanzas/caja-chica/movimientos:
    post:
      tags: [Finanzas]
      operationId: registrarGastoCajaChica
      summary: Registrar un gasto menor de la caja chica
      description: |
        Permiso: `cajachica.registrar`. El respaldo (foto jpg/png o PDF, hasta 5 MB) es obligatorio. 409 `CAJA_SIN_CONFIGURAR`,
        `PERIODO_CERRADO`; 422 `FONDO_INSUFICIENTE` (el monto supera lo disponible), `FECHA_FUTURA`.
      x-permiso: cajachica.registrar
      parameters:
