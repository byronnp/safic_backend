        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo: { type: [string, 'null'], maxLength: 200 }
      responses:
        '200':
          description: Reserva cancelada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`RESERVA_NO_CANCELABLE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /areas-comunes/solicitudes:
    get:
      tags: [Reservas]
      operationId: listarSolicitudesReserva
      summary: Solicitudes de reserva pendientes de aprobación
      description: Permiso `reservas.gestionar`. La más antigua primero (la que vence antes). Sin respuesta en 48 h la solicitud vence sola.
      x-permiso: reservas.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Solicitudes.
          content:
            application/json:
              schema:
                type: object
