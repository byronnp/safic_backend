        evento: { type: string, enum: [creado, actualizado, eliminado] }
        entidad: { type: string, enum: [condominio, membresia, catalogo_amenidad, menu, rol] }
        entidad_id: { type: [string, 'null'], description: Id o clave del registro cambiado. }
        etiqueta: { type: [string, 'null'], description: Nombre legible del registro. }
        condominio_id: { type: [integer, 'null'] }
        antes: { type: [object, 'null'], additionalProperties: true }
        despues: { type: [object, 'null'], additionalProperties: true }
        ip: { type: [string, 'null'] }
    RolAdmin:
      type: object
      required: [clave, nombre, tipo, condominios, permisos, bloqueos, obligatorios]
      properties:
        clave: { type: string, examples: ['guardia'] }
        nombre: { type: string }
        tipo: { type: string, enum: [sistema, cargo, adicional] }
        condominios: { type: integer, description: En cuántos condominios tiene usuarios. }
        permisos: { type: array, items: { type: string } }
        bloqueos: { type: object, additionalProperties: { type: string }, description: 'Permiso → motivo.' }
        obligatorios: { type: array, items: { type: string } }
    RolesAdmin:
      type: object
      required: [roles, permisos, solicitudes]
      properties:
        roles: { type: array, items: { $ref: '#/components/schemas/RolAdmin' } }
        permisos:
          type: array
          items:
            type: object
            required: [clave, etiqueta, grupo, administrativo, escritura]
            properties:
              clave: { type: string }
              etiqueta: { type: string }
              grupo: { type: string }
              administrativo: { type: boolean, description: Cuenta para el límite de usuarios del plan. }
              escritura: { type: boolean }
        solicitudes:
          type: array
          items:
            type: object
            required: [id, condominio_id, condominio, nombre, descripcion, creada]
            properties:
              id: { type: integer }
              condominio_id: { type: integer }
              condominio: { type: string }
              nombre: { type: string }
              descripcion: { type: string }
              creada: { type: [string, 'null'], format: date-time }
    MenuSistemaItem:
      type: object
      required: [id, clave, padre_id, etiqueta, icono, ruta, permiso, es_grupo, seccion, orden, activo, roles]
      properties:
        id: { type: integer }
        clave: { type: string, examples: ['condominio.reglamento'] }
        padre_id: { type: [integer, 'null'] }
        etiqueta: { type: string }
        icono: { type: string, examples: ['sym_r_gavel'] }
        ruta: { type: [string, 'null'] }
        permiso: { type: [string, 'null'] }
        es_grupo: { type: boolean }
        seccion: { type: boolean }
        orden: { type: integer }
        activo: { type: boolean }
        roles: { type: array, items: { type: string }, description: Perfiles que lo ven (solo pantallas). }
    MenuSistema:
      type: object
      required: [items, roles, permisos]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MenuSistemaItem' } }
        roles:
          type: array
          items:
            type: object
            required: [clave, nombre]
            properties: { clave: { type: string }, nombre: { type: string } }
        permisos:
          type: array
          items:
            type: object
            required: [clave, etiqueta, grupo]
            properties: { clave: { type: string }, etiqueta: { type: string }, grupo: { type: string } }
    CatalogoAmenidadAdmin:
      type: object
      required: [id, nombre, descripcion, categoria, reservable, esencial, requiere_aprobacion, capacidad, duracion_maxima_min, orden, activa, uso]
      properties:
        id: { type: integer }
        nombre: { type: string }
        descripcion: { type: [string, 'null'] }
        categoria: { type: string, enum: [recreacion, deporte, social, servicios, seguridad] }
        reservable: { type: boolean }
        esencial: { type: boolean, description: 'Nunca se restringe a morosos (Decreto 462).' }
        requiere_aprobacion: { type: boolean }
        capacidad: { type: [integer, 'null'], description: Capacidad sugerida. }
        duracion_maxima_min: { type: [integer, 'null'], description: 'Duración máxima sugerida en minutos.' }
        orden: { type: integer }
        activa: { type: boolean }
        uso: { type: [integer, 'null'], description: 'En cuántos condominios se usa (null cuando no se calcula).' }

    GuardarCatalogoAmenidad:
      type: object
      description: Al editar solo viaja lo que cambia.
      properties:
        nombre: { type: string, minLength: 2, maxLength: 80 }
        descripcion: { type: [string, 'null'], maxLength: 200 }
        categoria: { type: string, enum: [recreacion, deporte, social, servicios, seguridad] }
        reservable: { type: boolean }
        esencial: { type: boolean }
        requiere_aprobacion: { type: boolean }
        capacidad: { type: [integer, 'null'], minimum: 1, maximum: 9999 }
        duracion_maxima_min: { type: [integer, 'null'], minimum: 15, maximum: 1440 }
        orden: { type: integer, minimum: 0, maximum: 999 }
        activa: { type: boolean }

    AmenidadPropia:
      type: object
      required: [id, condominio_id, condominio, nombre, categoria, reservable, esencial, requiere_aprobacion, activa]
      properties:
        id: { type: integer }
        condominio_id: { type: integer }
        condominio: { type: string }
        nombre: { type: string }
        categoria: { type: [string, 'null'] }
        reservable: { type: boolean }
        esencial: { type: boolean }
        requiere_aprobacion: { type: boolean }
        activa: { type: boolean }

    AmenidadCondominio:
      type: object
      required: [id, nombre, origen, tipo, categoria, cantidad, ubicacion, reservable, esencial, requiere_aprobacion, capacidad, duracion_maxima_min, estado, mantenimiento_hasta]
      properties:
        id: { type: integer }
        nombre: { type: string, examples: ['Área BBQ 2'] }
        origen: { type: string, enum: [catalogo, propia] }
        tipo: { type: [string, 'null'], description: 'Tipo del catálogo; null si es propia.', examples: ['Área BBQ'] }
        categoria: { type: [string, 'null'], enum: [recreacion, deporte, social, servicios, seguridad, null] }
        cantidad: { type: integer }
        ubicacion: { type: [string, 'null'], examples: ['Área social'] }
        reservable: { type: boolean }
        esencial: { type: boolean, description: 'Nunca se restringe por mora (Decreto 462).' }
        requiere_aprobacion: { type: boolean }
        capacidad: { type: [integer, 'null'], description: 'Del catálogo; null en las propias.' }
        duracion_maxima_min: { type: [integer, 'null'] }
        estado: { type: string, enum: [disponible, mantenimiento, inactiva] }
        mantenimiento_hasta: { type: [string, 'null'], format: date }

    AgregarAmenidad:
      type: object
      required: [origen, cantidad]
      properties:
        origen: { type: string, enum: [catalogo, propia] }
        amenidad_catalogo_id: { type: [integer, 'null'], description: 'Obligatorio con origen catalogo.' }
        nombre: { type: [string, 'null'], minLength: 2, maxLength: 70, description: 'Obligatorio con origen propia.' }
        categoria: { type: [string, 'null'], enum: [recreacion, deporte, social, servicios, seguridad, null], description: 'Obligatoria con origen propia.' }
        reservable: { type: boolean, description: 'Solo propias; las del catálogo traen su valor.' }
        cantidad: { type: integer, minimum: 1, maximum: 50 }
        ubicacion: { type: [string, 'null'], maxLength: 80 }

    ActualizarAmenidad:
      type: object
      description: Solo viaja lo que cambia.
      properties:
        ubicacion: { type: [string, 'null'], maxLength: 80 }
        activa: { type: boolean }
        mantenimiento_hasta: { type: [string, 'null'], format: date, description: 'null saca la amenidad de mantenimiento.' }

    RolesCondominio:
      type: object
      required: [roles, permisos, cupo]
      properties:
        roles:
          type: array
          items: { $ref: '#/components/schemas/RolCondominio' }
        permisos:
          type: array
          description: Catálogo de permisos del condominio (sin los de plataforma), para dibujar la tabla de cada rol.
          items: { $ref: '#/components/schemas/PermisoCatalogo' }
        cupo: { $ref: '#/components/schemas/CupoUsuarios' }

    RolCondominio:
      type: object
      required: [clave, nombre, tipo, cuenta_cupo, usuarios, permisos, menu]
      properties:
        clave: { type: string, examples: [administrador] }
        nombre: { type: string, examples: [Administrador] }
        tipo:
          type: string
          enum: [sistema, cargo, adicional]
          description: 'sistema: perfiles de la plataforma; cargo: directiva (se asigna en Usuarios › Directiva); adicional: creado por la plataforma.'
        cuenta_cupo: { type: boolean, description: 'Quien lo tenga consume un lugar de usuarios administrativos del plan.' }
        usuarios: { type: integer, description: 'Personas con este rol en el condominio.' }
        permisos:
          type: array
          items: { type: string, examples: ['unidades.ver'] }
        menu:
          type: array
          description: Pantallas del menú que vería.
          items:
            type: object
            required: [etiqueta, icono]
            properties:
              etiqueta: { type: string }
              icono: { type: string, examples: [sym_r_apartment] }

    PermisoCatalogo:
      type: object
      required: [clave, etiqueta, grupo, administrativo]
      properties:
        clave: { type: string, examples: ['unidades.editar'] }
        etiqueta: { type: string, examples: ['Crear y editar unidades'] }
        grupo: { type: string, examples: [Núcleo] }
        administrativo: { type: boolean, description: 'Quien lo tenga cuenta como usuario administrativo del plan.' }

    SolicitarRol:
      type: object
      required: [nombre, descripcion]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 60, examples: [Jardinero] }
        descripcion: { type: string, minLength: 10, maxLength: 500, examples: ['Ver la agenda de áreas y reportar incidencias de áreas verdes'] }

    UsuarioCondominio:
      type: object
      required: [id, nombre, email, celular, roles, perfil, cuenta_cupo, estado, acceso_hasta, es_yo]
      properties:
        id: { type: integer }
        nombre: { type: string }
        email: { type: string, format: email }
        celular: { type: [string, 'null'] }
        roles:
          type: array
          description: Todos sus perfiles en este condominio (incluye cargos de directiva y residente).
          items: { type: string }
        perfil:
          type: [string, 'null']
          enum: [administrador, contador, guardia, mantenimiento, null]
          description: El perfil que asigna la administración; null si solo tiene cargos o es residente.
        cuenta_cupo: { type: boolean, description: 'Consume un lugar de usuarios administrativos del plan.' }
        estado:
          type: string
          enum: [activo, pendiente, desactivado, vencido]
          description: 'pendiente: aún no creó su contraseña; vencido: pasó su fecha de acceso.'
        acceso_hasta: { type: [string, 'null'], format: date }
        es_yo: { type: boolean }

    CupoUsuarios:
      type: object
      required: [plan, limite, usados]
      properties:
        plan: { type: [string, 'null'], examples: [Profesional] }
        limite: { type: [integer, 'null'], description: 'null si el condominio no tiene plan (sin límite).' }
        usados: { type: integer }

    InvitarUsuario:
      type: object
      required: [nombre, cedula, email, rol]
      properties:
        nombre: { type: string, maxLength: 120 }
        cedula: { type: string, examples: ['1712345675'] }
        email: { type: string, format: email, maxLength: 160 }
        celular: { type: [string, 'null'], pattern: '^09\d{8}$' }
        rol: { type: string, enum: [administrador, contador, guardia, mantenimiento] }
        acceso_hasta: { type: [string, 'null'], format: date, description: 'Obligatorio para el contador; hasta 2 años.' }

    ActualizarUsuario:
      type: object
      description: Solo viaja lo que cambia.
      properties:
        rol: { type: string, enum: [administrador, contador, guardia, mantenimiento] }
        acceso_hasta: { type: [string, 'null'], format: date }
        activo: { type: boolean, description: 'false desactiva el acceso a este condominio; true lo reactiva.' }

    GuardarCobro:
      type: object
      required: [metodo, dia_vencimiento, aplica_desde]
      properties:
        metodo: { type: string, enum: [general, tipo, alicuota, unidad] }
        cuota_general:
          description: Obligatoria con método general.
          oneOf:
            - { $ref: '#/components/schemas/Dinero' }
            - { type: 'null' }
        presupuesto_mensual:
          description: Obligatorio con método por alícuota.
          oneOf:
            - { $ref: '#/components/schemas/Dinero' }
            - { type: 'null' }
        valores_tipo:
          description: Obligatorio con método por tipo.
          type: [array, 'null']
          items:
            type: object
            required: [tipo, valor]
            properties:
              tipo: { type: string, enum: [departamento, casa, local, parqueadero, bodega] }
              valor: { $ref: '#/components/schemas/Dinero' }
        dia_vencimiento: { type: integer, minimum: 0, maximum: 28, description: 0 = último día del mes. }
        aplica_desde: { type: string, pattern: '^\d{4}-\d{2}$', description: 'Primer mes con el cambio (AAAA-MM): del mes siguiente a 12 meses adelante.' }

    PeriodoFinanciero:
      type: object
      required: [periodo, estado, esperado, recaudado]
      properties:
        periodo: { type: string, examples: ['2026-09'] }
        estado: { type: string, enum: [abierto, cerrado] }
        esperado: { type: string, description: Suma de las cuotas emitidas., examples: ['12320.00'] }
        recaudado: { type: string, examples: ['9856.00'] }
    EmisionPeriodo:
      type: object
      required: [periodo, creadas, existentes, sin_cuota, total, vence_el]
      properties:
        periodo: { type: string }
        creadas: { type: integer, description: Cuotas nuevas de esta emisión. }
        existentes: { type: integer, description: Unidades que ya tenían su cuota del mes. }
        sin_cuota: { type: integer, description: Unidades sin cuota mensual (no se cobran). }
        total: { type: string, description: Suma de todas las cuotas del mes., examples: ['12320.00'] }
        vence_el: { type: string, format: date }
    ResumenFinanciero:
      type: object
      required: [periodo, emitido, estado, esperado, recaudado, cuotas, cartera_vencida, antiguedad, cobro]
      properties:
        periodo: { type: string }
        emitido: { type: boolean, description: Si el mes ya se emitió. }
        estado: { type: [string, 'null'], enum: [abierto, cerrado, null] }
        esperado: { type: string }
        recaudado: { type: string }
        cuotas: { type: integer }
        cartera_vencida:
          type: object
          required: [saldo, unidades]
          properties:
            saldo: { type: string }
            unidades: { type: integer, description: Unidades con cuotas vencidas. }
        antiguedad:
          type: array
          items:
            type: object
            required: [tramo, etiqueta, saldo, unidades]
            properties:
              tramo: { type: string, enum: [al_dia, d1_30, d31_60, d61_90, d90_mas] }
              etiqueta: { type: string }
              saldo: { type: string }
              unidades: { type: integer }
        cobro:
          type: [object, 'null']
          properties:
            metodo: { type: string, enum: [general, tipo, alicuota, unidad] }
            dia_vencimiento: { type: integer }
    CobroCuotas:
      type: object
      required: [configurado, metodo, cuota_general, presupuesto_mensual, valores_tipo, dia_vencimiento, aplica_desde, unidades, historial]
      properties:
        configurado: { type: boolean, description: 'false si el condominio nunca configuró el cobro.' }
        metodo: { type: string, enum: [general, tipo, alicuota, unidad] }
        cuota_general: { type: [string, 'null'], examples: ['80.00'] }
        presupuesto_mensual: { type: [string, 'null'], examples: ['12000.00'] }
        valores_tipo:
          type: array
          items:
            type: object
            required: [tipo, valor]
            properties:
              tipo: { type: string, enum: [departamento, casa, local, parqueadero, bodega] }
              valor: { type: string, examples: ['80.00'] }
        dia_vencimiento: { type: integer, description: 0 = último día del mes. }
        aplica_desde: { type: [string, 'null'], examples: ['2026-11'] }
        unidades:
          type: object
          description: Para proyectar la próxima emisión y validar un cambio de método.
          required: [por_tipo, con_cupo, suma_cuotas, sin_alicuota, sin_cuota_mensual]
          properties:
            por_tipo:
              type: object
              additionalProperties: { type: integer }
              examples: [{ departamento: 136, casa: 12, local: 0, parqueadero: 0, bodega: 0 }]
            con_cupo: { type: integer, description: 'Departamentos, casas y locales (el método general los cobra a todos por igual).' }
            suma_cuotas: { type: string, description: 'Suma de la cuota mensual de las unidades (método por unidad).', examples: ['12615.00'] }
            sin_alicuota: { type: integer }
            sin_cuota_mensual: { type: integer }
        historial:
          type: array
          items:
            type: object
            required: [fecha, quien, inicial, cambios]
            properties:
              fecha: { type: string, format: date-time }
              quien: { type: string, examples: ['María Rivas'] }
              inicial: { type: boolean, description: 'Es la configuración inicial (alta del condominio).' }
              cambios:
                type: array
                items:
                  type: object
                  required: [campo, antes, despues]
                  properties:
                    campo: { type: string, description: 'metodo, cuota_general, presupuesto_mensual, dia_vencimiento, aplica_desde o valor_tipo:<tipo>.', examples: [cuota_general] }
                    antes: { type: [string, 'null'] }
                    despues: { type: [string, 'null'] }

    ResultadoImportacionUnidades:
      type: object
      required: [confirmado, total_filas, validas, con_errores, errores, bloques_nuevos, cupo, creadas]
      properties:
        confirmado: { type: boolean }
        total_filas: { type: integer }
        validas: { type: integer }
        con_errores: { type: integer, description: 'Filas con al menos un error.' }
        errores:
          type: array
          items:
            type: object
            required: [fila, campo, mensaje]
            properties:
              fila: { type: integer, description: 'Número de fila en Excel (la 1 son los títulos).' }
              campo: { type: string, examples: [area_m2] }
              mensaje: { type: string }
        bloques_nuevos:
          type: array
          items: { type: string }
        cupo:
          type: object
          required: [total, registradas, nuevas, alcanza]
          properties:
            total: { type: integer }
            registradas: { type: integer }
            nuevas: { type: integer, description: 'Unidades que cuentan para el total contratado.' }
            alcanza: { type: boolean }
        creadas: { type: integer }

    DirectorioGarita:
      type: object
      required: [unidad, ocupantes, vehiculos]
      properties:
        unidad:
          type: object
          required: [id, codigo, tipo, bloque]
          properties:
            id: { type: integer }
            codigo: { type: string, examples: [A-102] }
            tipo: { type: string, enum: [departamento, casa, local, parqueadero, bodega] }
            bloque: { type: [string, 'null'], examples: [Torre A] }
        ocupantes:
          type: array
          description: Ocupantes vigentes, el principal primero.
          items:
            type: object
            required: [nombre, relacion, telefono]
            properties:
              nombre: { type: string }
              relacion: { type: string, enum: [propietario, inquilino, residente, contacto_emergencia] }
              telefono: { type: [string, 'null'], description: 'Completo (sin enmascarar).' }
        vehiculos:
          type: array
          items:
            type: object
            required: [placa, descripcion, coincide]
            properties:
              placa: { type: string, examples: [PBC-4821] }
              descripcion: { type: string, description: 'Marca, modelo y color; puede venir vacía.', examples: ['Kia Sportage · Gris'] }
              coincide: { type: boolean, description: 'La placa coincide con la búsqueda (para resaltarla).' }

    ResumenUnidades:
      type: object
      required: [registradas, total_contratadas, suma_alicuotas, metodo_cobro, cuota_general, ocupadas, residentes]
      properties:
        registradas: { type: integer, description: 'Departamentos, casas y locales registrados (parqueaderos y bodegas no cuentan).' }
        total_contratadas: { type: integer }
        suma_alicuotas: { type: string, examples: ['99.6200'], description: Debe llegar a 100. }
        metodo_cobro: { type: string, enum: [general, tipo, alicuota, unidad] }
        cuota_general:
          oneOf: [{ $ref: '#/components/schemas/Dinero' }, { type: 'null' }]
          description: 'Lo que paga cada unidad con método `general`; null con los demás métodos.'
        ocupadas: { type: integer, description: 'Departamentos, casas y locales ocupados o arrendados.' }
        residentes: { type: integer, description: 'Personas distintas con relación vigente (sin contactos de emergencia).' }

    Bloque:
      type: object
      required: [id, nombre, orden]
      properties:
        id: { type: integer }
        nombre: { type: string }
        orden: { type: integer }

    ItemMenu:
      type: object
      description: Ítem del menú lateral. Las hojas tienen `ruta`; los módulos y secciones, `hijos`.
      required: [id, etiqueta, icono]
      properties:
        id: { type: string, description: 'Clave estable (ej. `unidades.bloques`).' }
        etiqueta: { type: string }
        icono: { type: string, description: 'Material Symbols Rounded (`sym_r_*`). Obligatorio.' }
        ruta: { type: string, description: Nombre de la ruta del frontend. Solo en hojas. }
        permiso: { type: string, description: Permiso de la pantalla. Solo en hojas que lo piden. }
        seccion: { type: boolean, description: 'Grupo siempre desplegado (CONFIGURACIÓN). Se omite si es falso.' }
        hijos:
          type: array
          items: { $ref: '#/components/schemas/ItemMenu' }

    Dinero:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      description: Monto en USD con 2 decimales como texto (decimal(12,2) en la base).
      examples: ['80.00']

    Invitacion:
      type: object
      required: [nombre, email, condominio, expira_en, aviso_privacidad_version]
      properties:
        nombre: { type: string }
        email: { type: string, format: email }
        condominio: { type: string }
        expira_en: { type: string, format: date-time }
        aviso_privacidad_version: { type: string, description: Versión del aviso de privacidad que se acepta., examples: ['2026-10-borrador'] }

    Provincia:
      type: object
      required: [codigo, nombre, cantones]
      properties:
        codigo: { type: string, examples: ['17'] }
        nombre: { type: string }
        latitud: { type: [string, 'null'] }
        longitud: { type: [string, 'null'] }
        cantones:
          type: array
          items:
            type: object
            required: [codigo, nombre, parroquias]
            properties:
              codigo: { type: string, examples: ['1701'] }
              nombre: { type: string }
              latitud: { type: [string, 'null'] }
              longitud: { type: [string, 'null'] }
              parroquias:
                type: array
                items:
                  type: object
                  required: [codigo, nombre]
                  properties:
                    codigo: { type: string, examples: ['170156'] }
                    nombre: { type: string }

    Plan:
      type: object
      required: [codigo, nombre, limite_administrativos, valor_unidad_sugerido]
      properties:
        codigo: { type: string, enum: [basico, profesional, completo] }
        nombre: { type: string }
        limite_administrativos: { type: integer }
        valor_unidad_sugerido: { $ref: '#/components/schemas/Dinero' }

    AmenidadCatalogo:
      type: object
      required: [id, nombre, categoria, reservable, esencial, requiere_aprobacion]
      properties:
        id: { type: integer }
        nombre: { type: string }
        categoria: { type: string, enum: [recreacion, deporte, social, servicios, seguridad] }
        descripcion: { type: [string, 'null'] }
        reservable: { type: boolean }
        esencial: { type: boolean, description: Nunca se restringe por mora. }
        requiere_aprobacion: { type: boolean }

    UsuarioEncontrado:
      type: object
      required: [id, nombre, activo, condominios]
      properties:
        id: { type: integer }
        nombre: { type: string }
        activo: { type: boolean }
        condominios: { type: integer, description: Condominios donde ya es miembro. }

    CondominioPlataforma:
      type: object
      required: [id, codigo, nombre, tipo, estado, total_unidades, ubicacion, contacto, administradores, creado_en]
      properties:
        id: { type: integer }
        codigo: { type: string, examples: ['SF-0012'] }
        nombre: { type: string }
        tipo: { type: string, enum: [conjunto, edificio, urbanizacion, mixto] }
        ruc: { type: [string, 'null'] }
        razon_social: { type: [string, 'null'] }
        estado: { type: string, enum: [prueba, activo, solo_lectura, suspendido] }
        prueba_hasta: { type: [string, 'null'], format: date }
        total_unidades: { type: integer }
        valor_unidad:
          oneOf:
            - { $ref: '#/components/schemas/Dinero' }
            - { type: 'null' }
        mensualidad:
          description: total_unidades × valor_unidad, sin IVA.
          oneOf:
            - { $ref: '#/components/schemas/Dinero' }
            - { type: 'null' }
        plan:
          oneOf:
            - type: object
              required: [codigo, nombre]
              properties:
                codigo: { type: string }
                nombre: { type: string }
            - { type: 'null' }
        ubicacion:
          type: object
          properties:
            provincia: { type: [string, 'null'] }
            canton: { type: [string, 'null'] }
            parroquia: { type: [string, 'null'] }
            direccion: { type: [string, 'null'] }
            latitud: { type: [string, 'null'] }
            longitud: { type: [string, 'null'] }
        contacto:
          type: object
          properties:
            telefono: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
        administradores:
          type: array
          items:
            type: object
            required: [id, nombre, email, estado]
            properties:
              id: { type: integer }
              nombre: { type: string }
              email: { type: string }
              estado: { type: string, enum: [activo, invitado] }
        creado_en: { type: string, format: date-time }

    NuevoCondominio:
      type: object
      required: [nombre, tipo, ruc, razon_social, provincia_codigo, canton_codigo, parroquia_codigo, direccion, total_unidades, plan_codigo, valor_unidad, latitud, longitud, cobro, administrador]
      properties:
        nombre: { type: string, maxLength: 120 }
        tipo: { type: string, enum: [conjunto, edificio, urbanizacion, mixto] }
        ruc: { type: string, pattern: '^\d{13}$', description: RUC válido y único en la plataforma. }
        razon_social: { type: string, maxLength: 160 }
        provincia_codigo: { type: string, examples: ['17'] }
        canton_codigo: { type: string, description: Cantón de esa provincia. }
        parroquia_codigo: { type: string, description: Parroquia de ese cantón. }
        direccion: { type: string, maxLength: 200 }
        telefono: { type: [string, 'null'], pattern: '^0\d{8,9}$' }
        email_contacto: { type: [string, 'null'], format: email }
        total_unidades: { type: integer, minimum: 1, maximum: 10000, description: Límite de registro y base de la mensualidad. }
        plan_codigo: { type: string, enum: [basico, profesional, completo] }
        valor_unidad: { $ref: '#/components/schemas/Dinero' }
        latitud: { type: number, minimum: -5.1, maximum: 1.7 }
        longitud: { type: number, minimum: -92.1, maximum: -75.1 }
        cobro:
          type: object
          required: [metodo, dia_vencimiento, primera_cuota]
          properties:
            metodo: { type: string, enum: [general, tipo, alicuota, unidad] }
            cuota_general:
              description: Obligatoria con método general.
              oneOf:
                - { $ref: '#/components/schemas/Dinero' }
                - { type: 'null' }
            presupuesto_mensual:
              description: Obligatorio con método por alícuota.
              oneOf:
                - { $ref: '#/components/schemas/Dinero' }
                - { type: 'null' }
            valores_tipo:
              description: Obligatorio con método por tipo.
              type: [array, 'null']
              items:
                type: object
                required: [tipo, valor]
                properties:
                  tipo: { type: string, enum: [departamento, casa, local, parqueadero, bodega] }
                  valor: { $ref: '#/components/schemas/Dinero' }
            dia_vencimiento: { type: integer, minimum: 0, maximum: 28, description: 0 = último día del mes. }
            primera_cuota: { type: string, pattern: '^\d{4}-\d{2}$', description: Mes actual o futuro (AAAA-MM). }
        amenidades:
          type: [array, 'null']
          items:
            type: object
            required: [amenidad_id, cantidad]
            properties:
              amenidad_id: { type: integer }
              cantidad: { type: integer, minimum: 1, maximum: 999 }
        administrador:
          type: object
          required: [cedula, nombre, email]
          properties:
            cedula: { type: string, pattern: '^\d{10}$', description: Cédula ecuatoriana válida. }
            nombre: { type: string, maxLength: 120 }
            email: { type: string, format: email }
            celular: { type: [string, 'null'], pattern: '^09\d{8}$' }
