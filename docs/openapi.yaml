        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
    delete:
      tags: [Plataforma]
      operationId: eliminarTipoAmenidad
      summary: Eliminar un tipo que ningún condominio usa
      description: 'Permiso: `plataforma.condominios`. 409 `AMENIDAD_EN_USO` (con `error.details.condominios`) si alguno lo usa: solo se puede desactivar.'
      x-permiso: plataforma.condominios
