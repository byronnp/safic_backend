        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /personas:
    get:
      tags: [Unidades]
      operationId: listarPersonas
      summary: Listar personas del condominio
      description: |
        Permiso: `unidades.ver`. `buscar` filtra por nombre (contiene) y, solo con
        `residentes.ver_datos`, por documento exacto. Sin ese permiso documento, teléfono
        y correo salen enmascarados.
      x-permiso: unidades.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - in: query
          name: buscar
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: por_pagina
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Página de personas.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Persona' }
                  meta:
                    type: object
                    required: [pagination]
                    properties:
                      pagination: { $ref: '#/components/schemas/Paginacion' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    post:
      tags: [Unidades]
      operationId: crearPersona
      summary: Registrar una persona
      description: 'Permiso: `unidades.editar`. El documento se valida según su tipo y no se repite en el condominio.'
      x-permiso: unidades.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarPersona' }
      responses:
        '201':
          description: Persona registrada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Persona' }
                  message: { type: string, examples: ['Persona registrada.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /personas/{persona}/acceso:
    post:
      tags: [Usuarios]
      operationId: darAccesoResidente
      summary: Dar acceso a la app a una persona que ocupa una unidad
      description: |
        Permiso: `usuarios.gestionar`. Crea (o reutiliza, por correo) la cuenta de la persona, la liga a su ficha, le asigna el
        perfil `residente` y le envía el enlace para crear su contraseña si aún no está activa. No cuenta para el límite de
        usuarios del plan. 409 `PERSONA_YA_TIENE_ACCESO`; 422 `PERSONA_SIN_UNIDAD` (no ocupa hoy una unidad como propietario,
        inquilino o residente, o es de otro condominio), `PERSONA_SIN_CORREO`, `CEDULA_EN_USO`.
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - $ref: '#/components/parameters/PersonaId'
      responses:
        '201':
          description: Acceso creado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [persona_id, invitacion_enviada]
                    properties:
                      persona_id: { type: integer }
                      invitacion_enviada: { type: boolean, description: 'false si la cuenta ya estaba activa.' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          description: '`PERSONA_YA_TIENE_ACCESO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Código en `error.code` (ver la descripción).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

