      type: object
      description: En `POST` todo es obligatorio salvo los booleanos; en `PATCH` todo es opcional.
      properties:
        banco: { type: string, minLength: 2, maxLength: 60 }
        tipo: { type: string, enum: [corriente, ahorros] }
        numero: { type: string, pattern: '^[0-9A-Za-z-]{5,30}$' }
        titular: { type: string, minLength: 3, maxLength: 120 }
        es_principal: { type: boolean }
        activa: { type: boolean }
