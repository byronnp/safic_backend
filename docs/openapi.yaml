  /plataforma/menu-sistema:
    get:
      tags: [Plataforma]
      operationId: listarMenuSistema
      summary: Ítems del menú de un ámbito, con los perfiles que los ven
      description: |
        Permiso: `plataforma.roles`. `ambito` = `condominio` | `plataforma`. Devuelve los ítems en orden (cada grupo seguido
        de sus hijos) y los perfiles y permisos que se pueden elegir en ese ámbito.
      x-permiso: plataforma.roles
      parameters:
        - { name: ambito, in: query, required: true, schema: { type: string, enum: [condominio, plataforma] } }
      responses:
        '200':
          description: Menú del ámbito.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MenuSistema' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '422':
          description: Falta el ámbito.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Plataforma]
      operationId: crearMenuItem
      summary: Agregar una pantalla o un grupo al menú
      description: |
        Permiso: `plataforma.roles`. Sin `ruta` es un grupo (no lleva padre ni perfiles); con `ruta` es una pantalla, que
        puede ir dentro de un grupo. La clave se genera (`{ambito}.{slug}`) y va al final de sus hermanos. El cambio rige
        para todos los condominios al instante. 422 `PERFIL_INVALIDO` si algún perfil no es del ámbito.
      x-permiso: plataforma.roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ambito, etiqueta, icono]
              properties:
                ambito: { type: string, enum: [condominio, plataforma] }
                padre_id: { type: [integer, 'null'] }
                etiqueta: { type: string, minLength: 2, maxLength: 60 }
                icono: { type: string, examples: ['sym_r_gavel'] }
                ruta: { type: [string, 'null'], examples: ['reglamento'] }
                permiso: { type: [string, 'null'] }
                seccion: { type: boolean }
                activo: { type: boolean }
                roles: { type: array, items: { type: string } }
      responses:
        '201':
          description: Ítem creado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MenuSistemaItem' }
                  message: { type: string, examples: ['Ítem agregado al menú.'] }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '422':
          description: Datos inválidos o `PERFIL_INVALIDO`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /plataforma/menu-sistema/vista-previa:
    get:
      tags: [Plataforma]
      operationId: vistaPreviaMenuSistema
      summary: Cómo ve el menú un perfil
      description: 'Permiso: `plataforma.roles`. `menu` es lo que ve el perfil; `ocultos`, los ítems activos que no le llegan.'
      x-permiso: plataforma.roles
      parameters:
        - { name: ambito, in: query, required: true, schema: { type: string, enum: [condominio, plataforma] } }
        - { name: perfil, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Vista previa.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [menu, ocultos]
                    properties:
                      menu: { type: array, items: { type: object, additionalProperties: true } }
                      ocultos: { type: integer, description: Pantallas activas que no le llegan al perfil. }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'

  /plataforma/menu-sistema/{item}:
    patch:
      tags: [Plataforma]
      operationId: editarMenuItem
      summary: Editar un ítem del menú
      description: |
        Permiso: `plataforma.roles`. Solo lo que cambia (etiqueta, ícono, ruta, permiso, activo, perfiles). Los ítems no se
        borran: se desactivan. Una pantalla no puede quedar sin ruta, un grupo no tiene ruta ni perfiles.
      x-permiso: plataforma.roles
      parameters:
        - { name: item, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                etiqueta: { type: string, minLength: 2, maxLength: 60 }
                icono: { type: string }
                ruta: { type: string }
                permiso: { type: [string, 'null'] }
                activo: { type: boolean }
                roles: { type: array, items: { type: string } }
      responses:
        '200':
          description: Ítem actualizado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MenuSistemaItem' }
                  message: { type: string, examples: ['Cambios guardados.'] }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          description: Datos inválidos o `PERFIL_INVALIDO`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /plataforma/menu-sistema/{item}/mover:
    post:
      tags: [Plataforma]
      operationId: moverMenuItem
      summary: Subir o bajar un ítem entre sus hermanos
      description: 'Permiso: `plataforma.roles`. En el extremo no cambia nada. Devuelve todos los ítems del ámbito en su nuevo orden.'
      x-permiso: plataforma.roles
      parameters:
        - { name: item, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direccion]
              properties:
                direccion: { type: string, enum: [arriba, abajo] }
      responses:
        '200':
          description: Ítems del ámbito en orden.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MenuSistemaItem' } }
                  message: { type: string, examples: ['Orden actualizado.'] }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /plataforma/roles:
    get:
      tags: [Plataforma]
      operationId: listarRolesPlataforma
      summary: Matriz de roles de condominio por permiso
      description: |
        Permiso: `plataforma.roles`. Los roles de plataforma no se editan aquí. `bloqueos` son las reglas fijas del código
        (permiso → motivo) que ese rol nunca recibe; `obligatorios`, los que no se le pueden quitar. `solicitudes` son los
        pedidos de rol nuevo pendientes de todos los condominios.
      x-permiso: plataforma.roles
      responses:
        '200':
          description: Roles, permisos y solicitudes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RolesAdmin' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
    post:
      tags: [Plataforma]
      operationId: crearRolAdicional
      summary: Crear un rol adicional
      description: |
        Permiso: `plataforma.roles`. La clave se genera del nombre. 409 `ROL_EXISTENTE` si el nombre ya existe; 422 si algún
        permiso no es de condominio (`PERMISO_INVALIDO`).
      x-permiso: plataforma.roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, permisos]
              properties:
                nombre: { type: string, minLength: 3, maxLength: 60 }
                permisos: { type: array, items: { type: string } }
      responses:
        '201':
          description: Rol creado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RolAdmin' }
                  message: { type: string, examples: ['Rol creado.'] }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '409':
          description: '`ROL_EXISTENTE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Datos inválidos o `PERMISO_INVALIDO`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /plataforma/roles/{rol}/permisos:
    put:
      tags: [Plataforma]
      operationId: guardarPermisosRol
      summary: Reemplazar los permisos de un rol
      description: |
        Permiso: `plataforma.roles`. Se envía el conjunto completo que queda. Rige en todos los condominios al instante.
        422 `PERMISO_BLOQUEADO` (regla fija del código), `PERMISO_OBLIGATORIO` (el administrador necesita gestionar
        usuarios) o `PERMISO_INVALIDO`. 404 `ROL_NO_ENCONTRADO` si no es un rol de condominio.
      x-permiso: plataforma.roles
      parameters:
        - { name: rol, in: path, required: true, schema: { type: string }, description: Clave del rol. }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permisos]
              properties:
                permisos: { type: array, items: { type: string } }
      responses:
        '200':
          description: Rol actualizado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RolAdmin' }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          description: '`PERMISO_BLOQUEADO`, `PERMISO_OBLIGATORIO` o `PERMISO_INVALIDO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /plataforma/bitacora:
    get:
      tags: [Plataforma]
      operationId: listarBitacoraPlataforma
      summary: Bitácora de cambios de plataforma
      description: |
        Permiso: `plataforma.auditoria` (super admin). Quién cambió qué en condominios, membresías, catálogo de amenidades,
        menú, roles y permisos, con los valores antes y después. Solo lectura, del más reciente al más antiguo. Los datos
        personales (teléfono, correo) no se guardan. Solo se registra lo que hace una persona con sesión.
      x-permiso: plataforma.auditoria
      parameters:
        - { name: entidad, in: query, schema: { type: string, enum: [condominio, membresia, catalogo_amenidad, menu, rol] } }
        - { name: evento, in: query, schema: { type: string, enum: [creado, actualizado, eliminado] } }
        - { name: usuario_id, in: query, schema: { type: integer } }
        - { name: condominio_id, in: query, schema: { type: integer } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: buscar, in: query, description: 'Texto en el nombre del registro o de quien lo cambió.', schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: por_pagina, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Página de registros.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RegistroBitacora' } }
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          page: { type: integer }
                          per_page: { type: integer }
                          total: { type: integer }
                          last_page: { type: integer }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '422':
          description: Filtro inválido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /plataforma/usuarios/{usuario}/doble-factor/restablecer:
    post:
      tags: [Plataforma]
      operationId: restablecerDobleFactorPlataforma
      summary: Restablecer la verificación en dos pasos de cualquier cuenta
      description: |
        Permiso: `plataforma.condominios`. Para un administrador que perdió su teléfono y sus códigos (no tiene a quién
        pedírselo en su condominio). Exige el motivo y queda en la bitácora de plataforma. No sirve para la propia cuenta
        (422 `RESTABLECIMIENTO_PROPIO`). 409 `DOBLE_FACTOR_NO_ACTIVO`.
      x-permiso: plataforma.condominios
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '200':
          description: Restablecida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`DOBLE_FACTOR_NO_ACTIVO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /plataforma/usuarios/buscar:
    get:
      tags: [Plataforma]
      operationId: buscarUsuarioPorCorreo
      summary: ¿El administrador ya tiene cuenta?
      description: Devuelve `data null` si no existe o el correo no es válido.
      x-permiso: plataforma.condominios
      parameters:
        - in: query
          name: email
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: Usuario encontrado o null.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - { $ref: '#/components/schemas/UsuarioEncontrado' }
                      - { type: 'null' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'

  /plataforma/condominios:
    get:
      tags: [Plataforma]
      operationId: listarCondominiosPlataforma
      summary: Condominios de la plataforma
      description: Paginado y ordenado por nombre. `buscar` filtra por nombre, código o inicio del RUC.
      x-permiso: plataforma.condominios
      parameters:
        - in: query
          name: buscar
          required: false
          schema: { type: string }
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: por_pagina
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Página de condominios.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CondominioPlataforma' }
                  meta:
                    type: object
                    properties:
                      pagination: { $ref: '#/components/schemas/Paginacion' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
    post:
      tags: [Plataforma]
      operationId: crearCondominio
      summary: Alta de condominio (asistente de 5 pasos)
      description: |
        Todo o nada: condominio (estado `prueba` por 30 días), configuración de cobro,
        amenidades y administrador. Si el correo del administrador ya tiene cuenta se
        asocia; si no, se crea inactivo y se le envía la invitación por correo.
        Errores de negocio: `CEDULA_EN_USO` (la cédula es de otra persona).
      x-permiso: plataforma.condominios
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoCondominio' }
      responses:
        '201':
          description: Condominio creado.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/CondominioPlataforma' }
                  meta:
                    type: object
                    required: [administrador_existente, invitacion_enviada]
                    properties:
                      administrador_existente: { type: boolean }
                      invitacion_enviada: { type: boolean }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '422':
          $ref: '#/components/responses/Validacion'

  /plataforma/condominios/{condominio}:
    get:
      tags: [Plataforma]
      operationId: verCondominioPlataforma
      summary: Detalle de un condominio
      x-permiso: plataforma.condominios
      parameters:
        - in: path
          name: condominio
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Condominio.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CondominioPlataforma' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    patch:
      tags: [Plataforma]
      operationId: editarCondominioPlataforma
      summary: Editar los datos de un condominio
      description: |
        Permiso: `plataforma.condominios-editar` (solo el super admin). Solo viaja lo que cambia. El RUC no se repite;
        el total de unidades no baja de las ya registradas (422 `UNIDADES_REGISTRADAS`); cantón y parroquia deben
        pertenecer a su provincia y cantón (422 `UBICACION_INCOHERENTE`). Queda en la bitácora de plataforma.
      x-permiso: plataforma.condominios-editar
      parameters:
        - in: path
          name: condominio
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, minLength: 2, maxLength: 120 }
                tipo: { type: string, enum: [conjunto, edificio, urbanizacion, mixto] }
                ruc: { type: string }
                razon_social: { type: string, maxLength: 160 }
                provincia_codigo: { type: string }
                canton_codigo: { type: string }
                parroquia_codigo: { type: string }
                direccion: { type: string, maxLength: 200 }
                telefono: { type: [string, 'null'] }
                email_contacto: { type: [string, 'null'], format: email }
                total_unidades: { type: integer, minimum: 1, maximum: 10000 }
                plan_codigo: { type: string }
                valor_unidad: { type: string, examples: ['1.50'] }
                latitud: { type: number }
                longitud: { type: number }
      responses:
        '200':
          description: Condominio actualizado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CondominioPlataforma' }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'

  /plataforma/condominios/{condominio}/inactivar:
    post:
      tags: [Plataforma]
      operationId: inactivarCondominio
      summary: Inactivar (suspender) un condominio
      description: |
        Permiso: `plataforma.condominios-editar` (solo el super admin). Corta el acceso de todos los usuarios del
        condominio al instante, sin borrar nada. Exige motivo y queda en la bitácora. Guarda el estado previo para
        devolverlo al reactivar. 409 `CONDOMINIO_YA_INACTIVO`.
      x-permiso: plataforma.condominios-editar
      parameters:
        - in: path
          name: condominio
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200':
          description: Condominio inactivo (estado `suspendido`).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CondominioPlataforma' }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`CONDOMINIO_YA_INACTIVO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /plataforma/condominios/{condominio}/reactivar:
    post:
      tags: [Plataforma]
      operationId: reactivarCondominio
      summary: Reactivar un condominio inactivo
      description: 'Permiso: `plataforma.condominios-editar` (solo el super admin). Vuelve al estado que tenía antes de suspenderlo. Exige motivo. 409 `CONDOMINIO_NO_INACTIVO`.'
      x-permiso: plataforma.condominios-editar
      parameters:
        - in: path
          name: condominio
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200':
          description: Condominio reactivado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CondominioPlataforma' }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`CONDOMINIO_NO_INACTIVO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /plataforma/condominios/{condominio}/administradores/{usuario}/invitacion:
    post:
      tags: [Plataforma]
      operationId: reenviarInvitacionAdministrador
      summary: Reenviar la invitación a un administrador (y corregir su correo)
      description: |
        Solo mientras el administrador no haya creado su contraseña (si ya lo hizo, 409
        `ADMINISTRADOR_ACTIVO`). Anula el enlace anterior y envía uno nuevo. Con `email`
        corrige antes el correo (no puede ser de otra cuenta).
      x-permiso: plataforma.condominios
      parameters:
        - in: path
          name: condominio
          required: true
          schema: { type: integer }
        - in: path
          name: usuario
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: [string, 'null'], format: email, maxLength: 160 }
      responses:
        '200':
          description: Invitación reenviada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, nombre, email, estado]
                    properties:
                      id: { type: integer }
                      nombre: { type: string }
                      email: { type: string, format: email }
                      estado: { type: string, const: invitado }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`ADMINISTRADOR_ACTIVO`: ya creó su contraseña.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TokenInvitacion:
      in: path
      name: token
      required: true
      description: Token de 64 caracteres recibido por correo.
      schema: { type: string }
    UnidadId:
      name: unidad
      in: path
      required: true
      schema: { type: integer }
    PersonaId:
      name: persona
      in: path
      required: true
      schema: { type: integer }
    CargoDirectivaParametro:
      name: cargo
      in: path
      required: true
      schema: { type: string, enum: [presidente, vicepresidente, secretario, tesorero] }
    UsuarioId:
      name: usuario
      in: path
      required: true
      description: Id de la persona (debe pertenecer al condominio del header).
      schema: { type: integer }
    VarianteLogo:
      name: variante
      in: path
      required: true
      description: Fondo sobre el que se usa el logo.
      schema: { type: string, enum: [claro, oscuro] }
    CondominioId:
      in: header
      name: X-Condominio-Id
      required: true
      description: Condominio activo. El usuario debe tener membresía activa en él.
      schema: { type: integer, minimum: 1 }
    TipoCliente:
      in: header
      name: X-Client-Type
      required: false
      description: '`mobile` en las apps: el refresh token viaja en el cuerpo en lugar de la cookie.'
      schema: { type: string, enum: [mobile] }

  responses:
    SinPermiso:
      description: '`SIN_PERMISO`: no tiene el permiso de plataforma de la ruta.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ConflictoUsuarios:
      description: |
        `LIMITE_USUARIOS` (con `error.details.limite` y `usados`), `USUARIO_YA_EXISTE`, `USUARIO_PROPIO`,
        `ULTIMO_ADMINISTRADOR`, `USUARIO_ACTIVO`, `PERSONA_CON_CARGO` o `YA_ES_TITULAR`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoEncontrado:
      description: '`NO_ENCONTRADO`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvitacionInvalida:
      description: '`INVITACION_INVALIDA`: el token no existe, venció o ya se usó.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Token:
      description: |
        Par de tokens. En web, además, `Set-Cookie: safic_refresh=...; Path=/api/v1/auth; HttpOnly; SameSite=Strict`.
      headers:
        Set-Cookie:
          description: Solo en web.
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/RespuestaToken' }
    NoAutenticado:
      description: '`NO_AUTENTICADO`: falta el token, expiró o está en la lista negra.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CondominioRequerido:
      description: '`CONDOMINIO_REQUERIDO`: falta `X-Condominio-Id` o no es un número válido.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CondominioNoPermitido:
      description: '`CONDOMINIO_NO_PERMITIDO`: el usuario no tiene membresía activa en ese condominio.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SinPermisoOCondominio:
      description: '`SIN_PERMISO` (falta el permiso de la ruta) o `CONDOMINIO_NO_PERMITIDO`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SinPermisoPlataforma:
      description: '`SIN_PERMISO`: el usuario no tiene perfil de plataforma o le falta el permiso de la ruta.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LimiteUnidades:
      description: '`LIMITE_UNIDADES`: se alcanzó el total de unidades contratadas. `error.details` trae `total` y `registradas`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ConflictoOcupante:
      description: '`PRINCIPAL_OCUPADO` (`details.ocupante_id`), `OCUPANTE_DUPLICADO` u `OCUPANTE_FINALIZADO`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validacion:
      description: '`VALIDACION`: los errores por campo vienen en `error.fields`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DemasiadosIntentos:
      description: '`DEMASIADOS_INTENTOS`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Código estable en MAYÚSCULAS; el frontend decide por él.
              examples: [VALIDACION]
            message:
              type: string
              description: Mensaje en español de Ecuador, listo para mostrar.
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            details:
              type: object
              additionalProperties: true

    RespuestaVacia:
      type: object
      required: [data]
      properties:
        data: { type: 'null' }
        message: { type: string }

    Paginacion:
      description: Va en `meta.pagination` de las respuestas paginadas.
      type: object
      required: [page, per_page, total, last_page]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }

    RespuestaToken:
      type: object
      required: [access_token, token_type, expires_in, usuario]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in:
          type: integer
          description: Segundos de vida del access token (900).
          examples: [900]
        refresh_token:
          type: string
          description: 'Solo con `X-Client-Type: mobile`.'
        usuario: { $ref: '#/components/schemas/Usuario' }

    DesafioDobleFactor:
      type: object
      description: La contraseña fue correcta pero la cuenta tiene verificación en dos pasos; falta el código.
      required: [requiere_2fa, desafio, expira_en]
      properties:
        requiere_2fa: { type: boolean, const: true }
        desafio: { type: string, description: 'Token de un solo propósito (64 caracteres), no es una sesión.' }
        expira_en: { type: integer, description: Segundos (300). }

    CodigosRespaldo:
      type: object
      required: [codigos_respaldo]
      properties:
        codigos_respaldo:
          type: array
          description: 8 códigos de un solo uso. Solo se muestran esta vez.
          items: { type: string, examples: ['ABCDE-FGHJK'] }

    Usuario:
      type: object
      required: [id, nombre, email, doble_factor, plataforma]
      properties:
        id: { type: integer }
        nombre: { type: string }
        email: { type: string, format: email }
        condominios:
          type: array
          description: Solo condominios con membresía activa (los del selector).
          items: { $ref: '#/components/schemas/CondominioResumen' }
        doble_factor:
          type: object
          required: [activo, obligatorio]
          properties:
            activo: { type: boolean }
            obligatorio: { type: boolean, description: 'true si es contador en algún condominio: no puede desactivarla.' }
        plataforma:
          description: Perfil de plataforma (super admin, soporte, cobranza…) o null si no tiene.
          oneOf:
            - { $ref: '#/components/schemas/ContextoPlataforma' }
            - { type: 'null' }

    ContextoPlataforma:
      type: object
      description: Roles y permisos de plataforma (equipo 0). No sirven dentro de un condominio.
      required: [roles, permisos]
      properties:
        roles: { type: array, items: { type: string } }
        permisos: { type: array, items: { type: string } }

    CondominioResumen:
      type: object
      required: [id, codigo, nombre, es_principal, estado, marca]
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        es_principal: { type: boolean }
        estado:
          type: string
          enum: [activo, prueba, solo_lectura, suspendido]
        marca:
          oneOf:
            - { $ref: '#/components/schemas/MarcaCondominio' }
            - { type: 'null' }

    MarcaCondominio:
      type: object
      description: |
        Apariencia del condominio. Los colores de estado no se personalizan. Los logos son enlaces relativos a
        `/api/v1/marca/{codigo}/logo/{variante}` (públicos, con `?v=` para la caché); la ruta interna del archivo
        nunca sale de la API.
      required: [color_primario, color_acento, logo_url, logo_claro_url, logo_oscuro_url]
      properties:
        color_primario: { type: [string, 'null'], pattern: '^#[0-9A-F]{6}$' }
        color_acento: { type: [string, 'null'], pattern: '^#[0-9A-F]{6}$' }
        logo_url: { type: [string, 'null'], description: 'El logo de fondo claro (o el oscuro si es el único).' }
        logo_claro_url: { type: [string, 'null'] }
        logo_oscuro_url: { type: [string, 'null'] }

    DatosCondominio:
      type: object
      description: Datos del propio condominio. RUC, razón social y tipo los cambia la plataforma.
      required: [id, codigo, nombre, tipo, ruc, razon_social, telefono, email_contacto, direccion, provincia, canton, parroquia, latitud, longitud, marca]
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        tipo: { type: [string, 'null'], enum: [conjunto, edificio, urbanizacion, mixto, null] }
        ruc: { type: [string, 'null'] }
        razon_social: { type: [string, 'null'] }
        telefono: { type: [string, 'null'], examples: ['022334455'] }
        email_contacto: { type: [string, 'null'] }
        direccion: { type: [string, 'null'] }
        provincia: { $ref: '#/components/schemas/UbicacionCodigoNombre' }
        canton: { $ref: '#/components/schemas/UbicacionCodigoNombre' }
        parroquia: { $ref: '#/components/schemas/UbicacionCodigoNombre' }
        latitud: { type: [string, 'null'], examples: ['-0.180000'] }
        longitud: { type: [string, 'null'], examples: ['-78.470000'] }
        marca: { $ref: '#/components/schemas/MarcaCondominio' }

    UbicacionCodigoNombre:
      type: [object, 'null']
      required: [codigo, nombre]
      properties:
        codigo: { type: string }
        nombre: { type: string }

    ActualizarDatosCondominio:
      type: object
      description: Solo viaja lo que cambia. Provincia, cantón y parroquia van juntos; latitud y longitud también.
      properties:
        nombre: { type: string, maxLength: 120 }
        telefono: { type: [string, 'null'], pattern: '^0\d{8,9}$' }
        email_contacto: { type: [string, 'null'], format: email, maxLength: 160 }
        direccion: { type: string, maxLength: 200 }
        provincia_codigo: { type: string }
        canton_codigo: { type: string }
        parroquia_codigo: { type: string }
        latitud: { type: number, minimum: -5.1, maximum: 1.7 }
        longitud: { type: number, minimum: -92.1, maximum: -75.1 }
        color_primario: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$', description: 'null restablece el color de SAFIC.' }
        color_acento: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$', description: 'null restablece el color de SAFIC.' }

    ContextoCondominio:
      type: object
      required: [condominio_id, roles, permisos, doble_factor_pendiente]
      properties:
        condominio_id: { type: integer }
        doble_factor_pendiente:
          type: boolean
          description: 'Es contador aquí y aún no activó la verificación en dos pasos: el resto de rutas del condominio responde 403 `DOBLE_FACTOR_REQUERIDO` hasta que lo haga.'
        roles:
          type: array
          items: { type: string }
        permisos:
          type: array
          description: Nombres del enum `Permiso`, ordenados.
          items: { type: string, examples: [unidades.ver] }

    TipoUnidad:
      type: string
      enum: [departamento, casa, local, parqueadero, bodega]

    Unidad:
      type: object
      required: [id, codigo, bloque, tipo, piso, area_m2, alicuota, cuota_mensual, valor_personalizado, responsable_pago, estado, propietarios, ocupante_principal]
      properties:
        id: { type: integer }
        codigo: { type: string, examples: ['A-102'] }
        bloque:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, nombre]
              properties:
                id: { type: integer }
                nombre: { type: string }
        tipo: { $ref: '#/components/schemas/TipoUnidad' }
        piso: { type: [integer, 'null'] }
        area_m2: { type: string, pattern: '^\d+\.\d{2}$', examples: ['84.00'] }
        alicuota:
          type: [string, 'null']
          pattern: '^\d+\.\d{4}$'
          description: Porcentaje con 4 decimales (`0.6200` = 0,62 %).
        cuota_mensual:
          oneOf: [{ $ref: '#/components/schemas/Dinero' }, { type: 'null' }]
        valor_personalizado:
          oneOf: [{ $ref: '#/components/schemas/Dinero' }, { type: 'null' }]
        responsable_pago: { type: string, enum: [propietario, inquilino] }
        estado:
          type: string
          enum: [ocupada, arrendada, vacia]
          description: 'Con inquilino vigente: arrendada; con ocupante principal o residente vigente: ocupada; si no, vacía.'
        propietarios:
          type: array
          description: Nombres de los propietarios vigentes, el principal primero.
          items: { type: string }
        ocupante_principal:
          oneOf:
            - type: 'null'
            - type: object
              required: [nombre, relacion]
              properties:
                nombre: { type: string }
                relacion: { $ref: '#/components/schemas/RelacionOcupante' }

    UnidadDetalle:
      allOf:
        - $ref: '#/components/schemas/Unidad'
        - type: object
          required: [ocupantes, vehiculos, mascotas]
          properties:
            ocupantes:
              type: array
              description: Ocupantes vigentes, el principal primero.
              items: { $ref: '#/components/schemas/Ocupante' }
            vehiculos:
              type: array
              items: { $ref: '#/components/schemas/Vehiculo' }
            mascotas:
              type: array
              items: { $ref: '#/components/schemas/Mascota' }

    Vehiculo:
      type: object
      required: [id, unidad_id, placa, tipo, marca, modelo, color]
      properties:
        id: { type: integer }
        unidad_id: { type: integer }
        placa: { type: string, examples: ['PBA-1234', 'IA-123B'] }
        tipo: { type: string, enum: [auto, moto] }
        marca: { type: [string, 'null'] }
        modelo: { type: [string, 'null'] }
        color: { type: [string, 'null'] }

    GuardarVehiculo:
      type: object
      description: En `POST`, `placa` y `tipo` son obligatorios; en `PATCH` todo es opcional.
      properties:
        placa: { type: string, maxLength: 10, description: 'Con o sin guion, en mayúsculas o minúsculas.', examples: ['pba1234'] }
        tipo: { type: string, enum: [auto, moto] }
        marca: { type: [string, 'null'], maxLength: 40 }
        modelo: { type: [string, 'null'], maxLength: 40 }
        color: { type: [string, 'null'], maxLength: 30 }

    Mascota:
      type: object
      required: [id, unidad_id, nombre, especie, raza]
      properties:
        id: { type: integer }
        unidad_id: { type: integer }
        nombre: { type: string }
        especie: { type: string, enum: [perro, gato, ave, otro] }
        raza: { type: [string, 'null'] }

    GuardarMascota:
      type: object
      description: En `POST`, `nombre` y `especie` son obligatorios; en `PATCH` todo es opcional.
      properties:
        nombre: { type: string, maxLength: 40 }
        especie: { type: string, enum: [perro, gato, ave, otro] }
        raza: { type: [string, 'null'], maxLength: 40 }

    RelacionOcupante:
      type: string
      enum: [propietario, inquilino, residente, contacto_emergencia]

    Ocupante:
      type: object
      required: [id, unidad_id, persona, relacion, es_principal, fecha_inicio, fecha_fin, vigente]
      properties:
        id: { type: integer }
        unidad_id: { type: integer }
        persona: { $ref: '#/components/schemas/Persona' }
        relacion: { $ref: '#/components/schemas/RelacionOcupante' }
        es_principal: { type: boolean, description: Quien vive en la unidad como titular. }
        fecha_inicio: { type: string, format: date }
        fecha_fin: { type: [string, 'null'], format: date }
        vigente: { type: boolean, description: 'Hoy, en la zona horaria del condominio.' }

    AsignarOcupante:
      type: object
      required: [persona_id, relacion, fecha_inicio]
      properties:
        persona_id: { type: integer }
        relacion: { $ref: '#/components/schemas/RelacionOcupante' }
        es_principal: { type: boolean, default: false }
        fecha_inicio: { type: string, format: date }
        fecha_fin: { type: [string, 'null'], format: date }

    Persona:
      type: object
      required: [id, tipo_documento, documento, nombres, apellidos, nombre_completo, telefono, email, tiene_acceso, datos_enmascarados]
      properties:
        id: { type: integer }
        tipo_documento: { type: string, enum: [cedula, ruc, pasaporte] }
        documento: { type: string, examples: ['1712345689', '17••••••89'] }
        nombres: { type: string }
        apellidos: { type: string }
        nombre_completo: { type: string }
        telefono: { type: [string, 'null'], examples: ['0991234534', '09••••••34'] }
        email: { type: [string, 'null'] }
        tiene_acceso: { type: boolean, description: Si ya tiene cuenta para entrar a la app del residente. }
        datos_enmascarados:
          type: boolean
          description: 'true si documento, teléfono y correo vienen enmascarados (sin `residentes.ver_datos`).'

    GuardarPersona:
      type: object
      description: En `POST` todo es obligatorio salvo `email`; en `PATCH` todo es opcional.
      properties:
        tipo_documento: { type: string, enum: [cedula, ruc, pasaporte] }
        documento: { type: string, description: 'Cédula (módulo 10), RUC o pasaporte (5 a 20 letras o números). Único en el condominio.' }
        nombres: { type: string, maxLength: 80 }
        apellidos: { type: string, maxLength: 80 }
        telefono: { type: string, pattern: '^09\d{8}$' }
        email: { type: [string, 'null'], format: email, maxLength: 160 }

    GuardarUnidad:
      type: object
      description: |
        En `POST`, `codigo`, `tipo` y `area_m2` son obligatorios; en `PATCH` todos son opcionales.
        Área, alícuota y montos se envían como texto decimal ("84.50"); también se aceptan números.
      properties:
        codigo: { type: string, maxLength: 20, examples: ['A-102'] }
        bloque_id: { type: [integer, 'null'] }
        tipo: { $ref: '#/components/schemas/TipoUnidad' }
        piso: { type: [integer, 'null'], minimum: -5, maximum: 200 }
        area_m2: { type: [string, number], pattern: '^\d+(\.\d{1,2})?$', examples: ['84.00'], description: 'Mayor que 0. Se recomienda texto decimal.' }
        responsable_pago: { type: string, enum: [propietario, inquilino], default: propietario }
        alicuota: { type: [string, number, 'null'], pattern: '^\d+(\.\d{1,4})?$', examples: ['0.6200'], description: 'Porcentaje mayor que 0 y hasta 100, con hasta 4 decimales. Obligatoria con método `alicuota`.' }
        cuota_mensual: { type: [string, number], pattern: '^\d+(\.\d{1,2})?$', examples: ['90.00'], description: 'Monto mayor que 0 como texto decimal. Solo y obligatoria con método `unidad`.' }
        valor_personalizado: { type: [string, number, 'null'], pattern: '^\d+(\.\d{1,2})?$', examples: ['75.50'], description: 'Monto mayor que 0 como texto decimal. Solo con método `tipo` o `alicuota`.' }

    CargoDirectiva:
      type: object
      required: [cargo, etiqueta, estado, titular, periodo_inicio, periodo_fin, acta]
      properties:
        cargo: { type: string, enum: [presidente, vicepresidente, secretario, tesorero] }
        etiqueta: { type: string, examples: [Presidente] }
        estado: { type: string, enum: [vigente, prorrogado, vacante] }
        titular:
          oneOf:
            - type: object
              required: [persona_id, nombre, unidad, sigue_siendo_propietario]
              properties:
                persona_id: { type: integer }
                nombre: { type: string }
                unidad: { type: [string, 'null'], examples: [C-12] }
                sigue_siendo_propietario: { type: boolean }
            - { type: 'null' }
        periodo_inicio: { type: [string, 'null'], format: date }
        periodo_fin: { type: [string, 'null'], format: date }
        acta: { type: [string, 'null'], examples: ['Acta 2026-01'] }

    CandidatoDirectiva:
      type: object
      required: [persona_id, nombre, unidad, disponible, motivo, cargo_actual]
      properties:
        persona_id: { type: integer }
        nombre: { type: string }
        unidad: { type: string }
        disponible: { type: boolean }
        motivo: { type: [string, 'null'], enum: [ocupa_cargo, sin_correo, null] }
        cargo_actual: { type: [string, 'null'], enum: [presidente, vicepresidente, secretario, tesorero, null] }

    AsignarCargo:
      type: object
      required: [persona_id, acta, periodo_hasta]
      properties:
        persona_id: { type: integer }
        acta: { type: string, maxLength: 80, examples: ['Acta 2026-03'] }
        periodo_hasta: { type: string, format: date, description: 'Después de hoy y hasta 4 años.' }

    RegistroBitacora:
      type: object
      required: [id, fecha, usuario_id, usuario, evento, entidad, entidad_id, etiqueta, condominio_id, antes, despues, ip]
      properties:
        id: { type: integer }
        fecha: { type: string, format: date-time }
        usuario_id: { type: [integer, 'null'] }
        usuario: { type: [string, 'null'], description: 'Nombre de quien hizo el cambio, tal como estaba entonces.' }
        evento: { type: string, enum: [creado, actualizado, eliminado] }
        entidad: { type: string, enum: [condominio, membresia, catalogo_amenidad, menu, rol] }
        entidad_id: { type: [string, 'null'], description: Id o clave del registro cambiado. }
        etiqueta: { type: [string, 'null'], description: Nombre legible del registro. }
        condominio_id: { type: [integer, 'null'] }
        antes: { type: [object, 'null'], additionalProperties: true }
        despues: { type: [object, 'null'], additionalProperties: true }
        ip: { type: [string, 'null'] }
    RolAdmin:
      type: object
      required: [clave, nombre, tipo, condominios, permisos, bloqueos, obligatorios]
      properties:
        clave: { type: string, examples: ['guardia'] }
        nombre: { type: string }
        tipo: { type: string, enum: [sistema, cargo, adicional] }
        condominios: { type: integer, description: En cuántos condominios tiene usuarios. }
        permisos: { type: array, items: { type: string } }
        bloqueos: { type: object, additionalProperties: { type: string }, description: 'Permiso → motivo.' }
        obligatorios: { type: array, items: { type: string } }
    RolesAdmin:
      type: object
      required: [roles, permisos, solicitudes]
      properties:
        roles: { type: array, items: { $ref: '#/components/schemas/RolAdmin' } }
        permisos:
          type: array
          items:
            type: object
            required: [clave, etiqueta, grupo, administrativo, escritura]
            properties:
