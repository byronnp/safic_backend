openapi: 3.1.0
info:
  title: SAFIC API
  version: 0.1.0
  summary: Sistema de Administración Financiera de Condominios
  license:
    name: Propietario
    identifier: LicenseRef-SAFIC
  description: |
    API de SAFIC (`/api/v1`). Contrato vivo: toda ruta nueva se documenta aquí en el
    mismo pull request. La prueba `tests/Feature/Contrato/ContratoOpenApiTest.php`
    falla si una ruta de `routes/api.php` no está en este archivo o al revés.

    **Formato común**
    - Éxito: `{ "data": ..., "meta"?: {...}, "message"?: "..." }`
    - Error: `{ "error": { "code": "CODIGO_ESTABLE", "message": "...", "fields"?: {...}, "details"?: {...} } }`

    **Autenticación.** Access token JWT RS256 de 15 min en `Authorization: Bearer`.
    El refresh token rota en cada uso y dura 30 días: en web viaja en la cookie
    HttpOnly `safic_refresh` (ruta `/api/v1/auth`, SameSite=Strict); las apps
    móviles envían `X-Client-Type: mobile` y lo reciben y devuelven en el cuerpo.
    El JWT no lleva roles ni condominio.

    **Condominio.** Las rutas de negocio exigen `X-Condominio-Id` con un condominio
    en el que el usuario tenga membresía activa, y cada una su permiso.

    **Límites.** login: por correo e IP · refresh: 30/min por IP · negocio: 120/min por usuario.
servers:
  - url: http://localhost:8000/api/v1
    description: Local (Docker Compose)

tags:
  - name: Autenticación
    description: Login, renovación del token y cierre de sesión.
  - name: Sesión
    description: Usuario actual y su contexto (roles y permisos) en un condominio.
  - name: Unidades
    description: Bloques, unidades y residentes del condominio.
  - name: Catálogos
    description: Datos compartidos que no dependen del condominio.
  - name: Plataforma
    description: |
      Panel del super admin (`/plataforma/*`). Solo perfiles de plataforma (equipo 0);
      cada ruta exige su permiso de plataforma. No usa `X-Condominio-Id`.

security:
  - bearer: []

paths:
  /auth/login:
    post:
      tags: [Autenticación]
      operationId: login
      summary: Iniciar sesión
      security: []
      parameters:
        - $ref: '#/components/parameters/TipoCliente'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, maxLength: 255 }
      responses:
        '200':
          $ref: '#/components/responses/Token'
        '401':
          description: '`CREDENCIALES_INVALIDAS` (también si el usuario está inactivo).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /auth/refresh:
    post:
      tags: [Autenticación]
      operationId: refrescarToken
      summary: Renovar el access token
      description: |
        Usa la cookie `safic_refresh` (web) o `refresh_token` en el cuerpo (móvil) y
        entrega un par nuevo. Presentar un refresh ya usado revoca toda la familia
        de tokens (`REFRESH_REUTILIZADO`).
      security: []
      parameters:
        - $ref: '#/components/parameters/TipoCliente'
        - in: cookie
          name: safic_refresh
          required: false
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: 'Solo apps móviles (`X-Client-Type: mobile`).'
      responses:
        '200':
          $ref: '#/components/responses/Token'
        '401':
          description: '`REFRESH_INVALIDO` o `REFRESH_REUTILIZADO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /auth/logout:
    post:
      tags: [Autenticación]
      operationId: logout
      summary: Cerrar sesión
      description: |
        Revoca la familia del refresh token, envía el access token a la lista negra
        hasta que expire y borra la cookie.
      parameters:
        - $ref: '#/components/parameters/TipoCliente'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Solo apps móviles.
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaVacia' }
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /auth/me:
    get:
      tags: [Sesión]
      operationId: usuarioActual
      summary: Usuario actual y sus condominios
      responses:
        '200':
          description: Usuario con los condominios donde tiene membresía activa.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Usuario' }
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /me/contexto:
    get:
      tags: [Sesión]
      operationId: contextoCondominio
      summary: Roles y permisos en el condominio activo
      description: El frontend arma el menú y oculta botones con esto; la API igual exige cada permiso.
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Contexto del usuario en el condominio.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ContextoCondominio' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CondominioNoPermitido'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /me/menu:
    get:
      tags: [Sesión]
      operationId: menuCondominio
      summary: Menú del perfil en el condominio activo
      description: |
        Una hoja aparece si está asignada a uno de los perfiles (roles) del usuario en el
        condominio del header **y** el usuario tiene su permiso. Los módulos y secciones
        aparecen solo si les queda alguna hoja. Ocultar no es seguridad: cada ruta exige su permiso.
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Menú en el mismo formato que `ItemMenu` del frontend.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ItemMenu' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CondominioNoPermitido'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /bloques:
    get:
      tags: [Unidades]
      operationId: listarBloques
      summary: Listar bloques del condominio
      description: 'Permiso: `unidades.ver`. Orden: `orden`, luego `nombre`.'
      x-permiso: unidades.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Bloques del condominio activo.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Bloque' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    post:
      tags: [Unidades]
      operationId: crearBloque
      summary: Crear un bloque
      description: 'Permiso: `unidades.editar`. El nombre es único dentro del condominio.'
      x-permiso: unidades.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, maxLength: 60, examples: ['Torre A'] }
                orden: { type: integer, minimum: 0, maximum: 999, default: 0 }
      responses:
        '201':
          description: Bloque creado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Bloque' }
                  message: { type: string, examples: ['Bloque creado.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /unidades:
    get:
      tags: [Unidades]
      operationId: listarUnidades
      summary: Listar unidades del condominio
      description: 'Permiso: `unidades.ver`. Paginado y ordenado por código.'
      x-permiso: unidades.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - in: query
          name: buscar
          description: Parte del código (ej. `A-1`).
          schema: { type: string }
        - in: query
          name: tipo
          schema: { $ref: '#/components/schemas/TipoUnidad' }
        - in: query
          name: bloque_id
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: por_pagina
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Página de unidades.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Unidad' }
                  meta:
                    type: object
                    required: [pagination]
                    properties:
                      pagination: { $ref: '#/components/schemas/Paginacion' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    post:
      tags: [Unidades]
      operationId: crearUnidad
      summary: Crear una unidad
      description: |
        Permiso: `unidades.editar`. Los montos dependen del método de cobro del condominio
        (ver `GET /unidades/resumen`): `alicuota` exige `alicuota` y admite `valor_personalizado`;
        `tipo` admite `valor_personalizado`; `unidad` exige `cuota_mensual`; `general` no pide montos.
        Departamentos, casas y locales cuentan para el total contratado: sin cupo responde 409 `LIMITE_UNIDADES`.
      x-permiso: unidades.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarUnidad' }
      responses:
        '201':
          description: Unidad creada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Unidad' }
                  message: { type: string, examples: ['Unidad creada.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          $ref: '#/components/responses/LimiteUnidades'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /unidades/resumen:
    get:
      tags: [Unidades]
      operationId: resumenUnidades
      summary: Resumen de unidades del condominio
      description: 'Permiso: `unidades.ver`. Avance de carga frente al total contratado, suma de alícuotas y método de cobro.'
      x-permiso: unidades.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Resumen.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ResumenUnidades' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /unidades/{unidad}:
    get:
      tags: [Unidades]
      operationId: verUnidad
      summary: Ver una unidad
      description: 'Permiso: `unidades.ver`. Una unidad de otro condominio responde 404.'
      x-permiso: unidades.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - $ref: '#/components/parameters/UnidadId'
      responses:
        '200':
          description: Unidad.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Unidad' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    patch:
      tags: [Unidades]
      operationId: editarUnidad
      summary: Editar una unidad
      description: |
        Permiso: `unidades.editar`. Solo se envían los campos que cambian. Pasar de parqueadero o
        bodega a un tipo que cuenta para el total exige cupo (409 `LIMITE_UNIDADES`).
      x-permiso: unidades.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - $ref: '#/components/parameters/UnidadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarUnidad' }
      responses:
        '200':
          description: Unidad actualizada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Unidad' }
                  message: { type: string, examples: ['Unidad actualizada.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/LimiteUnidades'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    delete:
      tags: [Unidades]
      operationId: eliminarUnidad
      summary: Eliminar una unidad
      description: 'Permiso: `unidades.editar`. Borrado lógico: conserva el historial y libera el cupo.'
      x-permiso: unidades.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - $ref: '#/components/parameters/UnidadId'
      responses:
        '204':
          description: Unidad eliminada.
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /plataforma/me/menu:
    get:
      tags: [Plataforma]
      operationId: menuPlataforma
      summary: Menú del perfil de plataforma
      description: 'Mismo filtro que /me/menu, con los perfiles y permisos de plataforma.'
      responses:
        '200':
          description: Menú del panel de plataforma.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ItemMenu' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /auth/invitaciones/{token}:
    get:
      tags: [Autenticación]
      operationId: verInvitacion
      summary: Datos de una invitación de primer ingreso
      description: Sin sesión. El token llega por correo; vence a los 7 días y sirve una sola vez.
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenInvitacion'
      responses:
        '200':
          description: A quién corresponde la invitación.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Invitacion' }
        '404':
          $ref: '#/components/responses/InvitacionInvalida'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /auth/invitaciones/{token}/aceptar:
    post:
      tags: [Autenticación]
      operationId: aceptarInvitacion
      summary: Crear la contraseña y activar la cuenta
      description: Después, la SPA inicia sesión con `/auth/login` usando el correo devuelto.
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenInvitacion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, password_confirmation]
              properties:
                password:
                  type: string
                  minLength: 10
                  description: Al menos 10 caracteres, con letras y números.
                password_confirmation: { type: string }
      responses:
        '200':
          description: Contraseña creada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [email]
                    properties:
                      email: { type: string, format: email }
                  message: { type: string }
        '404':
          $ref: '#/components/responses/InvitacionInvalida'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /ubicaciones:
    get:
      tags: [Catálogos]
      operationId: listarUbicaciones
      summary: Provincias, cantones y parroquias del Ecuador
      description: Árbol completo con códigos INEC (≈ 80 KB). Cualquier usuario con sesión; no lleva condominio.
      responses:
        '200':
          description: Árbol de la división territorial.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Provincia' }
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /plataforma/planes:
    get:
      tags: [Plataforma]
      operationId: listarPlanes
      summary: Planes activos de la plataforma
      x-permiso: plataforma.condominios
      responses:
        '200':
          description: Planes ordenados.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Plan' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'

  /plataforma/amenidades:
    get:
      tags: [Plataforma]
      operationId: listarCatalogoAmenidades
      summary: Amenidades activas del catálogo global
      x-permiso: plataforma.condominios
      responses:
        '200':
          description: Catálogo ordenado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AmenidadCatalogo' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'

  /plataforma/usuarios/buscar:
    get:
      tags: [Plataforma]
      operationId: buscarUsuarioPorCorreo
      summary: ¿El administrador ya tiene cuenta?
      description: Devuelve `data null` si no existe o el correo no es válido.
      x-permiso: plataforma.condominios
      parameters:
        - in: query
          name: email
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: Usuario encontrado o null.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - { $ref: '#/components/schemas/UsuarioEncontrado' }
                      - { type: 'null' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'

  /plataforma/condominios:
    get:
      tags: [Plataforma]
      operationId: listarCondominiosPlataforma
      summary: Condominios de la plataforma
      description: Paginado y ordenado por nombre. `buscar` filtra por nombre, código o inicio del RUC.
      x-permiso: plataforma.condominios
      parameters:
        - in: query
          name: buscar
          required: false
          schema: { type: string }
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: por_pagina
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Página de condominios.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CondominioPlataforma' }
                  meta:
                    type: object
                    properties:
                      pagination: { $ref: '#/components/schemas/Paginacion' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
    post:
      tags: [Plataforma]
      operationId: crearCondominio
      summary: Alta de condominio (asistente de 5 pasos)
      description: |
        Todo o nada: condominio (estado `prueba` por 30 días), configuración de cobro,
        amenidades y administrador. Si el correo del administrador ya tiene cuenta se
        asocia; si no, se crea inactivo y se le envía la invitación por correo.
        Errores de negocio: `CEDULA_EN_USO` (la cédula es de otra persona).
      x-permiso: plataforma.condominios
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoCondominio' }
      responses:
        '201':
          description: Condominio creado.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/CondominioPlataforma' }
                  meta:
                    type: object
                    required: [administrador_existente, invitacion_enviada]
                    properties:
                      administrador_existente: { type: boolean }
                      invitacion_enviada: { type: boolean }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '422':
          $ref: '#/components/responses/Validacion'

  /plataforma/condominios/{condominio}:
    get:
      tags: [Plataforma]
      operationId: verCondominioPlataforma
      summary: Detalle de un condominio
      x-permiso: plataforma.condominios
      parameters:
        - in: path
          name: condominio
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Condominio.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CondominioPlataforma' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoPlataforma'
        '404':
          $ref: '#/components/responses/NoEncontrado'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TokenInvitacion:
      in: path
      name: token
      required: true
      description: Token de 64 caracteres recibido por correo.
      schema: { type: string }
    UnidadId:
      name: unidad
      in: path
      required: true
      schema: { type: integer }
    CondominioId:
      in: header
      name: X-Condominio-Id
      required: true
      description: Condominio activo. El usuario debe tener membresía activa en él.
      schema: { type: integer, minimum: 1 }
    TipoCliente:
      in: header
      name: X-Client-Type
      required: false
      description: '`mobile` en las apps: el refresh token viaja en el cuerpo en lugar de la cookie.'
      schema: { type: string, enum: [mobile] }

  responses:
    SinPermiso:
      description: '`SIN_PERMISO`: no tiene el permiso de plataforma de la ruta.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoEncontrado:
      description: '`NO_ENCONTRADO`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvitacionInvalida:
      description: '`INVITACION_INVALIDA`: el token no existe, venció o ya se usó.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Token:
      description: |
        Par de tokens. En web, además, `Set-Cookie: safic_refresh=...; Path=/api/v1/auth; HttpOnly; SameSite=Strict`.
      headers:
        Set-Cookie:
          description: Solo en web.
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/RespuestaToken' }
    NoAutenticado:
      description: '`NO_AUTENTICADO`: falta el token, expiró o está en la lista negra.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CondominioRequerido:
      description: '`CONDOMINIO_REQUERIDO`: falta `X-Condominio-Id` o no es un número válido.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CondominioNoPermitido:
      description: '`CONDOMINIO_NO_PERMITIDO`: el usuario no tiene membresía activa en ese condominio.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SinPermisoOCondominio:
      description: '`SIN_PERMISO` (falta el permiso de la ruta) o `CONDOMINIO_NO_PERMITIDO`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SinPermisoPlataforma:
      description: '`SIN_PERMISO`: el usuario no tiene perfil de plataforma o le falta el permiso de la ruta.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LimiteUnidades:
      description: '`LIMITE_UNIDADES`: se alcanzó el total de unidades contratadas. `error.details` trae `total` y `registradas`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validacion:
      description: '`VALIDACION`: los errores por campo vienen en `error.fields`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DemasiadosIntentos:
      description: '`DEMASIADOS_INTENTOS`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Código estable en MAYÚSCULAS; el frontend decide por él.
              examples: [VALIDACION]
            message:
              type: string
              description: Mensaje en español de Ecuador, listo para mostrar.
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            details:
              type: object
              additionalProperties: true

    RespuestaVacia:
      type: object
      required: [data]
      properties:
        data: { type: 'null' }
        message: { type: string }

    Paginacion:
      description: Va en `meta.pagination` de las respuestas paginadas.
      type: object
      required: [page, per_page, total, last_page]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }

    RespuestaToken:
      type: object
      required: [access_token, token_type, expires_in, usuario]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in:
          type: integer
          description: Segundos de vida del access token (900).
          examples: [900]
        refresh_token:
          type: string
          description: 'Solo con `X-Client-Type: mobile`.'
        usuario: { $ref: '#/components/schemas/Usuario' }

    Usuario:
      type: object
      required: [id, nombre, email, plataforma]
      properties:
        id: { type: integer }
        nombre: { type: string }
        email: { type: string, format: email }
        condominios:
          type: array
          description: Solo condominios con membresía activa (los del selector).
          items: { $ref: '#/components/schemas/CondominioResumen' }
        plataforma:
          description: Perfil de plataforma (super admin, soporte, cobranza…) o null si no tiene.
          oneOf:
            - { $ref: '#/components/schemas/ContextoPlataforma' }
            - { type: 'null' }

    ContextoPlataforma:
      type: object
      description: Roles y permisos de plataforma (equipo 0). No sirven dentro de un condominio.
      required: [roles, permisos]
      properties:
        roles: { type: array, items: { type: string } }
        permisos: { type: array, items: { type: string } }

    CondominioResumen:
      type: object
      required: [id, codigo, nombre, es_principal, estado, marca]
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        es_principal: { type: boolean }
        estado:
          type: string
          enum: [activo, prueba, solo_lectura, suspendido]
        marca:
          oneOf:
            - { $ref: '#/components/schemas/MarcaCondominio' }
            - { type: 'null' }

    MarcaCondominio:
      type: object
      description: Apariencia del condominio. Los colores de estado no se personalizan.
      properties:
        logo_url: { type: [string, 'null'], format: uri }
        color_primario: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        color_acento: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }

    ContextoCondominio:
      type: object
      required: [condominio_id, roles, permisos]
      properties:
        condominio_id: { type: integer }
        roles:
          type: array
          items: { type: string }
        permisos:
          type: array
          description: Nombres del enum `Permiso`, ordenados.
          items: { type: string, examples: [unidades.ver] }

    TipoUnidad:
      type: string
      enum: [departamento, casa, local, parqueadero, bodega]

    Unidad:
      type: object
      required: [id, codigo, bloque, tipo, piso, area_m2, alicuota, cuota_mensual, valor_personalizado, responsable_pago, estado]
      properties:
        id: { type: integer }
        codigo: { type: string, examples: ['A-102'] }
        bloque:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, nombre]
              properties:
                id: { type: integer }
                nombre: { type: string }
        tipo: { $ref: '#/components/schemas/TipoUnidad' }
        piso: { type: [integer, 'null'] }
        area_m2: { type: string, pattern: '^\d+\.\d{2}$', examples: ['84.00'] }
        alicuota:
          type: [string, 'null']
          pattern: '^\d+\.\d{4}$'
          description: Porcentaje con 4 decimales (`0.6200` = 0,62 %).
        cuota_mensual:
          oneOf: [{ $ref: '#/components/schemas/Dinero' }, { type: 'null' }]
        valor_personalizado:
          oneOf: [{ $ref: '#/components/schemas/Dinero' }, { type: 'null' }]
        responsable_pago: { type: string, enum: [propietario, inquilino] }
        estado:
          type: string
          enum: [ocupada, arrendada, vacia]
          description: Se calcula con los ocupantes vigentes.

    GuardarUnidad:
      type: object
      description: En `POST`, `codigo`, `tipo` y `area_m2` son obligatorios; en `PATCH` todos son opcionales.
      properties:
        codigo: { type: string, maxLength: 20, examples: ['A-102'] }
        bloque_id: { type: [integer, 'null'] }
        tipo: { $ref: '#/components/schemas/TipoUnidad' }
        piso: { type: [integer, 'null'], minimum: -5, maximum: 200 }
        area_m2: { type: number, exclusiveMinimum: 0, examples: [84] }
        responsable_pago: { type: string, enum: [propietario, inquilino], default: propietario }
        alicuota: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 100, description: 'Obligatoria con método `alicuota`.' }
        cuota_mensual: { type: number, exclusiveMinimum: 0, description: 'Solo y obligatoria con método `unidad`.' }
        valor_personalizado: { type: [number, 'null'], exclusiveMinimum: 0, description: 'Solo con método `tipo` o `alicuota`.' }

    ResumenUnidades:
      type: object
      required: [registradas, total_contratadas, suma_alicuotas, metodo_cobro, cuota_general]
      properties:
        registradas: { type: integer, description: 'Departamentos, casas y locales registrados (parqueaderos y bodegas no cuentan).' }
        total_contratadas: { type: integer }
        suma_alicuotas: { type: string, examples: ['99.6200'], description: Debe llegar a 100. }
        metodo_cobro: { type: string, enum: [general, tipo, alicuota, unidad] }
        cuota_general:
          oneOf: [{ $ref: '#/components/schemas/Dinero' }, { type: 'null' }]
          description: 'Lo que paga cada unidad con método `general`; null con los demás métodos.'

    Bloque:
      type: object
      required: [id, nombre, orden]
      properties:
        id: { type: integer }
        nombre: { type: string }
        orden: { type: integer }

    ItemMenu:
      type: object
      description: Ítem del menú lateral. Las hojas tienen `ruta`; los módulos y secciones, `hijos`.
      required: [id, etiqueta, icono]
      properties:
        id: { type: string, description: 'Clave estable (ej. `unidades.bloques`).' }
        etiqueta: { type: string }
        icono: { type: string, description: 'Material Symbols Rounded (`sym_r_*`). Obligatorio.' }
        ruta: { type: string, description: Nombre de la ruta del frontend. Solo en hojas. }
        permiso: { type: string, description: Permiso de la pantalla. Solo en hojas que lo piden. }
        seccion: { type: boolean, description: 'Grupo siempre desplegado (CONFIGURACIÓN). Se omite si es falso.' }
        hijos:
          type: array
          items: { $ref: '#/components/schemas/ItemMenu' }

    Dinero:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      description: Monto en USD con 2 decimales como texto (decimal(12,2) en la base).
      examples: ['80.00']

    Invitacion:
      type: object
      required: [nombre, email, condominio, expira_en]
      properties:
        nombre: { type: string }
        email: { type: string, format: email }
        condominio: { type: string }
        expira_en: { type: string, format: date-time }

    Provincia:
      type: object
      required: [codigo, nombre, cantones]
      properties:
        codigo: { type: string, examples: ['17'] }
        nombre: { type: string }
        latitud: { type: [string, 'null'] }
        longitud: { type: [string, 'null'] }
        cantones:
          type: array
          items:
            type: object
            required: [codigo, nombre, parroquias]
            properties:
              codigo: { type: string, examples: ['1701'] }
              nombre: { type: string }
              latitud: { type: [string, 'null'] }
              longitud: { type: [string, 'null'] }
              parroquias:
                type: array
                items:
                  type: object
                  required: [codigo, nombre]
                  properties:
                    codigo: { type: string, examples: ['170156'] }
                    nombre: { type: string }

    Plan:
      type: object
      required: [codigo, nombre, limite_administrativos, valor_unidad_sugerido]
      properties:
        codigo: { type: string, enum: [basico, profesional, completo] }
        nombre: { type: string }
        limite_administrativos: { type: integer }
        valor_unidad_sugerido: { $ref: '#/components/schemas/Dinero' }

    AmenidadCatalogo:
      type: object
      required: [id, nombre, categoria, reservable, esencial, requiere_aprobacion]
      properties:
        id: { type: integer }
        nombre: { type: string }
        categoria: { type: string, enum: [recreacion, deporte, social, servicios, seguridad] }
        descripcion: { type: [string, 'null'] }
        reservable: { type: boolean }
        esencial: { type: boolean, description: Nunca se restringe por mora. }
        requiere_aprobacion: { type: boolean }

    UsuarioEncontrado:
      type: object
      required: [id, nombre, activo, condominios]
      properties:
        id: { type: integer }
        nombre: { type: string }
        activo: { type: boolean }
        condominios: { type: integer, description: Condominios donde ya es miembro. }

    CondominioPlataforma:
      type: object
      required: [id, codigo, nombre, tipo, estado, total_unidades, ubicacion, contacto, administradores, creado_en]
      properties:
        id: { type: integer }
        codigo: { type: string, examples: ['SF-0012'] }
        nombre: { type: string }
        tipo: { type: string, enum: [conjunto, edificio, urbanizacion, mixto] }
        ruc: { type: [string, 'null'] }
        razon_social: { type: [string, 'null'] }
        estado: { type: string, enum: [prueba, activo, solo_lectura, suspendido] }
        prueba_hasta: { type: [string, 'null'], format: date }
        total_unidades: { type: integer }
        valor_unidad:
          oneOf:
            - { $ref: '#/components/schemas/Dinero' }
            - { type: 'null' }
        mensualidad:
          description: total_unidades × valor_unidad, sin IVA.
          oneOf:
            - { $ref: '#/components/schemas/Dinero' }
            - { type: 'null' }
        plan:
          oneOf:
            - type: object
              required: [codigo, nombre]
              properties:
                codigo: { type: string }
                nombre: { type: string }
            - { type: 'null' }
        ubicacion:
          type: object
          properties:
            provincia: { type: [string, 'null'] }
            canton: { type: [string, 'null'] }
            parroquia: { type: [string, 'null'] }
            direccion: { type: [string, 'null'] }
            latitud: { type: [string, 'null'] }
            longitud: { type: [string, 'null'] }
        contacto:
          type: object
          properties:
            telefono: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
        administradores:
          type: array
          items:
            type: object
            required: [id, nombre, email, estado]
            properties:
              id: { type: integer }
              nombre: { type: string }
              email: { type: string }
              estado: { type: string, enum: [activo, invitado] }
        creado_en: { type: string, format: date-time }

    NuevoCondominio:
      type: object
      required: [nombre, tipo, ruc, razon_social, provincia_codigo, canton_codigo, parroquia_codigo, direccion, total_unidades, plan_codigo, valor_unidad, latitud, longitud, cobro, administrador]
      properties:
        nombre: { type: string, maxLength: 120 }
        tipo: { type: string, enum: [conjunto, edificio, urbanizacion, mixto] }
        ruc: { type: string, pattern: '^\d{13}$', description: RUC válido y único en la plataforma. }
        razon_social: { type: string, maxLength: 160 }
        provincia_codigo: { type: string, examples: ['17'] }
        canton_codigo: { type: string, description: Cantón de esa provincia. }
        parroquia_codigo: { type: string, description: Parroquia de ese cantón. }
        direccion: { type: string, maxLength: 200 }
        telefono: { type: [string, 'null'], pattern: '^0\d{8,9}$' }
        email_contacto: { type: [string, 'null'], format: email }
        total_unidades: { type: integer, minimum: 1, maximum: 10000, description: Límite de registro y base de la mensualidad. }
        plan_codigo: { type: string, enum: [basico, profesional, completo] }
        valor_unidad: { $ref: '#/components/schemas/Dinero' }
        latitud: { type: number, minimum: -5.1, maximum: 1.7 }
        longitud: { type: number, minimum: -92.1, maximum: -75.1 }
        cobro:
          type: object
          required: [metodo, dia_vencimiento, primera_cuota]
          properties:
            metodo: { type: string, enum: [general, tipo, alicuota, unidad] }
            cuota_general:
              description: Obligatoria con método general.
              oneOf:
                - { $ref: '#/components/schemas/Dinero' }
                - { type: 'null' }
            presupuesto_mensual:
              description: Obligatorio con método por alícuota.
              oneOf:
                - { $ref: '#/components/schemas/Dinero' }
                - { type: 'null' }
            valores_tipo:
              description: Obligatorio con método por tipo.
              type: [array, 'null']
              items:
                type: object
                required: [tipo, valor]
                properties:
                  tipo: { type: string, enum: [departamento, casa, local, parqueadero, bodega] }
                  valor: { $ref: '#/components/schemas/Dinero' }
            dia_vencimiento: { type: integer, minimum: 0, maximum: 28, description: 0 = último día del mes. }
            primera_cuota: { type: string, pattern: '^\d{4}-\d{2}$', description: Mes actual o futuro (AAAA-MM). }
        amenidades:
          type: [array, 'null']
          items:
            type: object
            required: [amenidad_id, cantidad]
            properties:
              amenidad_id: { type: integer }
              cantidad: { type: integer, minimum: 1, maximum: 999 }
        administrador:
          type: object
          required: [cedula, nombre, email]
          properties:
            cedula: { type: string, pattern: '^\d{10}$', description: Cédula ecuatoriana válida. }
            nombre: { type: string, maxLength: 120 }
            email: { type: string, format: email }
            celular: { type: [string, 'null'], pattern: '^09\d{8}$' }
