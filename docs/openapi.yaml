      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ruc, razon_social]
              properties:
                ruc: { type: string, pattern: '^\d{13}$' }
                razon_social: { type: string, minLength: 3, maxLength: 160 }
                categoria: { type: [string, 'null'], maxLength: 60 }
                email: { type: [string, 'null'], format: email }
                telefono: { type: [string, 'null'], maxLength: 30 }
      responses:
        '201':
          description: Proveedor agregado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Proveedor' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          description: '`PROVEEDOR_DUPLICADO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /proveedores/{proveedor}:
    patch:
      tags: [Finanzas]
      operationId: editarProveedor
      summary: Editar o desactivar un proveedor
      description: 'Permiso: `proveedores.editar`. Solo viaja lo que cambia. Desactivar (`activo: false`) lo quita de la lista; sus facturas se conservan.'
      x-permiso: proveedores.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: proveedor, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                razon_social: { type: string, minLength: 3, maxLength: 160 }
                categoria: { type: [string, 'null'], maxLength: 60 }
                email: { type: [string, 'null'], format: email }
                telefono: { type: [string, 'null'], maxLength: 30 }
                activo: { type: boolean }
      responses:
        '200':
          description: Proveedor actualizado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Proveedor' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'

  /proveedores/{proveedor}/cuenta-bancaria:
    post:
      tags: [Finanzas]
      operationId: cambiarCuentaProveedor
      summary: Pedir el cambio de la cuenta bancaria de un proveedor
      description: |
        Permiso: `proveedores.editar`. Exige la contraseña de quien lo pide (422 en `password`), avisa por correo a
        administración y tesorería y se activa a las 24 horas; mientras tanto se paga a la cuenta vigente. La primera
        cuenta de un proveedor queda vigente al instante. Solo un cambio en espera a la vez (409 `CAMBIO_EN_ESPERA`).
        Límite de peticiones compartido con los pagos (429).
      x-permiso: proveedores.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: proveedor, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [banco, tipo, numero, titular, password]
              properties:
                banco: { type: string, minLength: 2, maxLength: 60 }
                tipo: { type: string, enum: [corriente, ahorros] }
                numero: { type: string, pattern: '^[0-9\-]{6,30}$' }
                titular: { type: string, minLength: 3, maxLength: 120 }
                password: { type: string, format: password }
      responses:
        '201':
          description: Cambio solicitado (o cuenta vigente si era la primera).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Proveedor' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`CAMBIO_EN_ESPERA`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /proveedores/{proveedor}/cuenta-bancaria/pendiente:
    delete:
      tags: [Finanzas]
      operationId: detenerCambioCuentaProveedor
      summary: Detener un cambio de cuenta que aún no se activó
      description: 'Permiso: `proveedores.editar`. La cuenta vigente sigue igual. 404 `SIN_CAMBIO_EN_ESPERA` si no hay cambio.'
      x-permiso: proveedores.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: proveedor, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Cambio detenido.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Proveedor' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /gastos:
    get:
      tags: [Finanzas]
      operationId: listarGastos
      summary: Cuentas por pagar (facturas de proveedores)
      description: |
        Permiso: `finanzas.ver`. De la que vence antes a la más reciente. `meta.resumen` suma lo por aprobar, lo por
        pagar (aprobadas con saldo) y lo vencido; `meta.conteos` cuenta cada filtro.
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: filtro, in: query, schema: { type: string, enum: [todas, por_aprobar, por_pagar, pagadas, rechazadas] } }
        - { name: buscar, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        '200':
          description: Facturas.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Gasto' } }
                  meta:
                    type: object
                    properties:
                      resumen: { type: object, additionalProperties: true }
                      conteos: { type: object, additionalProperties: { type: integer } }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'
    post:
      tags: [Finanzas]
      operationId: registrarGasto
      summary: Registrar una factura a mano
      description: |
        Permiso: `gastos.registrar`. IVA del 15 % sobre el subtotal si `con_iva`, redondeado al centavo. Nace
        `por_aprobar`. Sin `vence_el` vence a los 30 días de la emisión. 409 `FACTURA_DUPLICADA`, 422 `FECHA_FUTURA`.
      x-permiso: gastos.registrar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [proveedor_id, numero, fecha_emision, subtotal, con_iva]
              properties:
                proveedor_id: { type: integer }
                numero: { type: string, pattern: '^\d{3}-\d{3}-\d{9}$' }
                fecha_emision: { type: string, format: date }
                vence_el: { type: [string, 'null'], format: date }
                subtotal: { type: string, examples: ['2400.33'] }
                con_iva: { type: boolean }
                categoria: { type: [string, 'null'] }
                descripcion: { type: [string, 'null'] }
                pdf: { type: string, format: binary, description: PDF de hasta 5 MB. }
          application/json:
            schema:
              type: object
              required: [proveedor_id, numero, fecha_emision, subtotal, con_iva]
              properties:
                proveedor_id: { type: integer }
                numero: { type: string }
                fecha_emision: { type: string, format: date }
                vence_el: { type: [string, 'null'], format: date }
                subtotal: { type: string }
                con_iva: { type: boolean }
                categoria: { type: [string, 'null'] }
                descripcion: { type: [string, 'null'] }
      responses:
        '201':
          description: Factura registrada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Gasto' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          description: '`FACTURA_DUPLICADA`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /gastos/importar-xml:
    post:
      tags: [Finanzas]
      operationId: importarFacturaXml
      summary: Registrar una factura desde su XML del SRI
      description: |
        Permiso: `gastos.registrar`. Lee el XML (con o sin el envoltorio de autorización), valida estructura, RUC,
        clave de acceso (dígito verificador) y totales; no consulta al SRI. Crea el proveedor por RUC si no existe.
        422 `XML_INVALIDO`, 409 `FACTURA_DUPLICADA`.
      x-permiso: gastos.registrar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [xml]
              properties:
                xml: { type: string, format: binary, description: XML de hasta 1 MB. }
                pdf: { type: string, format: binary, description: PDF de hasta 5 MB. }
                vence_el: { type: [string, 'null'], format: date }
                categoria: { type: [string, 'null'] }
      responses:
        '201':
          description: Factura registrada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Gasto' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          description: '`FACTURA_DUPLICADA`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /gastos/{gasto}:
    get:
      tags: [Finanzas]
      operationId: verGasto
      summary: Una factura con su historial de aprobación
      description: 'Permiso: `finanzas.ver`. Quién la registró y cada aprobación o rechazo (nivel, quién, comentario, si fue en subrogación).'
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: gasto, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Factura.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GastoDetalle' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /gastos/{gasto}/aprobar:
    post:
      tags: [Finanzas]
      operationId: aprobarGasto
      summary: Aprobar una factura (nivel 1 o 2)
      description: |
        Permiso: `gastos.aprobar-n1` o `gastos.aprobar-n2` (la ruta acepta cualquiera; el nivel que toca lo decide el caso de uso).
        El 1.er nivel lo da la administración; si el total supera el umbral del condominio (por defecto $ 500,00) falta un 2.º
        nivel de presidente o vicepresidente (este queda marcado `en_subrogacion`). Quien registró la factura no la aprueba
        (403 `REGISTRO_PROPIO`) y la misma persona no da los dos niveles (403 `MISMA_PERSONA`). 403 `NIVEL_NO_PERMITIDO`,
        409 `GASTO_NO_PENDIENTE`.
      x-permiso: gastos.aprobar-n1|gastos.aprobar-n2
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: gasto, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comentario: { type: [string, 'null'], maxLength: 300 }
      responses:
        '200':
          description: Aprobación registrada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GastoDetalle' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`GASTO_NO_PENDIENTE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /gastos/{gasto}/rechazar:
    post:
      tags: [Finanzas]
      operationId: rechazarGasto
      summary: Rechazar una factura
      description: 'Permiso: `gastos.aprobar-n1` o `gastos.aprobar-n2`, según el nivel que toca. Exige motivo y cierra la factura. Mismas reglas que aprobar.'
      x-permiso: gastos.aprobar-n1|gastos.aprobar-n2
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: gasto, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200':
          description: Factura rechazada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GastoDetalle' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`GASTO_NO_PENDIENTE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /pagos-proveedor:
    get:
      tags: [Finanzas]
      operationId: listarPagosProveedor
      summary: Pagos hechos a proveedores
      description: 'Permiso: `finanzas.ver`. Del más reciente al más antiguo (hasta 200), con las facturas que cubrió cada uno.'
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: proveedor_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Pagos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PagoProveedor' } }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
    post:
      tags: [Finanzas]
      operationId: registrarPagoProveedor
      summary: Registrar un pago a un proveedor
      description: |
        Permiso: `gastos.pagar`. Registra la transferencia hecha desde la banca en línea. Solo facturas aprobadas del proveedor;
        se permiten abonos (se aplican a la factura más antigua primero). Se paga a la cuenta vigente del proveedor
        (409 `SIN_CUENTA_PROVEEDOR`). 422 `MONTO_SUPERA_SALDO`, `FECHA_FUTURA`; 409 `FACTURA_NO_APROBADA`, `REFERENCIA_DUPLICADA`;
        403 `APROBADOR_NO_PAGA` (quien aprobó una de las facturas no la paga, salvo configuración del condominio).
      x-permiso: gastos.pagar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [proveedor_id, facturas, monto, cuenta_bancaria_id, fecha_pago, referencia]
              properties:
                proveedor_id: { type: integer }
                facturas: { type: array, items: { type: integer }, minItems: 1, maxItems: 50 }
                monto: { type: string, examples: ['800.00'] }
                cuenta_bancaria_id: { type: integer, description: Cuenta del condominio desde la que se pagó. }
                fecha_pago: { type: string, format: date }
                referencia: { type: string, minLength: 3, maxLength: 40 }
                comprobante: { type: string, format: binary, description: Foto o PDF de hasta 5 MB. }
          application/json:
            schema:
              type: object
              required: [proveedor_id, facturas, monto, cuenta_bancaria_id, fecha_pago, referencia]
              properties:
                proveedor_id: { type: integer }
                facturas: { type: array, items: { type: integer } }
                monto: { type: string }
                cuenta_bancaria_id: { type: integer }
                fecha_pago: { type: string, format: date }
                referencia: { type: string }
      responses:
        '201':
          description: Pago registrado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PagoProveedor' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`SIN_CUENTA_PROVEEDOR`, `FACTURA_NO_APROBADA` o `REFERENCIA_DUPLICADA`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /pagos-proveedor/{pago}/anular:
    post:
      tags: [Finanzas]
      operationId: anularPagoProveedor
      summary: Anular un pago a proveedor
      description: 'Permiso: `gastos.pagar`. Exige motivo, devuelve el saldo a las facturas (una pagada vuelve a aprobada) y deja constancia de quién y cuándo. 409 `PAGO_YA_ANULADO`.'
      x-permiso: gastos.pagar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: pago, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200':
          description: Pago anulado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PagoProveedor' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`PAGO_YA_ANULADO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /finanzas/configuracion:
    get:
      tags: [Finanzas]
      operationId: verConfiguracionFinanzas
      summary: Reglas de dinero del condominio
      description: 'Permiso: `condominio.editar`. Umbral de la segunda aprobación de facturas, si quien aprobó una factura puede pagarla y tolerancia bancaria. Sin configuración devuelve los valores por defecto ($ 500,00, no, $ 0,50).'
      x-permiso: condominio.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Reglas vigentes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ConfiguracionFinanzas' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
