openapi: 3.1.0
info:
  title: SAFIC API
  version: 0.1.0
  summary: Sistema de Administración Financiera de Condominios
  license:
    name: Propietario
    identifier: LicenseRef-SAFIC
  description: |
    API de SAFIC (`/api/v1`). Contrato vivo: toda ruta nueva se documenta aquí en el
    mismo pull request. La prueba `tests/Feature/Contrato/ContratoOpenApiTest.php`
    falla si una ruta de `routes/api.php` no está en este archivo o al revés.

    **Formato común**
    - Éxito: `{ "data": ..., "meta"?: {...}, "message"?: "..." }`
    - Error: `{ "error": { "code": "CODIGO_ESTABLE", "message": "...", "fields"?: {...}, "details"?: {...} } }`

    **Autenticación.** Access token JWT RS256 de 15 min en `Authorization: Bearer`.
    El refresh token rota en cada uso y dura 30 días: en web viaja en la cookie
    HttpOnly `safic_refresh` (ruta `/api/v1/auth`, SameSite=Strict); las apps
    móviles envían `X-Client-Type: mobile` y lo reciben y devuelven en el cuerpo.
    El JWT no lleva roles ni condominio.

    **Condominio.** Las rutas de negocio exigen `X-Condominio-Id` con un condominio
    en el que el usuario tenga membresía activa, y cada una su permiso.

    **Límites.** login: por correo e IP · refresh: 30/min por IP · negocio: 120/min por usuario.
servers:
  - url: http://localhost:8000/api/v1
    description: Local (Docker Compose)

tags:
  - name: Autenticación
    description: Login, renovación del token y cierre de sesión.
  - name: Sesión
    description: Usuario actual y su contexto (roles y permisos) en un condominio.
  - name: Unidades
    description: Bloques, unidades y residentes del condominio.
  - name: Usuarios
    description: Equipo del condominio (administradores, contador, guardia, mantenimiento) y cupo del plan.
  - name: Amenidades
    description: Amenidades del condominio (del catálogo o propias).
  - name: Finanzas
    description: Cobro de cuotas del condominio.
  - name: Reservas
    description: 'Áreas comunes: reglas de uso, reservas, agenda y bloqueos.'
  - name: Catálogos
    description: Datos compartidos que no dependen del condominio.
  - name: Plataforma
    description: |
      Panel del super admin (`/plataforma/*`). Solo perfiles de plataforma (equipo 0);
      cada ruta exige su permiso de plataforma. No usa `X-Condominio-Id`.

security:
  - bearer: []

paths:
  /auth/login:
    post:
      tags: [Autenticación]
      operationId: login
      summary: Iniciar sesión
      security: []
      parameters:
        - $ref: '#/components/parameters/TipoCliente'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, maxLength: 255 }
      description: |
        Si la cuenta tiene la verificación en dos pasos activa, **no** entrega sesión: responde `requiere_2fa: true` con un
        `desafio` (válido 5 minutos) que se canjea con el código en `POST /auth/2fa/verificar`.
      responses:
        '200':
          description: Par de tokens, o el desafío del segundo paso si la cuenta tiene verificación en dos pasos.
          headers:
            Set-Cookie:
              description: Solo en web y solo cuando entrega sesión.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - { $ref: '#/components/schemas/RespuestaToken' }
                      - { $ref: '#/components/schemas/DesafioDobleFactor' }
        '401':
          description: '`CREDENCIALES_INVALIDAS` (también si el usuario está inactivo).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /auth/2fa/verificar:
    post:
      tags: [Autenticación]
      operationId: verificarDobleFactor
      summary: Segundo paso del login
      description: |
        Canjea el `desafio` de `POST /auth/login` con el código de 6 dígitos de la app autenticadora o con un código de
        respaldo (de un solo uso). Un código TOTP no sirve dos veces. A los 5 intentos fallidos el desafío muere y hay que
        iniciar sesión otra vez. 401: `CODIGO_INVALIDO`, `DESAFIO_INVALIDO` (vencido, agotado o inexistente).
      security: []
      parameters:
        - $ref: '#/components/parameters/TipoCliente'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [desafio, codigo]
              properties:
                desafio: { type: string, minLength: 64, maxLength: 64 }
                codigo: { type: string, maxLength: 20, examples: ['123456', 'ABCDE-FGHJK'] }
      responses:
        '200':
          $ref: '#/components/responses/Token'
        '401':
          description: '`CODIGO_INVALIDO` o `DESAFIO_INVALIDO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /auth/2fa/preparar:
    post:
      tags: [Autenticación]
      operationId: prepararDobleFactor
      summary: Empezar a activar la verificación en dos pasos
      description: |
        Pide la contraseña. Genera un secreto nuevo (sin activar todavía; pedirlo otra vez reemplaza el anterior) y la
        dirección `otpauth://` que se muestra como QR. 409 `DOBLE_FACTOR_YA_ACTIVO`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Secreto y dirección para el QR.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [secreto, uri]
                    properties:
                      secreto: { type: string, description: 'Base32, para escribirlo a mano si no se puede escanear.' }
                      uri: { type: string, description: 'otpauth://totp/... para el QR.' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '409':
          description: '`DOBLE_FACTOR_YA_ACTIVO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /auth/2fa/confirmar:
    post:
      tags: [Autenticación]
      operationId: confirmarDobleFactor
      summary: Activar la verificación con un código de la app
      description: |
        Con un código válido del secreto preparado queda activa y devuelve **8 códigos de respaldo, que solo se ven esta
        vez** (no se pueden recuperar). 409 `DOBLE_FACTOR_SIN_PREPARAR` o `DOBLE_FACTOR_YA_ACTIVO`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo: { type: string, maxLength: 20 }
      responses:
        '200':
          description: Activada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CodigosRespaldo' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '409':
          description: '`DOBLE_FACTOR_SIN_PREPARAR` o `DOBLE_FACTOR_YA_ACTIVO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /auth/2fa/codigos:
    post:
      tags: [Autenticación]
      operationId: regenerarCodigosRespaldo
      summary: Generar códigos de respaldo nuevos
      description: Pide la contraseña y un código vigente. Los códigos anteriores dejan de servir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, codigo]
              properties:
                password: { type: string, maxLength: 255 }
                codigo: { type: string, maxLength: 20 }
      responses:
        '200':
          description: Códigos nuevos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CodigosRespaldo' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/Validacion'

  /auth/2fa/desactivar:
    post:
      tags: [Autenticación]
      operationId: desactivarDobleFactor
      summary: Desactivar la verificación en dos pasos
      description: |
        Pide la contraseña y un código vigente. Quien es **contador** en algún condominio no puede desactivarla
        (403 `DOBLE_FACTOR_OBLIGATORIO`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, codigo]
              properties:
                password: { type: string, maxLength: 255 }
                codigo: { type: string, maxLength: 20 }
      responses:
        '200':
          description: Desactivada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: '`DOBLE_FACTOR_OBLIGATORIO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /auth/refresh:
    post:
      tags: [Autenticación]
      operationId: refrescarToken
      summary: Renovar el access token
      description: |
        Usa la cookie `safic_refresh` (web) o `refresh_token` en el cuerpo (móvil) y
        entrega un par nuevo. Presentar un refresh ya usado revoca toda la familia
        de tokens (`REFRESH_REUTILIZADO`).
      security: []
      parameters:
        - $ref: '#/components/parameters/TipoCliente'
        - in: cookie
          name: safic_refresh
          required: false
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: 'Solo apps móviles (`X-Client-Type: mobile`).'
      responses:
        '200':
          $ref: '#/components/responses/Token'
        '401':
          description: '`REFRESH_INVALIDO` o `REFRESH_REUTILIZADO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /auth/logout:
    post:
      tags: [Autenticación]
      operationId: logout
      summary: Cerrar sesión
      description: |
        Revoca la familia del refresh token, envía el access token a la lista negra
        hasta que expire y borra la cookie.
      parameters:
        - $ref: '#/components/parameters/TipoCliente'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Solo apps móviles.
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaVacia' }
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /auth/me:
    get:
      tags: [Sesión]
      operationId: usuarioActual
      summary: Usuario actual y sus condominios
      responses:
        '200':
          description: Usuario con los condominios donde tiene membresía activa.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Usuario' }
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /me/contexto:
    get:
      tags: [Sesión]
      operationId: contextoCondominio
      summary: Roles y permisos en el condominio activo
      description: El frontend arma el menú y oculta botones con esto; la API igual exige cada permiso.
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Contexto del usuario en el condominio.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ContextoCondominio' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CondominioNoPermitido'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /me/menu:
    get:
      tags: [Sesión]
      operationId: menuCondominio
      summary: Menú del perfil en el condominio activo
      description: |
        Una hoja aparece si está asignada a uno de los perfiles (roles) del usuario en el
        condominio del header **y** el usuario tiene su permiso. Los módulos y secciones
        aparecen solo si les queda alguna hoja. Ocultar no es seguridad: cada ruta exige su permiso.
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Menú en el mismo formato que `ItemMenu` del frontend.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ItemMenu' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CondominioNoPermitido'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /usuarios:
    get:
      tags: [Usuarios]
      operationId: listarUsuarios
      summary: Equipo del condominio y cupo del plan
      description: |
        Permiso: `usuarios.gestionar`. Las personas con acceso al condominio, su perfil y si consumen cupo.
        `meta.cupo` trae el plan y cuántos usuarios administrativos usa (administrador, contador y tesorero
        cuentan; presidente, vicepresidente, secretario, guardia, mantenimiento y residentes no).
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Equipo ordenado por nombre.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UsuarioCondominio' }
                  meta:
                    type: object
                    required: [cupo]
                    properties:
                      cupo: { $ref: '#/components/schemas/CupoUsuarios' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    post:
      tags: [Usuarios]
      operationId: invitarUsuario
      summary: Sumar a una persona al equipo
      description: |
        Permiso: `usuarios.gestionar`. Perfiles: administrador, contador (con `acceso_hasta` obligatorio), guardia o
        mantenimiento; los cargos de la directiva se asignan aparte. Si el correo no tiene cuenta se crea inactiva y
        recibe la invitación para crear su contraseña; si ya tiene cuenta se suma sin invitación
        (`invitacion_enviada: false`). 409 `LIMITE_USUARIOS` si el perfil consume cupo y el plan no tiene lugar,
        409 `USUARIO_YA_EXISTE` si ya está en el equipo, 422 `CEDULA_EN_USO` si la cédula es de otra persona.
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitarUsuario' }
      responses:
        '201':
          description: Persona agregada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/UsuarioCondominio' }
                      - type: object
                        required: [invitacion_enviada]
                        properties:
                          invitacion_enviada: { type: boolean }
                  message: { type: string, examples: ['Invitación enviada.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          $ref: '#/components/responses/ConflictoUsuarios'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /usuarios/{usuario}:
    patch:
      tags: [Usuarios]
      operationId: actualizarUsuario
      summary: Cambiar el perfil, la vigencia o desactivar a una persona del equipo
      description: |
        Permiso: `usuarios.gestionar`. Solo viaja lo que cambia. Cambiar el perfil no quita los cargos de directiva.
        409: `USUARIO_PROPIO` (nadie cambia su propio acceso), `ULTIMO_ADMINISTRADOR` (el condominio no se queda
        sin administrador) y `LIMITE_USUARIOS` (pasar a un perfil que consume cupo o reactivar sin lugar en el plan).
        Una persona de otro condominio responde 404.
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizarUsuario' }
      responses:
        '200':
          description: Cambios guardados.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UsuarioCondominio' }
                  message: { type: string, examples: ['Cambios guardados.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoUsuarios'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /usuarios/{usuario}/doble-factor/restablecer:
    post:
      tags: [Usuarios]
      operationId: restablecerDobleFactorUsuario
      summary: Restablecer la verificación en dos pasos de alguien del equipo
      description: |
        Permiso: `usuarios.gestionar`. Para quien perdió su teléfono y sus códigos de respaldo. Queda sin verificación; si es
        contador, deberá configurarla de nuevo para volver a trabajar. Exige el motivo (queda en el registro de seguridad).
        No sirve para la propia cuenta (422 `RESTABLECIMIENTO_PROPIO`) ni para otro administrador (403 `SOLO_PLATAFORMA`: lo
        hace la plataforma). 409 `DOBLE_FACTOR_NO_ACTIVO`. Alguien de otro condominio responde 404.
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '200':
          description: Restablecida; devuelve al usuario del equipo actualizado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UsuarioCondominio' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`DOBLE_FACTOR_NO_ACTIVO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /usuarios/{usuario}/invitacion:
    post:
      tags: [Usuarios]
      operationId: reenviarInvitacionUsuario
      summary: Reenviar la invitación a quien aún no creó su contraseña
      description: 'Permiso: `usuarios.gestionar`. Anula el enlace anterior y envía uno nuevo. 409 `USUARIO_ACTIVO` si ya tiene contraseña.'
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Invitación reenviada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UsuarioCondominio' }
                  message: { type: string, examples: ['Invitación reenviada.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoUsuarios'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /directiva:
    get:
      tags: [Usuarios]
      operationId: verDirectiva
      summary: Los cuatro cargos de la directiva y quién los ocupa
      description: |
        Permiso: `usuarios.gestionar`. Presidente, vicepresidente, secretario y tesorero, en ese orden. `estado`:
        `vigente`, `prorrogado` (venció el periodo y sigue hasta nombrar reemplazo) o `vacante`.
        `titular.sigue_siendo_propietario: false` avisa que vendió su unidad y ya no cumple el requisito.
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Cargos de la directiva.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CargoDirectiva' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /directiva/{cargo}/candidatos:
    get:
      tags: [Usuarios]
      operationId: candidatosDirectiva
      summary: Quién puede ocupar un cargo
      description: |
        Permiso: `usuarios.gestionar`. Los propietarios vigentes. Quien ya ocupa otro cargo (`ocupa_cargo`) o no tiene
        correo (`sin_correo`) aparece como no disponible. El titular actual del cargo no aparece.
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - $ref: '#/components/parameters/CargoDirectivaParametro'
      responses:
        '200':
          description: Candidatos ordenados por nombre.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CandidatoDirectiva' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /directiva/{cargo}:
    post:
      tags: [Usuarios]
      operationId: asignarCargoDirectiva
      summary: Nombrar a una persona en un cargo (o cambiar al titular)
      description: |
        Permiso: `usuarios.gestionar`. Un cargo lo ocupa una sola persona y una persona ocupa un solo cargo. Si el cargo
        tenía titular, su periodo se cierra hoy y pierde ese cargo (conserva sus demás perfiles). La persona debe ser
        propietaria y tener correo; si no tiene cuenta se crea y recibe la invitación. El tesorero consume cupo del plan.
        422: `NO_ES_PROPIETARIO`, `PERSONA_SIN_CORREO`, `CEDULA_EN_USO`. 409: `PERSONA_CON_CARGO`, `YA_ES_TITULAR`,
        `LIMITE_USUARIOS`.
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - $ref: '#/components/parameters/CargoDirectivaParametro'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AsignarCargo' }
      responses:
        '200':
          description: Cargo asignado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CargoDirectiva' }
                  message: { type: string, examples: ['Cargo asignado.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoUsuarios'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /amenidades:
    get:
      tags: [Amenidades]
      operationId: listarAmenidadesCondominio
      summary: Amenidades del condominio
      description: |
        Permiso: `amenidades.gestionar`. Todas, ordenadas por nombre, con su estado: `disponible`,
        `mantenimiento` (hasta `mantenimiento_hasta`; al pasar la fecha termina solo) o `inactiva`.
        `tipo` es el tipo del catálogo ("Área BBQ") o null si es propia del condominio.
      x-permiso: amenidades.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Amenidades del condominio.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AmenidadCondominio' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
    post:
      tags: [Amenidades]
      operationId: agregarAmenidades
      summary: Agregar amenidades del catálogo o propias
      description: |
        Permiso: `amenidades.gestionar`. Una amenidad reservable con varias unidades se crea como registros
        separados ("Área BBQ 1", "Área BBQ 2", y la numeración sigue donde iba); una que no se reserva es un solo
        registro con su cantidad ("Ascensor (3)"). Una propia no puede llamarse como una del catálogo (422 en
        `nombre`). 422 `AMENIDAD_EXISTE` si algún nombre ya existe en el condominio. Responde las creadas.
      x-permiso: amenidades.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgregarAmenidad' }
      responses:
        '201':
          description: Amenidades creadas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AmenidadCondominio' }
                  message: { type: string, examples: ['Amenidad agregada.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /amenidades/catalogo:
    get:
      tags: [Amenidades]
      operationId: catalogoParaAmenidades
      summary: Tipos del catálogo para elegir
      description: 'Permiso: `amenidades.gestionar`. Los tipos activos del catálogo global (el mismo que usa el asistente de alta).'
      x-permiso: amenidades.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Catálogo ordenado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AmenidadCatalogo' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /amenidades/{amenidad}/fotos:
    post:
      tags: [Amenidades]
      operationId: subirFotoAmenidad
      summary: Agregar una foto a una amenidad
      description: |
        Permiso: `amenidades.gestionar`. JPG o PNG de hasta 5 MB y entre 200 y 8000 píxeles por lado (sin SVG). Va al final:
        la primera es la portada. Hasta 5 por amenidad (422 `LIMITE_FOTOS`). El archivo queda en el bucket privado del
        condominio; la respuesta es la amenidad con sus fotos y enlaces temporales de lectura (10 minutos).
      x-permiso: amenidades.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: amenidad, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [foto]
              properties:
                foto: { type: string, format: binary }
      responses:
        '201':
          description: Foto agregada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AmenidadCondominio' }
                  message: { type: string, examples: ['Foto agregada.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          description: Archivo no válido o `LIMITE_FOTOS`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /amenidades/{amenidad}/fotos/orden:
    put:
      tags: [Amenidades]
      operationId: ordenarFotosAmenidad
      summary: Cambiar el orden de las fotos
      description: |
        Permiso: `amenidades.gestionar`. Se manda la lista completa de ids en el orden nuevo (la primera es la portada).
        Si falta o sobra alguna, 409 `FOTOS_DESACTUALIZADAS`: nunca se pierde una foto por una lista vieja.
      x-permiso: amenidades.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: amenidad, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 5, items: { type: integer } }
      responses:
        '200':
          description: Orden actualizado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AmenidadCondominio' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`FOTOS_DESACTUALIZADAS`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /amenidades/{amenidad}/fotos/{foto}:
    delete:
      tags: [Amenidades]
      operationId: quitarFotoAmenidad
      summary: Quitar una foto
      description: 'Permiso: `amenidades.gestionar`. Borra el archivo del bucket y vuelve a numerar las demás (si era la portada, la siguiente lo es). Una foto de otra amenidad o de otro condominio responde 404.'
      x-permiso: amenidades.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: amenidad, in: path, required: true, schema: { type: integer } }
        - { name: foto, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Foto eliminada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AmenidadCondominio' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /amenidades/{amenidad}:
    patch:
      tags: [Amenidades]
      operationId: actualizarAmenidad
      summary: Cambiar ubicación, mantenimiento o estado
      description: |
        Permiso: `amenidades.gestionar`. Solo viaja lo que cambia. `mantenimiento_hasta` pone la amenidad en
        mantenimiento hasta esa fecha (no puede ser pasada); null la saca. `activa: false` la desactiva.
        Una amenidad de otro condominio responde 404.
      x-permiso: amenidades.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - name: amenidad
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizarAmenidad' }
      responses:
        '200':
          description: Cambios guardados.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AmenidadCondominio' }
                  message: { type: string, examples: ['Cambios guardados.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /roles:
    get:
      tags: [Usuarios]
      operationId: listarRolesCondominio
      summary: Roles que el condominio puede asignar, con sus permisos y menú
      description: |
        Permiso: `usuarios.gestionar`. Solo lectura: los roles los define la plataforma. Orden: roles de sistema,
        cargos de directiva y adicionales creados por la plataforma. Por rol: qué permisos tiene, cuántas personas lo
        tienen en este condominio, si consume cupo del plan y las pantallas del menú que vería. No incluye roles ni
        permisos de plataforma.
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Roles, catálogo de permisos y cupo del plan.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RolesCondominio' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /roles/solicitudes:
    post:
      tags: [Usuarios]
      operationId: solicitarRol
      summary: Pedir un rol nuevo a la plataforma
      description: |
        Permiso: `usuarios.gestionar`. Queda registrada (estado `pendiente`) y, si la plataforma configuró un correo de
        soporte, se le avisa. Máximo 5 solicitudes por hora y por persona (429 después).
      x-permiso: usuarios.gestionar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitarRol' }
      responses:
        '201':
          description: Solicitud registrada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, nombre, estado]
                    properties:
                      id: { type: integer }
                      nombre: { type: string }
                      estado: { type: string, enum: [pendiente] }
                  message: { type: string, examples: ['Solicitud enviada a la plataforma.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /finanzas/periodos:
    get:
      tags: [Finanzas]
      operationId: listarPeriodos
      summary: Meses emitidos del condominio
      description: 'Permiso: `finanzas.ver`. Del más reciente al más antiguo, con lo esperado y lo recaudado de cada mes.'
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Meses emitidos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PeriodoFinanciero' } }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
    post:
      tags: [Finanzas]
      operationId: emitirPeriodo
      summary: Emitir las cuotas ordinarias de un mes
      description: |
        Permiso: `cuotas.emitir`. Cada unidad con cuota mensual recibe una cuota por ese valor, con el vencimiento del
        cobro (día 1–28, o el último día si es 0). Emitir otra vez el mismo mes solo agrega las unidades que faltaban:
        no duplica ni cambia lo emitido. 409: `COBRO_SIN_CONFIGURAR`, `PERIODO_ANTERIOR_AL_COBRO` (antes de `aplica_desde`),
        `PERIODO_FUTURO` (solo el mes en curso o anteriores), `PERIODO_CERRADO`, `SIN_UNIDADES_A_COBRAR`.
      x-permiso: cuotas.emitir
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodo]
              properties:
                periodo: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$', examples: ['2026-09'] }
      responses:
        '201':
          description: Cuotas emitidas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/EmisionPeriodo' }
                  message: { type: string, examples: ['Cuotas emitidas.'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          description: Código de error en `error.code` (ver la descripción).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: El mes no es válido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /finanzas/resumen:
    get:
      tags: [Finanzas]
      operationId: resumenFinanciero
      summary: Resumen financiero de un mes
      description: |
        Permiso: `finanzas.ver`. Lo esperado y lo recaudado son del mes pedido (sin `periodo`, el mes en curso). La cartera
        vencida y su antigüedad son de todas las cuotas con saldo, contadas a hoy en la hora del condominio. Los gastos,
        la conciliación y los pagos recientes llegan con sus propios módulos.
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: periodo, in: query, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }
      responses:
        '200':
          description: Resumen del mes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ResumenFinanciero' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          description: El mes no es válido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /cuentas-bancarias:
    get:
      tags: [Finanzas]
      operationId: listarCuentasBancarias
      summary: Cuentas bancarias del condominio
      description: 'Permiso: `condominio.editar` o `gastos.pagar` (quien paga a proveedores elige de qué cuenta sale la transferencia). Adonde los residentes transfieren; la principal activa es la que ellos ven. Las activas primero.'
      x-permiso: condominio.editar|gastos.pagar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Cuentas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CuentaBancaria' } }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
    post:
      tags: [Finanzas]
      operationId: crearCuentaBancaria
      summary: Agregar una cuenta bancaria
      description: 'Permiso: `condominio.editar`. La primera cuenta activa nace principal; marcar otra la reemplaza. El número va cifrado.'
      x-permiso: condominio.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarCuentaBancaria' }
      responses:
        '201':
          description: Cuenta agregada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CuentaBancaria' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'

  /cuentas-bancarias/{cuenta}:
    patch:
      tags: [Finanzas]
      operationId: editarCuentaBancaria
      summary: Editar, activar o desactivar una cuenta bancaria
      description: |
        Permiso: `condominio.editar`. Solo viaja lo que cambia. No se borran: se desactivan (`activa: false`). Si se desactiva
        la principal, pasa a otra activa. Para quitar la principal hay que marcar otra (422 `CUENTA_PRINCIPAL`).
      x-permiso: condominio.editar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: cuenta, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarCuentaBancaria' }
      responses:
        '200':
          description: Cuenta actualizada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CuentaBancaria' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'

  /mi-cuenta:
    get:
      tags: [Finanzas]
      operationId: miCuenta
      summary: Mi cuenta (residente)
      description: |
        Permiso: `cuenta.propia`. Por cada unidad que ocupa la persona de la cuenta: cuotas con saldo (`pendiente`,
        `vencida` o `en_revision` si ya van en un pago que espera aprobación), total pendiente, saldo a favor, sus últimos
        pagos y la cuenta bancaria principal. `concepto_transferencia` es lo que escribe en la transferencia.
        `puede_pagar` es verdadero si su relación es la que la unidad marca como responsable de pago.
      x-permiso: cuenta.propia
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      responses:
        '200':
          description: Cuenta del residente.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MiCuenta' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'

  /mi-cuenta/pagos:
    post:
      tags: [Finanzas]
      operationId: enviarPago
      summary: Informar una transferencia con su comprobante
      description: |
        Permiso: `cuenta.propia`. Multipart. Se eligen cuotas **desde la más antigua y completas**; el monto es lo que suman
        menos el saldo a favor (lo calcula el servidor). Queda `pendiente` hasta que la administración lo apruebe: no cambia
        ninguna cuota todavía. Comprobante: JPG, PNG o PDF de hasta 5 MB. Hasta 6 envíos por minuto.
        403 `UNIDAD_NO_ES_TUYA`, `NO_PUEDES_PAGAR_ESTA_UNIDAD`; 409 `SIN_CUENTA_BANCARIA`, `CUOTAS_EN_REVISION`,
        `COMPROBANTE_DUPLICADO`, `NADA_QUE_TRANSFERIR`; 422 `CUOTAS_NO_VALIDAS`.
      x-permiso: cuenta.propia
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [unidad_id, cuotas, numero_comprobante, comprobante]
              properties:
                unidad_id: { type: integer }
                cuotas: { type: array, minItems: 1, maxItems: 24, items: { type: integer } }
                numero_comprobante: { type: string, minLength: 3, maxLength: 40 }
                comprobante: { type: string, format: binary }
      responses:
        '201':
          description: Pago en revisión.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [pago_id, monto, estado, cuenta]
                    properties:
                      pago_id: { type: integer }
                      monto: { type: string, examples: ['160.00'] }
                      estado: { type: string, enum: [pendiente] }
                      cuenta: { $ref: '#/components/schemas/MiCuenta' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          description: Código de error en `error.code` (ver la descripción).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /pagos:
    get:
      tags: [Finanzas]
      operationId: listarPagos
      summary: Pagos de los residentes por estado
      description: |
        Permiso: `pagos.aprobar`. Por defecto los pendientes (los más antiguos primero); `aprobado` y `rechazado` salen
        del más reciente al más antiguo (hasta 200). `meta.conteos` trae cuántos hay en cada estado y `meta.tolerancia`
        la tolerancia bancaria vigente.
      x-permiso: pagos.aprobar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: estado, in: query, schema: { type: string, enum: [pendiente, aprobado, rechazado], default: pendiente } }
      responses:
        '200':
          description: Pagos.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PagoResumen' } }
                  meta:
                    type: object
                    properties:
                      conteos: { type: object, properties: { pendiente: { type: integer }, aprobado: { type: integer }, rechazado: { type: integer } } }
                      tolerancia: { type: string, examples: ['0.50'] }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'

  /pagos/aprobar-lote:
    post:
      tags: [Finanzas]
      operationId: aprobarPagosEnLote
      summary: Aprobar varios pagos con lo declarado
      description: |
        Permiso: `pagos.aprobar`. Cada pago es su propia transacción. Solo pasan los que superan todas las validaciones;
        el resto responde `VALIDACION_FALLIDA` y queda pendiente. `meta` cuenta aprobados y omitidos.
      x-permiso: pagos.aprobar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 100, items: { type: integer } }
      responses:
        '200':
          description: Resultado por pago.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, ok, codigo, mensaje]
                      properties:
                        id: { type: integer }
                        ok: { type: boolean }
                        codigo: { type: [string, 'null'] }
                        mensaje: { type: [string, 'null'] }
                  meta:
                    type: object
                    properties:
                      aprobados: { type: integer }
                      omitidos: { type: integer }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'

  /pagos/{pago}:
    get:
      tags: [Finanzas]
      operationId: verPago
      summary: Un pago con su comprobante, validaciones y vista previa de la aplicación
      description: |
        Permiso: `pagos.aprobar`. `comprobante_url` es un enlace temporal (10 minutos) del bucket privado. En un pago
        pendiente, `validaciones` y `aplicacion` dicen qué pasaría al aprobarlo: cuántas cuotas completas se pagan,
        los centavos que absorbe la tolerancia y cuánto queda como saldo a favor.
      x-permiso: pagos.aprobar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: pago, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Pago.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PagoDetalle' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /pagos/{pago}/aprobar:
    post:
      tags: [Finanzas]
      operationId: aprobarPago
      summary: Aprobar un pago
      description: |
        Permiso: `pagos.aprobar`. Lo recibido (por defecto lo declarado, o `monto_recibido` si se confirma otro contra el
        banco) más el saldo a favor se aplica a las cuotas **completas, de la más antigua a la más reciente**; si falta
        menos que la tolerancia bancaria para completar una, se da por pagada y esos centavos quedan como ajuste; lo que
        sobra queda a favor. Se numera el recibo (consecutivo por condominio) y se avisa al residente por correo.
        409 `PAGO_NO_PENDIENTE`; 422 `MONTO_INVALIDO`.
      x-permiso: pagos.aprobar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: pago, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                monto_recibido: { type: [string, number, 'null'], description: 'Hasta dos decimales.', examples: ['79.60'] }
      responses:
        '200':
          description: Pago aprobado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PagoDetalle' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`PAGO_NO_PENDIENTE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /pagos/{pago}/rechazar:
    post:
      tags: [Finanzas]
      operationId: rechazarPago
      summary: Rechazar un comprobante
      description: |
        Permiso: `pagos.aprobar`. El motivo es obligatorio y se le envía al residente. Las cuotas quedan libres y el número
        de comprobante se puede volver a usar. 409 `PAGO_NO_PENDIENTE`.
      x-permiso: pagos.aprobar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: pago, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200':
          description: Pago rechazado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PagoDetalle' }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`PAGO_NO_PENDIENTE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /pagos/{pago}/recibo:
    get:
      tags: [Finanzas]
      operationId: reciboDePago
      summary: Recibo en PDF de un pago aprobado
      description: |
        Permiso: `finanzas.ver`. Número consecutivo del condominio, unidad, pagador, cuotas pagadas y
        total. La cédula sale completa solo con `residentes.ver_datos`. No es una factura electrónica. 409 `PAGO_SIN_RECIBO`.
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: pago, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`PAGO_SIN_RECIBO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /mi-cuenta/pagos/{pago}/recibo:
    get:
      tags: [Finanzas]
      operationId: miReciboDePago
      summary: Mi recibo en PDF
      description: 'Permiso: `cuenta.propia`. Solo de pagos aprobados de las unidades de la cuenta; el de otra unidad responde 404.'
      x-permiso: cuenta.propia
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: pago, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`PAGO_SIN_RECIBO`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /finanzas/cuotas:
    get:
      tags: [Finanzas]
      operationId: cuotasDelMes
      summary: Cuotas del mes, una fila por unidad
      description: |
        Permiso: `finanzas.ver`. Una fila por unidad con lo emitido, lo pagado y su estado del mes: `pagada`, `por_aprobar`
        (hay un pago en revisión que declara ese mes), `vencida` o `pendiente` (no se cruzan). `meta.resumen` trae lo
        emitido, cobrado (con porcentaje), por aprobar y lo vencido de meses anteriores; `meta.conteos`, cuántas unidades
        hay en cada estado. Sin `periodo`, el mes en curso.
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: periodo, in: query, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }
        - { name: filtro, in: query, schema: { type: string, enum: [todas, pendiente, por_aprobar, vencida, pagada], default: todas } }
        - { name: buscar, in: query, description: Código de la unidad o nombre del responsable., schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: por_pagina, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Cuotas del mes.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CuotaUnidad' } }
                  meta: { $ref: '#/components/schemas/CuotasDelMesMeta' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'

  /finanzas/cuotas-extraordinarias:
    post:
      tags: [Finanzas]
      operationId: crearCuotaExtraordinaria
      summary: Cobrar una cuota extraordinaria
      description: |
        Permiso: `cuotas.emitir`. A todas las unidades que pagan cuota. `modo` = `por_unidad` (el mismo `monto` a cada
        una) o `alicuota` (`monto` es el total y se reparte según la alícuota, sin perder ni sobrar centavos; todas
        necesitan alícuota). No sirve en un mes cerrado ni con vencimiento pasado. 409 `EXTRAORDINARIA_EXISTENTE`,
        `PERIODO_CERRADO`, `SIN_UNIDADES_A_COBRAR`; 422 `VENCIMIENTO_PASADO`, `UNIDADES_SIN_ALICUOTA`.
      x-permiso: cuotas.emitir
      parameters:
        - $ref: '#/components/parameters/CondominioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [detalle, periodo, vence_el, modo, monto]
              properties:
                detalle: { type: string, minLength: 3, maxLength: 80, examples: ['Pintura de fachada'] }
                periodo: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
                vence_el: { type: string, format: date }
                modo: { type: string, enum: [por_unidad, alicuota] }
                monto: { type: string, examples: ['45.00'] }
      responses:
        '201':
          description: Creada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [creadas, total, vence_el]
                    properties:
                      creadas: { type: integer }
                      total: { type: string }
                      vence_el: { type: string, format: date }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '409':
          description: Código de error en `error.code` (ver la descripción).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/Validacion'

  /unidades/{unidad}/estado-cuenta:
    get:
      tags: [Finanzas]
      operationId: estadoDeCuenta
      summary: Estado de cuenta de una unidad
      description: |
        Permiso: `finanzas.ver`. Cargos (cuotas) y abonos (pagos aprobados, más el ajuste por tolerancia) con el saldo
        corriente: se calcula siempre de los movimientos y un saldo negativo es a favor. `desde`/`hasta` recortan lo que se
        muestra; `saldo_inicial` es el saldo antes del rango. `saldo_pendiente` ya descuenta el saldo a favor.
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: unidad, in: path, required: true, schema: { type: integer } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Estado de cuenta.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/EstadoCuenta' }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'

  /unidades/{unidad}/estado-cuenta/pdf:
    get:
      tags: [Finanzas]
      operationId: estadoDeCuentaPdf
      summary: Estado de cuenta de una unidad en PDF
      description: 'Permiso: `finanzas.ver`. Los mismos datos y saldo que la pantalla. Acepta `desde` y `hasta`.'
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: unidad, in: path, required: true, schema: { type: integer } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /unidades/{unidad}/pagos-efectivo:
    post:
      tags: [Finanzas]
      operationId: registrarPagoEfectivo
      summary: Registrar un pago en efectivo
      description: |
        Permiso: `pagos.aprobar`. No hay comprobante que revisar: se aprueba en el acto con las mismas reglas de aplicación
        (cuotas completas de la más antigua en adelante, tolerancia, saldo a favor) y sale su recibo. Quien paga queda
        como el responsable de pago de la unidad. Hasta 6 por minuto. 422 `MONTO_INVALIDO`, `FECHA_FUTURA`.
      x-permiso: pagos.aprobar
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: unidad, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monto]
              properties:
                monto: { type: string, examples: ['80.00'] }
                fecha: { type: [string, 'null'], format: date, description: Por defecto hoy. No puede ser futura. }
      responses:
        '201':
          description: Pago registrado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [pago_id, monto, recibo]
                    properties:
                      pago_id: { type: integer }
                      monto: { type: string }
                      recibo: { type: string, examples: ['000358'] }
                  message: { type: string }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/Validacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /proveedores:
    get:
      tags: [Finanzas]
      operationId: listarProveedores
      summary: Proveedores con saldo, estado y cuenta para pagos
      description: |
        Permiso: `finanzas.ver`. Cada proveedor trae lo que se le debe, su estado (`sin_facturas`, `por_aprobar`,
        `vence_pronto` a 7 días o menos, `al_dia`), su cuenta vigente y el cambio de cuenta en espera si lo hay.
        `meta.conteos` cuenta los tres filtros.
      x-permiso: finanzas.ver
      parameters:
        - $ref: '#/components/parameters/CondominioId'
        - { name: filtro, in: query, schema: { type: string, enum: [todos, con_saldo, cuenta_en_cambio] } }
        - { name: buscar, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        '200':
          description: Proveedores activos por razón social.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Proveedor' } }
                  meta:
                    type: object
                    properties:
                      conteos: { type: object, additionalProperties: { type: integer } }
        '400':
          $ref: '#/components/responses/CondominioRequerido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoOCondominio'
        '422':
          $ref: '#/components/responses/Validacion'
    post:
      tags: [Finanzas]
      operationId: crearProveedor
      summary: Agregar un proveedor
      description: 'Permiso: `proveedores.editar`. El RUC (13 dígitos) no se repite en el condominio (409 `PROVEEDOR_DUPLICADO`) ni se cambia después.'
      x-permiso: proveedores.editar
      parameters:
