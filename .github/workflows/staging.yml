name: Staging

# Construye la imagen de producción en cada cambio a main. El despliegue a AWS
# (ECR + ECS) queda apagado hasta que se configure el ambiente: ver docs/staging.md.
# Mientras la variable STAGING_HABILITADO no sea "true", solo se valida que la imagen compile.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue a la vez; uno nuevo no cancela el que está corriendo.
concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  imagen:
    name: Imagen de producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Sin push: comprueba que el Dockerfile (etapa prod) y composer --no-dev funcionan.
      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Desplegar a staging
    needs: imagen
    # Apagado por defecto: no falla ni toca AWS si el ambiente no está configurado.
    if: ${{ vars.STAGING_HABILITADO == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write      # OIDC con AWS: no se guardan llaves de larga duración
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      # Servicios ECS y su familia de task definition, separados por coma: api,worker,scheduler
      ECS_SERVICES: ${{ vars.ECS_SERVICES }}
      MIGRACION_SUBREDES: ${{ vars.ECS_SUBREDES }}
      MIGRACION_GRUPO_SEGURIDAD: ${{ vars.ECS_GRUPO_SEGURIDAD }}
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_STAGING }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Entrar a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Construir y publicar la imagen
        id: imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cada servicio apunta a una nueva revisión de su task definition con la imagen de este commit.
      - name: Registrar nuevas task definitions
        id: taskdef
        env:
          IMAGEN: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          for servicio in ${ECS_SERVICES//,/ }; do
            aws ecs describe-task-definition --task-definition "$servicio" --query taskDefinition \
              | jq --arg imagen "$IMAGEN" '
                  .containerDefinitions |= map(.image = $imagen)
                  | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                        .compatibilities, .registeredAt, .registeredBy)' > "td-$servicio.json"
            arn=$(aws ecs register-task-definition --cli-input-json "file://td-$servicio.json" \
              --query taskDefinition.taskDefinitionArn --output text)
            echo "$servicio=$arn" >> "$GITHUB_OUTPUT"
          done

      # Migraciones con el usuario dueño (nunca con la conexión de la app) antes de cambiar el código.
      - name: Migrar la base y sembrar catálogos
        env:
          TASKDEF_API: ${{ steps.taskdef.outputs.api }}
        run: |
          set -euo pipefail
          arn=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" --launch-type FARGATE --task-definition "$TASKDEF_API" \
            --network-configuration "awsvpcConfiguration={subnets=[$MIGRACION_SUBREDES],securityGroups=[$MIGRACION_GRUPO_SEGURIDAD],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["sh","-c","php artisan migrate --database=pgsql_owner --force && php artisan db:seed --class=CatalogosSeeder --force && php artisan db:seed --class=RolesYPermisosSeeder --force && php artisan db:seed --class=MenuSeeder --force"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$arn"
          codigo=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$arn" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$codigo" != "0" ]; then
            echo "::error title=Migraciones::falló con código $codigo; no se despliega el código nuevo"
            exit 1
          fi

      - name: Actualizar los servicios
        env:
          SALIDAS: ${{ toJson(steps.taskdef.outputs) }}
        run: |
          set -euo pipefail
          IFS=',' read -ra nombres <<< "$ECS_SERVICES"
          for servicio in "${nombres[@]}"; do
            arn=$(echo "$SALIDAS" | jq -r --arg s "$servicio" '.[$s]')
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$servicio" --task-definition "$arn" > /dev/null
          done
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "${nombres[@]}"
