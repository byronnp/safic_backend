name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contrato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint del contrato OpenAPI
        run: npx --yes @redocly/cli@2.57.0 lint docs/openapi.yaml

  tests:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_PASSWORD: safic_app_ci
      DB_MIGRATION_PASSWORD: safic_owner_ci

    steps:
      - uses: actions/checkout@v4

      - name: Crear usuarios y bases de SAFIC
        env:
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          SAFIC_APP_PASSWORD: safic_app_ci
          SAFIC_OWNER_PASSWORD: safic_owner_ci
        run: |
          sed 's/psql /psql -h 127.0.0.1 /' docker/postgres/init/01-roles.sh > /tmp/init.sh
          bash /tmp/init.sh

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, redis, intl, gd, zip, bcmath, pcntl
          coverage: none

      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/; s/^DB_PASSWORD=.*/DB_PASSWORD=safic_app_ci/; s/^DB_MIGRATION_PASSWORD=.*/DB_MIGRATION_PASSWORD=safic_owner_ci/' .env
          php artisan key:generate
          php artisan safic:jwt-keys

      - name: Estilo (Pint)
        run: vendor/bin/pint --test

      - name: Análisis estático (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pruebas (Pest)
        run: vendor/bin/pest --log-junit pest-junit.xml

      # Muestra cada prueba fallida como anotación en el pull request.
      - name: Fallos de Pest como anotaciones
        if: failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, os
          if not os.path.exists('pest-junit.xml'):
              raise SystemExit(0)
          for caso in ET.parse('pest-junit.xml').iter('testcase'):
              for fallo in list(caso.findall('failure')) + list(caso.findall('error')):
                  texto = (fallo.text or fallo.get('message') or '').strip().replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::error file={caso.get('file', '')},line={caso.get('line', '1')},title={caso.get('name', '')[:120]}::{texto[:3000]}")
          PY
