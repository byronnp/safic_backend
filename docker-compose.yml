# SAFIC backend · entorno local
# Uso: make setup (primera vez) y luego make up. Ver README.md.
# Laravel lee el archivo .env montado en /var/www/html (no se pasa como variables
# de entorno para que key:generate y cambios en .env apliquen sin recrear contenedores).

x-api: &api
  image: safic/api:dev
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  volumes:
    - ./:/var/www/html
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local}
      SAFIC_OWNER_PASSWORD: ${DB_MIGRATION_PASSWORD:-safic_owner_local}
      SAFIC_APP_PASSWORD: ${DB_PASSWORD:-safic_app_local}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safic"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  api:
    <<: *api
    user: root            # supervisord arranca como root y php-fpm/nginx bajan a www-data
    ports: ["8000:8080"]

  worker:
    <<: *api
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600

  scheduler:
    <<: *api
    restart: unless-stopped
    command: php artisan schedule:work

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025"]

  # S3 local. API en :9002, consola en http://localhost:9003 (usuario/clave de MINIO_ROOT_*).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-safic_minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-safic_minio_local}
    volumes:
      - minio_data:/data
    ports: ["${MINIO_PORT:-9002}:9000", "${MINIO_CONSOLA_PORT:-9003}:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  # Crea el bucket privado la primera vez y termina.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASS} &&
      mc mb --ignore-existing local/$${BUCKET} &&
      mc anonymous set none local/$${BUCKET}"
    environment:
      MINIO_USER: ${AWS_ACCESS_KEY_ID:-safic_minio}
      MINIO_PASS: ${AWS_SECRET_ACCESS_KEY:-safic_minio_local}
      BUCKET: ${AWS_BUCKET:-safic-archivos}

volumes:
  db_data:
  minio_data:

# Red con nombre fijo para que el frontend (otro repositorio) se conecte a "api".
networks:
  default:
    name: safic
